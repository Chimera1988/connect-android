name: Connect Native - Media 100MB, TUS upload and voice status
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/connect-native-media-bundle.yml
permissions:
  contents: write
concurrency:
  group: connect-native-media-bundle
  cancel-in-progress: false
jobs:
  integrate-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout Connect Android
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Wait for albums workflow and sync latest main
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 48); do
            git fetch origin main
            if git cat-file -e origin/main:native/src/ConnectNativeAlbum.tsx 2>/dev/null; then
              git checkout -B main origin/main
              echo 'Albums are installed. Starting combined media update.'
              exit 0
            fi
            echo "Waiting for albums integration: $attempt / 48"
            sleep 15
          done
          echo 'Albums not installed. Check the albums workflow before retrying.' >&2
          exit 1
      - name: Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - name: Integrate TUS uploads and Android chat polish
        shell: bash
        run: |
          python3 - <<'PY_MEDIA_BUNDLE'
          from pathlib import Path
          import base64,hashlib,zlib,subprocess,runpy
          
          # Require the previous green album integration. Nothing touches legacy app/.
          if not Path('native/src/ConnectNativeAlbum.tsx').exists():
              raise SystemExit('Complete the PWA-compatible albums workflow first (green).')
          
          media=Path('native/src/nativeMediaUtils.ts')
          actual=subprocess.check_output(['git','hash-object',str(media)],text=True).strip()
          if actual not in ('ef32732a887b2b2e691a86855110d04849ee6308','2501fcbdc1230b0b0695b7c1587d92631fb0450e'):
              raise SystemExit('nativeMediaUtils.ts was changed; refusing to overwrite unreviewed edits: '+actual)
          
          assets=[
              ('native/src/nativeMediaUtils.ts','7a1808159aebaf3995818893738459ccf6373e8b57b622b23d0633c3e0a8ef3e',''),
              ('native/.connect_media_bundle_patch.py','ea72e97b7a66132ec9613e94c957ee988a190c5b7fb7307da2502deb51295863',''),
          ]
          for target,expected,packed in assets:
              data=zlib.decompress(base64.b64decode(packed))
              if hashlib.sha256(data).hexdigest()!=expected:
                  raise SystemExit('Embedded content checksum failure: '+target)
              dest=Path(target)
              dest.parent.mkdir(parents=True,exist_ok=True)
              if dest.exists() and target.endswith('_patch.py') and dest.read_bytes()!=data:
                  raise SystemExit('Refusing to overwrite unexpected installer script: '+target)
              dest.write_bytes(data)
          try:
              runpy.run_path('native/.connect_media_bundle_patch.py',run_name='__main__')
          finally:
              Path('native/.connect_media_bundle_patch.py').unlink(missing_ok=True)
          print('100 MB TUS + chat/media progress + voice indicator integrated')
          PY_MEDIA_BUNDLE
      - name: Install pinned TUS client and check TypeScript
        working-directory: native
        env:
          CI: '1'
          EXPO_NO_TELEMETRY: '1'
        run: |
          npm install tus-js-client@4.3.1 --save-exact --no-audit --no-fund
          npm run typecheck
      - name: Generate native Android source
        working-directory: native
        env:
          CI: '1'
          EXPO_NO_TELEMETRY: '1'
        run: npx expo prebuild --platform android --no-install --clean
      - name: Install Android SDK 37
        run: |
          sdkmanager --channel=3 --install 'platforms;android-37.0' 'build-tools;37.0.0' 'platform-tools'
          test -s "${ANDROID_SDK_ROOT}/platforms/android-37.0/android.jar"
      - name: Compile native Android for validation only
        working-directory: native/android
        env:
          CI: '1'
          EXPO_NO_TELEMETRY: '1'
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon --stacktrace
          test -s app/build/outputs/apk/debug/app-debug.apk
      - name: Commit sources only after passing TypeScript and Android build
        shell: bash
        run: |
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add native/src/nativeMediaUtils.ts native/src/ConnectNativeChat.tsx native/src/ConnectNativeMedia.tsx native/package.json native/package-lock.json
          if git diff --cached --quiet; then echo 'Media bundle already integrated'; exit 0; fi
          git commit -m 'feat(native): combined 100MB TUS uploads, progress and voice indicators'
          git push origin HEAD:main
