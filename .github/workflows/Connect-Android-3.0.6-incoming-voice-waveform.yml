name: Connect Android 3.0.6 | Restore incoming voice waveform

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: connect-android-306-incoming-voice-wave-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-test-apk:
    if: github.repository == 'Chimera1988/connect-android' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
      EXPO_PUBLIC_SUPABASE_URL: https://tpwkmoxxzjfdsqsomhhr.supabase.co
      EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_tAg8rPwuBNcA2iPF7voc2Q_vsKUpyZa
      EXPO_PUBLIC_CONNECT_URL: https://connect-chat.duckdns.org

    steps:
      - name: Checkout the already verified Android 3.0.6 sources
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Guard version and audited source snapshot
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$(git rev-parse HEAD)" || {
            echo '::error::SOURCE_DRIFT: Android main changed since this workflow started'; exit 1;
          }
          test -s native/PARITY_SOURCE_LOCK.json
          test -s native/scripts/check-parity-source.mjs
          (
            cd native
            node scripts/check-parity-source.mjs
          )
          python3 - <<'PY'
          import json
          from pathlib import Path
          config = json.loads(Path('native/app.json').read_text(encoding='utf8'))['expo']
          assert config['version'] == '3.0.6'
          assert config['android']['versionCode'] == 24
          assert config['android']['package'] == 'com.connect.messenger'
          plugins = config['plugins']
          minimum = [p[1]['android']['minSdkVersion'] for p in plugins
                     if isinstance(p,list) and p[0]=='expo-build-properties']
          assert minimum == [29], minimum
          assert './plugins/withConnectRelease' in plugins
          print('Connect 3.0.6 (24), Android 10+, source lock verified')
          PY
          # 2026-11-16: PWA advanced by exactly two reviewed commits:
          # 8e1a568 (workflow upload) and 7e28b803 (voice waveform restoration).
          # This update restores the same waveform behavior in Android using the
          # existing local audio cache. Keep all original source-hash checks.
          expected=$(python3 -c "import json;print(json.load(open('native/PARITY_SOURCE_LOCK.json'))['pwaSha'])")
          reviewed_pwa='7e28b80363243f5d6220a692af952673bf6f1261'
          actual=$(git ls-remote https://github.com/Chimera1988/connect-messenger.git refs/heads/main | cut -f1)
          if test "$actual" = "$expected"; then
            echo 'PWA unchanged from audited Android snapshot.'
          elif test "$actual" = "$reviewed_pwa"; then
            echo 'PWA contains reviewed 2026-11-16 waveform commits; native counterpart will be applied.'
          else
            echo "::error::SOURCE_DRIFT: unreviewed PWA main: ${actual:-unavailable}; accepted only ${expected} or ${reviewed_pwa}"
            exit 1
          fi

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: native/package-lock.json

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Apply reviewed Android incoming voice waveform restoration
