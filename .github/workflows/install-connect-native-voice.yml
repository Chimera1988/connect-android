name: Connect Native - WebRTC calls and Android audio (Promise fix)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/install-connect-native-voice.yml'

permissions:
  contents: write

concurrency:
  group: connect-native-voice
  cancel-in-progress: false

jobs:
  install-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout Connect Android
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Use Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configure Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - name: Add Connect voice signaling and native audio UI
        shell: bash
        run: |
          python3 - <<'PYVOICE'
          from pathlib import Path
          import base64,json,zlib
          root=Path('native')
          file=root/'src/ConnectNativeVoice.tsx'
          source=zlib.decompress(base64.b64decode('')).decode('utf-8')
          if not (root/'src/App.tsx').exists() or not (root/'src/ConnectNativePush.ts').exists():
              raise RuntimeError('Connect Native with FCM must be installed first')
          if file.exists() and file.read_text(encoding='utf-8')!=source:
              raise RuntimeError('Voice module already has manual edits; refusing to overwrite')
          file.write_text(source,encoding='utf-8')
          
          def replace_one(s,old,new,label):
              if new in s:
                  print('Already installed:',label);return s
              if s.count(old)==1:return s.replace(old,new,1)
              raise RuntimeError(f'Cannot safely patch {label}: expected one original anchor, found {s.count(old)}')
          
          app=root/'src/App.tsx'
          s=app.read_text(encoding='utf-8')
          s=replace_one(s,"import ConnectNativeMedia from './ConnectNativeMedia';", "import ConnectNativeMedia from './ConnectNativeMedia';\nimport {useConnectNativeVoice,ConnectNativeVoicePanel} from './ConnectNativeVoice';", 'voice import')
          s=replace_one(s,"  const ownId=session?.user.id||'';", "  const ownId=session?.user.id||'';\n  const voice=useConnectNativeVoice(ownId,profiles);",'voice controller')
          s=replace_one(s,"      setNotice('Поступил звонок. Нативное соединение WebRTC ещё в разработке.');", "      void voice.checkIncoming(pushDestination.callId);",'incoming call FCM route')
          s=replace_one(s,"      onCall={()=>Alert.alert('Аудиозвонки','Нативный WebRTC + Android Telecom в работе. Пока звонить можно из действующего APK.')} />;", "      onCall={()=>void voice.dial(screen.conversation.id,screen.peer.id,screen.peer.display_name)} />;",'outgoing chat call')
          s=replace_one(s,"    if(tab==='calls')return <ConnectNativeCalls ownerId={ownId} profiles={profiles} avatars={avatars} colors={colors}/>;", "    if(tab==='calls')return <ConnectNativeCalls ownerId={ownId} profiles={profiles} avatars={avatars} colors={colors}\n      onDial={(conversationId,peer)=>void voice.dial(conversationId,peer.id,peer.display_name)}/>;",'call history dial')
          s=replace_one(s,"    {!!notice&&<Pressable style={s.toast}", "    <ConnectNativeVoicePanel voice={voice} colors={colors}/>\n    {!!notice&&<Pressable style={s.toast}", 'call screen overlay')
          app.write_text(s,encoding='utf-8')
          
          journal=root/'src/ConnectNativeCalls.tsx'
          s=journal.read_text(encoding='utf-8')
          s=replace_one(s, "export default function ConnectNativeCalls({ownerId,profiles,avatars,colors}:{ownerId:string;profiles:Profile[];avatars:Record<string,string>;colors:Palette}) {",
           "export default function ConnectNativeCalls({ownerId,profiles,avatars,colors,onDial}:{ownerId:string;profiles:Profile[];avatars:Record<string,string>;colors:Palette;onDial?:(conversationId:string,peer:Profile)=>void}) {",'history callback declaration')
          s=replace_one(s,"return <Pressable onPress={()=>{if(selecting)setSelected(x=>x.includes(item.id)?x.filter(y=>y!==item.id):[...x,item.id]);}}",
           "return <Pressable onPress={()=>{if(selecting)setSelected(x=>x.includes(item.id)?x.filter(y=>y!==item.id):[...x,item.id]);else if(peer&&onDial)onDial(item.conversation_id,peer);}}",'history callback wiring')
          journal.write_text(s,encoding='utf-8')
          
          cfg_path=root/'app.json'
          cfg=json.loads(cfg_path.read_text(encoding='utf-8'))
          android=cfg['expo']['android']
          for permission in ('ACCESS_NETWORK_STATE','CHANGE_NETWORK_STATE','MODIFY_AUDIO_SETTINGS','BLUETOOTH_CONNECT'):
              if permission not in android['permissions']:android['permissions'].append(permission)
          cfg_path.write_text(json.dumps(cfg,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          
          pkg_path=root/'package.json'
          pkg=json.loads(pkg_path.read_text(encoding='utf-8'))
          for key,value in {'react-native-webrtc':'155.0.1','react-native-incall-manager':'4.3.0'}.items():
              current=pkg['dependencies'].get(key)
              if current is not None and current!=value:raise RuntimeError(f'Unexpected {key} version {current}')
              pkg['dependencies'][key]=value
          pkg_path.write_text(json.dumps(pkg,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          
          readme=root/'README.md'
          text=readme.read_text(encoding='utf-8')
          if '## Native audio calls (foreground)' not in text:
              text+="""\n## Native audio calls (foreground)\n- Audio WebRTC calls use existing Connect `connect_calls` RPC and `connect_call_ice` tables.\n- Callers notify the existing Connect server via `/api/push/call`; TURN credentials come from authenticated `/api/calls/ice`.\n- Android mic, earpiece/speaker routing, mute and audio focus use react-native-webrtc and react-native-incall-manager. No WebView.\n- Incoming calls appear while the native application is open; FCM taps resync pending calls.\n- Android Telecom / ConnectionService, full-screen locked-phone incoming UI, background media services, ringtone selection and real-device network testing remain necessary before replacement of the old APK.\n- Audio RTC is not a replacement for Android's system volume APIs; hardware volume controls remain authoritative.\n"""
              readme.write_text(text,encoding='utf-8')
          print('Native Connect foreground WebRTC voice modules prepared; old app/ unchanged')
          PYVOICE
      - name: Install native voice dependencies and typecheck
        working-directory: native
        env:
          CI: '1'
          EXPO_NO_TELEMETRY: '1'
        run: |
          npm install --no-audit --no-fund
          npm run typecheck
      - name: Generate native Android sources
        working-directory: native
        env:
          CI: '1'
          EXPO_NO_TELEMETRY: '1'
        run: |
          npx expo prebuild --platform android --no-install --clean
          grep -q 'com.connect.messenger' android/app/build.gradle
          test -s android/app/google-services.json
      - name: Install preview Android SDK
        shell: bash
        run: |
          # Expo SDK 58 compiles against Android 17 preview (API 37.0).
          sdkmanager --channel=3 --install 'platforms;android-37.0' 'build-tools;37.0.0' 'platform-tools'
          test -s "${ANDROID_SDK_ROOT}/platforms/android-37.0/android.jar"
      - name: Compile native APK for CI only
        working-directory: native/android
        env:
          CI: '1'
          EXPO_NO_TELEMETRY: '1'
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon --stacktrace
          test -s app/build/outputs/apk/debug/app-debug.apk
      - name: Commit only after successful native compilation
        shell: bash
        run: |
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add native/src/ConnectNativeVoice.tsx native/src/App.tsx native/src/ConnectNativeCalls.tsx native/app.json native/package.json native/package-lock.json native/README.md
          if git diff --cached --quiet; then
            echo 'Native voice modules already installed.'
            exit 0
          fi
          git commit -m 'feat(native): Connect audio WebRTC with Android audio controls'
          git push origin HEAD:main
