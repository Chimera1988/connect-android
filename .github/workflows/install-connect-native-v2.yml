          repo=pathlib.Path('.').resolve()
          with zipfile.ZipFile(io.BytesIO(raw)) as archive:
              for entry in archive.namelist():
                  dest=(repo/entry).resolve()
                  if not entry.startswith('native/') or not dest.is_relative_to(repo/'native'):
                      raise RuntimeError('Untrusted entry path: '+entry)
                  if dest.exists() and dest.is_file():
                      # Installer updates its own source tree only; no Android app/ edits.
                      pass
                  dest.parent.mkdir(parents=True,exist_ok=True)
                  dest.write_bytes(archive.read(entry))
          print('New native files installed; existing app/ untouched')
          PYINSTALL
      - name: Install and align Expo dependencies
        working-directory: native
        run: |
          npm install --no-audit --no-fund
          npx expo install --fix --npm
      - name: Validate TypeScript
        working-directory: native
        run: npx tsc --noEmit
      - name: Commit native source only, not a replacement APK
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add native
          if git diff --cached --quiet; then
            echo 'Native source is already installed.'
            exit 0
          fi
          git commit -m 'feat(android): start full native Connect v2 without WebView'
          git push origin HEAD:main
