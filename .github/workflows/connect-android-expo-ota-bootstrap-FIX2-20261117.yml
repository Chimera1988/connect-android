name: Connect Android | Expo OTA bootstrap 2026-11-17

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: connect-android-expo-ota-bootstrap
  cancel-in-progress: false

jobs:
  configure-ota:
    name: Safely link existing Connect Android to Expo Update (NO APK)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
      EXPO_PROJECT_ID: 430c7f08-3921-48d5-96d1-f7c3d686d3bf
      OTA_RUNTIME: connect-android-ota-v1-sdk58
      EXPO_PUBLIC_SUPABASE_URL: https://tpwkmoxxzjfdsqsomhhr.supabase.co
      NEXT_PUBLIC_SUPABASE_URL: https://tpwkmoxxzjfdsqsomhhr.supabase.co
      EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_tAg8rPwuBNcA2iPF7voc2Q_vsKUpyZa
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_tAg8rPwuBNcA2iPF7voc2Q_vsKUpyZa
    steps:
      - name: Checkout Connect Android main with full history
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Guard exact repository and unchanged production identity
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'Chimera1988/connect-android'
          test "$GITHUB_REF" = 'refs/heads/main'
          test -s native/app.json
          test -s native/package-lock.json
          test -s native/PARITY_SOURCE_LOCK.json
          test -s native/web/app/page.tsx
          test -s native/scripts/embed-web.mjs
          test ! -e native/tests/connect-ota-config-20261117.test.cjs
          python3 - <<'PY'
          import json
          from pathlib import Path
          e=json.loads(Path('native/app.json').read_text())['expo']
          assert e['slug']=='connect-native-v2'
          assert e['android']['package']=='com.connect.messenger'
          assert e['version']=='3.0.6' and e['android']['versionCode']==24, 'Baseline changed. Review upgrade rather than guessing.'
          assert e.get('updates',{}).get('url') is None, 'OTA configured already: do not re-run bootstrap'
          assert 'expo-updates' not in json.loads(Path('native/package.json').read_text())['dependencies']
          print('Connect native baseline confirmed; signing configuration will not be touched.')
          PY

      - name: Install Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: native/package-lock.json

      - name: Verify existing reviewed source and install exact baseline dependencies
        working-directory: native
        shell: bash
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          node scripts/check-parity-source.mjs

      - name: Install Expo SDK 58 matching expo-updates (no Expo Build)
        working-directory: native
        shell: bash
        run: |
          set -euo pipefail
          npx --no-install expo install expo-updates --npm
          # Pin the resolved SDK-compatible library, including package-lock.json.
          node - <<'JS'
          const fs=require('fs');
          const p=JSON.parse(fs.readFileSync('package.json','utf8'));
          const v=JSON.parse(fs.readFileSync('node_modules/expo-updates/package.json','utf8')).version;
          if(!/^\d+\.\d+\.\d+$/.test(v))throw Error('Unsafe pre-release expo-updates version: '+v);
          p.dependencies['expo-updates']=v;
          fs.writeFileSync('package.json',JSON.stringify(p,null,2)+'\n');
          console.log('Pinned SDK-compatible expo-updates',v);
          JS
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm ci --no-audit --no-fund

      - name: Configure one pinned native OTA runtime and production channel
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          project='430c7f08-3921-48d5-96d1-f7c3d686d3bf'
          path=Path('native/app.json')
          config=json.loads(path.read_text())
          app=config['expo']
          assert app['android']['package']=='com.connect.messenger'
          # GitHub Actions builds the APK, not EAS Build: set channel IN app.json.
          app['runtimeVersion']='connect-android-ota-v1-sdk58'
          app['updates']={
            'enabled':True,
            'url':f'https://u.expo.dev/{project}',
            'checkAutomatically':'ON_LOAD',
            'fallbackToCacheTimeout':0,
            'requestHeaders':{'expo-channel-name':'production'},
          }
          app.setdefault('extra',{}).setdefault('eas',{})['projectId']=project
          path.write_text(json.dumps(config,indent=2,ensure_ascii=False)+'\n')
          print('Linked existing app to Expo project; APK signature and version are unchanged.')
          PY

      - name: Update only three approved release source hashes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json
          p=Path('native/PARITY_SOURCE_LOCK.json')
          lock=json.loads(p.read_text())
          for rel in ('package.json','package-lock.json','app.json'):
            assert rel in lock['files'], 'Required source lock missing: '+rel
            lock['files'][rel]=hashlib.sha256((Path('native')/rel).read_bytes()).hexdigest()
          p.write_text(json.dumps(lock,indent=2,ensure_ascii=False)+'\n')
          print('Retained',len(lock['files']),'file checks; updated only SDK dependency/config hashes.')
          PY

      - name: Add regression tests for identity, channel, runtime and lock
        shell: bash
        run: |
          set -euo pipefail
          cat > native/tests/connect-ota-config-20261117.test.cjs <<'TEST'
          const {test}=require('node:test');
          const assert=require('node:assert/strict');
          const fs=require('node:fs');
          const path=require('node:path');
          const crypto=require('node:crypto');
          const root=path.join(__dirname,'..');
          const read=(name)=>fs.readFileSync(path.join(root,name));
          const app=JSON.parse(read('app.json')).expo;
          test('existing production Connect Android package and version remain intact',()=>{
            assert.equal(app.android.package,'com.connect.messenger');
            assert.equal(app.version,'3.0.6');
            assert.equal(app.android.versionCode,24);
          });
          test('Expo project ID and matching update endpoint are fixed',()=>{
            assert.equal(app.extra.eas.projectId,'430c7f08-3921-48d5-96d1-f7c3d686d3bf');
            assert.equal(app.updates.url,'https://u.expo.dev/'+app.extra.eas.projectId);
          });
          test('GitHub-built production binary sets the channel itself',()=>{
            assert.equal(app.updates.requestHeaders['expo-channel-name'],'production');
            assert.equal(app.updates.checkAutomatically,'ON_LOAD');
            assert.equal(app.updates.fallbackToCacheTimeout,0);
            assert.equal(app.updates.enabled,true);
          });
          test('native runtime is pinned and not derived from mutable JS changes',()=>{
            assert.equal(app.runtimeVersion,'connect-android-ota-v1-sdk58');
          });
          test('Expo Updates installed using an exact SDK-compatible version',()=>{
            const pkg=JSON.parse(read('package.json'));
            assert.match(pkg.dependencies['expo-updates'],/^\d+\.\d+\.\d+$/);
            assert.equal(pkg.dependencies['expo-updates'],JSON.parse(read('node_modules/expo-updates/package.json')).version);
          });
          test('release source lock matches all three approved edited inputs',()=>{
            const lock=JSON.parse(read('PARITY_SOURCE_LOCK.json'));
            for(const name of ['app.json','package.json','package-lock.json'])
              assert.equal(lock.files[name],crypto.createHash('sha256').update(read(name)).digest('hex'),name);
            assert.ok(Object.keys(lock.files).length>=370);
          });
          test('HTML is generated from embedded WebView source, never loaded remotely',()=>{
            const entry=read('src/App.tsx').toString();
            const embed=read('scripts/embed-web.mjs').toString();
            assert.match(entry,/import pwa from ['"]\.\/generated\/pwa['"]/);
            assert.match(embed,/src\/generated/);
            assert.match(entry,/baseUrl:CONNECT_ORIGIN/);
          });
          test('retains offline built-in sticker asset delivery',()=>{
            const plugin=read('plugins/withConnectWebAssets.js').toString();
            assert.match(plugin,/appassets\.androidplatform\.net/);
            assert.match(plugin,/copyPublicAssets/);
          });
          TEST
          (cd native && node --test tests/connect-ota-config-20261117.test.cjs)
          git diff --check

      - name: Install Chromium for existing WebView browser regressions
        shell: bash
        working-directory: native
        run: |
          set -euo pipefail
          npx --no-install playwright-core install --with-deps chromium
          node -e "const fs=require('fs'),c=require('playwright-core').chromium; if(!fs.existsSync(c.executablePath()))process.exit(1)"

      - name: Build embedded WebView first, then TypeScript and full tests
        shell: bash
        working-directory: native
        run: |
          set -euo pipefail
          node scripts/check-parity-source.mjs
          npm run build:web
          test -s src/generated/pwa.ts
          npm run typecheck:web
          npm run typecheck
          npm test
          export CHROMIUM_PATH="$(node -p "require('playwright-core').chromium.executablePath()")"
          npm run test:browser

      - name: Verify Hermes or JavaScript Android OTA export and embedded interface
        shell: bash
        working-directory: native
        run: |
          set -euo pipefail
          export CONNECT_OTA_EXPORT="$RUNNER_TEMP/connect-ota-export"
          test -s src/generated/pwa.ts
          npx --no-install expo export --platform android --output-dir "$CONNECT_OTA_EXPORT"
          # Expo SDK 58 normally emits Hermes .hbc, not a .js bundle.
          # Check the actual Android bundle, metadata and embedded HTML source.
          python3 - <<'PY_EXPO_EXPORT'
          import json, os
          from pathlib import Path
          root=Path(os.environ['CONNECT_OTA_EXPORT'])
          metadata=root/'metadata.json'
          if not metadata.is_file() or not metadata.stat().st_size:
              raise SystemExit('EXPO_EXPORT_MISSING_METADATA: no metadata.json')
          info=json.loads(metadata.read_text(encoding='utf-8'))
          if not isinstance(info,dict):
              raise SystemExit('EXPO_EXPORT_INVALID_METADATA: expected JSON object')
          bundles=sorted(p for p in root.rglob('*') if p.is_file() and
              p.suffix in ('.hbc','.js','.bundle') and p.stat().st_size > 0 and
              '/android/' in p.as_posix())
          if not bundles:
              raise SystemExit('EXPO_EXPORT_MISSING_ANDROID_BUNDLE: expected Hermes .hbc or JavaScript .js')
          embedded=Path('src/generated/pwa.ts')
          if embedded.stat().st_size < 1000:
              raise SystemExit('CONNECT_WEBVIEW_NOT_EMBEDDED: generated HTML is unexpectedly small')
          for bundle in bundles:
              print('VERIFIED_ANDROID_OTA_BUNDLE',str(bundle.relative_to(root)),bundle.stat().st_size,'bytes')
          print('VERIFIED_EMBEDDED_CONNECT_WEBVIEW',embedded.stat().st_size,'bytes')
          print('VERIFIED_EXPO_EXPORT_METADATA',metadata.stat().st_size,'bytes')
          PY_EXPO_EXPORT

      - name: Verify generated Android native Expo Update configuration
        shell: bash
        working-directory: native
        run: |
          set -euo pipefail
          npx --no-install expo prebuild --platform android --no-install --clean
          node scripts/check-parity-source.mjs --tools
          grep -q 'expo.modules.updates.EXPO_UPDATE_URL' android/app/src/main/AndroidManifest.xml
          grep -q 'expo.modules.updates.EXPO_RUNTIME_VERSION' android/app/src/main/AndroidManifest.xml
          grep -R -q 'expo-channel-name' android/app/src/main/AndroidManifest.xml
          test -f android/app/src/main/assets/connect-web/stickers/speed/hello.webp
          echo 'Expo updates native configuration confirmed; embedded sticker APK assets unchanged.'

      - name: Commit only verified OTA configuration (no APK or Expo publication)
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$(git rev-parse HEAD)" || {
            echo 'Main changed during verification; refusing non-fast-forward push.' >&2;exit 1;
          }
          git add -- native/app.json native/package.json native/package-lock.json native/PARITY_SOURCE_LOCK.json native/tests/connect-ota-config-20261117.test.cjs
          git diff --cached --check
          if git diff --cached --quiet;then echo 'Already configured';exit 0;fi
          git -c user.name='Connect CI' -c user.email='actions@users.noreply.github.com' \
            commit -m 'Android: link Connect to Expo OTA production runtime without changing APK'
          git push origin HEAD:main

      - name: Release boundary (no APK has been built or updated)
        if: success()
        run: |
          echo 'Expo OTA source configuration committed.'
          echo 'Existing Connect Android 3.0.6 does NOT receive OTA.'
          echo 'NEXT: create and verify a NEW release-signed APK with expo-updates and incremented Android versionCode.'
          echo 'Do NOT publish an OTA until that APK has been installed and tested.'
