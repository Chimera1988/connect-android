name: Connect Native - stickers and emoji compatible with PWA
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/connect-native-stickers.yml
permissions:
  contents: write
concurrency:
  group: connect-native-stickers
  cancel-in-progress: false
jobs:
  integrate-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - name: Checkout Connect Android
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - name: Install PWA-compatible sticker picker and message renderer
        shell: bash
        run: |
          python3 - <<'PY_STICKERS'
          from pathlib import Path
          import base64, hashlib, zlib
          
          assets=[
              ('native/src/ConnectNativeStickers.tsx','975a9a3c37b58271e7209d674af9fc2b25847599ef28b682f6ce6decf4895160',''),
          ]
          for name, expected_sha, encoded in assets:
              data=zlib.decompress(base64.b64decode(encoded))
              if hashlib.sha256(data).hexdigest()!=expected_sha:
                  raise SystemExit('Asset checksum mismatch: '+name)
              destination=Path(name)
              if destination.exists() and destination.read_bytes()!=data:
                  raise SystemExit('Existing sticker component has manual changes. Refusing overwrite: '+name)
              destination.parent.mkdir(parents=True,exist_ok=True)
              destination.write_bytes(data)
          
          patch=zlib.decompress(base64.b64decode(''))
          if hashlib.sha256(patch).hexdigest()!='f951777ad7191b028e9002300fa5f0c53014d01eba9ff6a73bebc3d75e358d54':
              raise SystemExit('Installer checksum mismatch')
          exec(compile(patch,'apply_stickers.py','exec'),{'__name__':'__main__'})
          PY_STICKERS
      - name: Install packages and compatible react-native-svg version
        working-directory: native
        env:
          CI: '1'
          EXPO_NO_TELEMETRY: '1'
        run: |
          npm install --no-audit --no-fund
          npx expo install react-native-svg --npm
          npm run typecheck
      - name: Generate Android native project
        working-directory: native
        env:
          CI: '1'
          EXPO_NO_TELEMETRY: '1'
        run: npx expo prebuild --platform android --no-install --clean
      - name: Android SDK 37 (same as last green native build)
        run: |
          sdkmanager --channel=3 --install 'platforms;android-37.0' 'build-tools;37.0.0' 'platform-tools'
          test -s "${ANDROID_SDK_ROOT}/platforms/android-37.0/android.jar"
      - name: Compile native Android debug APK for validation only
        working-directory: native/android
        env:
          CI: '1'
          EXPO_NO_TELEMETRY: '1'
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon --stacktrace
          test -s app/build/outputs/apk/debug/app-debug.apk
      - name: Commit source only after successful native compilation
        shell: bash
        run: |
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add native/src/ConnectNativeStickers.tsx native/src/ConnectNativeChat.tsx native/src/ConnectNativeMedia.tsx native/package.json native/package-lock.json
          if git diff --cached --quiet; then echo 'Stickers already installed'; exit 0; fi
          git commit -m 'feat(native): PWA-compatible stickers and emoji picker'
          git push origin HEAD:main
