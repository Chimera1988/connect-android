name: Connect Native - Inbox, unread, saved appearance and search
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/connect-native-ui-polish.yml
permissions:
  contents: write
concurrency:
  group: connect-native-ui-polish
  cancel-in-progress: false
jobs:
  integrate-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout Connect Android
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Sync with last green native version
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B main origin/main
          test -s native/src/ConnectNativeSoundSettings.tsx
          test -s native/src/ConnectNativeAlbum.tsx
      - name: Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - name: Integrate native inbox and appearance improvements
        shell: bash
        run: |
          python3 - <<'PY_CONNECT_UI'
          from pathlib import Path
          from hashlib import sha256
          import zlib,base64,subprocess
          assets=[('/tmp/connect-native-inbox.ts', '0714452ef3db0c1196cdc4d6a5eb611b646f3ac3f19d903b0edf3be317a3625f', ''), ('/tmp/connect-native-inbox-apply.py', '9eff94346d5b3bfc966743c32ffc5d8a0db8415de66e8765c9e9f8e6ab4bafaf', '')]
          for name,expected,encoded in assets:
              data=zlib.decompress(base64.b64decode(encoded))
              if sha256(data).hexdigest()!=expected:
                  raise SystemExit('Corrupt Connect installer asset: '+name)
              Path(name).write_bytes(data)
          subprocess.run(['python3','/tmp/connect-native-inbox-apply.py'],check=True)
          PY_CONNECT_UI
      - name: Type-check React Native application
        working-directory: native
        env:
          CI: '1'
          EXPO_NO_TELEMETRY: '1'
        run: |
          npm ci --no-audit --no-fund
          npm run typecheck
      - name: Generate native Android project
        working-directory: native
        env:
          CI: '1'
          EXPO_NO_TELEMETRY: '1'
        run: npx expo prebuild --platform android --no-install --clean
      - name: Install Android preview SDK 37
        run: |
          sdkmanager --channel=3 --install 'platforms;android-37.0' 'build-tools;37.0.0' 'platform-tools'
          test -s "${ANDROID_SDK_ROOT}/platforms/android-37.0/android.jar"
      - name: Compile native Android (CI validation only; no release)
        working-directory: native/android
        env:
          CI: '1'
          EXPO_NO_TELEMETRY: '1'
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon --stacktrace
          test -s app/build/outputs/apk/debug/app-debug.apk
      - name: Commit only verified native source files
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add native/src/ConnectNativeInbox.ts native/src/App.tsx
          if git diff --cached --quiet; then
            echo 'Connect Native inbox already installed'
            exit 0
          fi
          git commit -m 'feat(native): chat inbox previews, unread badges, searchable recent messages, saved themes'
          git push origin HEAD:main
