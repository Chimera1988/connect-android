      - name: Add Expo SDK 58 image cropper dependency
        shell: bash
        working-directory: native
        run: |
          set -euo pipefail
          npm install 'expo-image-manipulator@~58.0.16' --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: TypeScript and source safety checks (NO APK)
        shell: bash
        working-directory: native
        env:
          CI: '1'
          EXPO_NO_TELEMETRY: '1'
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm run typecheck
          python3 - <<'PY_ASSERT'
          from pathlib import Path
          import json
          src=Path('src')
          avatar=(src/'ConnectNativeAvatarCropper.tsx').read_text()
          media=(src/'ConnectNativeMedia.tsx').read_text()
          chat=(src/'ConnectNativeChat.tsx').read_text()
          assert 'context.crop(' in avatar and 'width:512,height:512' in avatar
          assert 'useAudioSampleListener' in media and 'sample.channels' in media
          assert 'videoAutoPlay' in media and 'viewableItems' in chat
          assert 'expo-image-manipulator' in json.loads(Path('package.json').read_text())['dependencies']
          assert json.loads(Path('app.json').read_text())['expo']['name']=='Connect'
          assert Path('final-parity-review/SOURCE_GAPS_COMPLETION.md').is_file()
          print('Source completion checks passed. 0/199 device validation unchanged.')
          PY_ASSERT

      - name: Commit verified sources and one summary report
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git add -- native/package.json native/package-lock.json native/src/ConnectNativeAvatarCropper.tsx native/src/ConnectNativeSettings.tsx native/src/ConnectNativeMedia.tsx native/src/ConnectNativeChat.tsx native/final-parity-review/SOURCE_GAPS_COMPLETION.md
          if git diff --cached --quiet; then
            echo 'No changes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(android): avatar crop, PCM waveform and viewport video notes'
          git push origin HEAD:main

      - name: Report status (NOT RELEASE READY)
        if: success()
        shell: bash
        run: |
          {
            echo '### Connect Android — final 3 source parity fixes'
            echo '- Avatar editor: drag/pinch, 512x512 JPEG, from gallery and settings.'
            echo '- Voice waveform from actual decoded PCM samples *during playback* (not entire-file PWA predecode).'
            echo '- Visible video notes muted autoplay and pause on scroll/background.'
            echo '- TypeScript verified. No APK or Gradle job executed.'
            echo '- 0/199 hardware acceptance cases; APK release is still blocked.'
          } >> "$GITHUB_STEP_SUMMARY"
