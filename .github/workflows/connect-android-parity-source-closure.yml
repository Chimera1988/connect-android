# Single targeted source fix pack after the 199-feature parity audit.
# Does not build APK, Gradle, or install a development application.
name: Connect Android - final three PWA source gaps (NO APK)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/connect-android-parity-source-closure.yml

permissions:
  contents: write

concurrency:
  group: connect-android-final-source-closure
  cancel-in-progress: false

jobs:
  fix-remaining-source-gaps:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout current Connect Android
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Synchronize with main; enforce no APK gate
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B main origin/main
          python3 - <<'PY_GUARD'
          from pathlib import Path
          import re
          p=Path('.github/workflows/android-apk.yml')
          if not p.is_file():raise SystemExit('STOP: APK gate workflow missing')
          text=p.read_text()
          if re.search(r'^\s{2}push\s*:',text,re.M) or re.search(r'\b(?:assemble(?:Debug|Release)|gradlew|eas build)\b',text,re.I):
              raise SystemExit('STOP: automatic APK build must be disabled')
          for file in ['native/src/ConnectNativeChat.tsx','native/src/ConnectNativeMedia.tsx',
                       'native/src/ConnectNativeSettings.tsx','native/final-parity-review/FINAL_REVIEW.md']:
              if not Path(file).is_file():raise SystemExit('Missing '+file)
          print('Android source only; release still blocked.')
          PY_GUARD

