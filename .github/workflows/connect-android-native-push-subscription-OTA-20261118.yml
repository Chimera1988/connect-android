    - name: Verify push registration contracts, full source integrity and native policy
      shell: bash
      run: 'set -euo pipefail

        npm ci --no-audit --no-fund

        node scripts/check-parity-source.mjs

        node --test tests/connect-native-push-status-20261118.test.cjs tests/push-read-sync.test.cjs tests/connect-ota-about-20261117.test.cjs
        tests/connect-ota-config-20261117.test.cjs tests/android-ui-polish.test.cjs tests/source-lock.test.cjs

        node scripts/verify-builtin-sounds.cjs

        node scripts/generate-call-policy.cjs --check

        '
      working-directory: native
    - name: Build WebView, typecheck, run ALL regressions and real Chromium browser tests
      shell: bash
      run: 'set -euo pipefail

        npm run build:web

        test -s src/generated/pwa.ts

        npm run typecheck:web

        npm run typecheck

        npx --no-install playwright-core install --with-deps chromium

        export CHROMIUM_PATH="$(node -p "require(''playwright-core'').chromium.executablePath()")"

        test -x "$CHROMIUM_PATH"

        npm test

        npm run test:browser

        node scripts/check-parity-source.mjs

        '
      working-directory: native
    - name: Export exact Android OTA bundle for the installed 3.0.7 runtime
      shell: bash
      run: 'set -euo pipefail

        npx --no-install expo export --platform android --output-dir "$RUNNER_TEMP/connect-ota-native-push-export"

        python3 - <<''PY''

        import os,json

        from pathlib import Path

        folder=Path(os.environ[''RUNNER_TEMP''])/''connect-ota-native-push-export''

        assert (folder/''metadata.json'').is_file(),''Expo OTA metadata missing''

        assert any(p.stat().st_size>100000 for p in list(folder.rglob(''*.hbc''))+list(folder.rglob(''*.js''))),''Android
        Hermes/JS bundle missing''

        app=json.loads(Path(''app.json'').read_text())[''expo'']

        assert app[''runtimeVersion'']==''connect-android-ota-v1-sdk58''

        assert app[''android''][''versionCode'']==25 and app[''version'']==''3.0.7''

        assert app[''updates''][''requestHeaders''][''expo-channel-name'']==''production''

        assert Path(''src/generated/pwa.ts'').stat().st_size>100000

        print(''OTA_EXPORT_VERIFIED: compatible Android JS + built-in WebView only; no new APK'')

        PY

        '
      working-directory: native
    - name: Commit only reviewed Android source changes after all tests
      shell: bash
      run: "set -euo pipefail\n(cd native && node scripts/check-parity-source.mjs)\ngit add -- native/src/ConnectNativePush.ts\
        \ native/src/App.tsx native/src/hybridProtocol.ts native/web/components/ConnectNotificationSettings.tsx native/web/components/ConnectNativePushStatus.tsx\
        \ native/tests/connect-native-push-status-20261118.test.cjs native/PARITY_SOURCE_LOCK.json\ngit diff --cached --check\n\
        if git diff --cached --quiet; then\n echo 'Reviewed push status code already exists in Android main; safe publication\
        \ retry'\nelse\n test \"$(git ls-remote origin refs/heads/main | cut -f1)\" = \"$(git rev-parse HEAD)\" || { echo\
        \ '::error::Android main moved while testing; refusing to publish stale build';exit 1; }\n git -c user.name='Connect\
        \ CI' -c user.email='actions@users.noreply.github.com' commit -m 'Android: verify active push registration, display\
        \ state and repair on resume'\n git push origin HEAD:main\nfi\n"
    - name: Publish audited Android-only OTA to existing production channel
      shell: bash
      run: 'set -euo pipefail

        test -n "${EXPO_TOKEN:-}" || { echo ''::error::Expo token missing'';exit 1; }

        EAS=''npx --yes eas-cli@27.6.0''

        $EAS channel:view production --non-interactive

        npx --yes eas-cli@27.6.0 update --channel production --platform android --environment production --input-dir "$RUNNER_TEMP/connect-ota-native-push-export"
        --skip-bundler --message ''Connect Android: push subscription status and automatic FCM re-registration'' --non-interactive

        echo ''CONNECT_PUSH_OTA_PUBLISHED=yes'' >> "$GITHUB_ENV"

        '
      working-directory: native
      env:
        EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    - name: Explicit deployment result and unchanged native APK confirmation
      shell: bash
      run: "set -euo pipefail\n{\n echo '## Connect Android 3.0.7 — native push subscription status'\n echo '- Existing installed\
        \ APK, signing certificate, Android 10+ compatibility and Expo runtime: unchanged.'\n if [[ \"${CONNECT_PUSH_OTA_PUBLISHED:-}\"\
        \ == yes ]];then\n   echo '- Expo OTA: published to production; please restart Connect to apply.'\n   echo '- Status\
        \ active requires a fresh authenticated FCM registration acknowledgement from the Connect server.'\n   echo '- Local\
        \ notification test does not prove end-to-end delivery of remote FCM messages.'\n else\n   echo '- Expo OTA: NOT CONFIRMED;\
        \ see failed step. No claim of delivery to the device.'\n fi\n} >> \"$GITHUB_STEP_SUMMARY\"\n"
      if: always()
