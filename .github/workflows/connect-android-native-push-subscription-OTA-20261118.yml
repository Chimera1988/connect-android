name: Connect Android | Verified push subscriptions OTA 2026-11-18
'on':
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: connect-android-native-push-status-ota
  cancel-in-progress: false
jobs:
  update:
    name: Verify automatic Android FCM registration and publish UI through Expo OTA
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
      EXPO_PUBLIC_SUPABASE_URL: https://tpwkmoxxzjfdsqsomhhr.supabase.co
      NEXT_PUBLIC_SUPABASE_URL: https://tpwkmoxxzjfdsqsomhhr.supabase.co
      EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_tAg8rPwuBNcA2iPF7voc2Q_vsKUpyZa
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_tAg8rPwuBNcA2iPF7voc2Q_vsKUpyZa
      EXPO_PUBLIC_CONNECT_URL: https://connect-chat.duckdns.org
    steps:
    - name: Checkout Connect Android main
      uses: actions/checkout@v4
      with:
        ref: main
        fetch-depth: 0
        persist-credentials: true
    - name: Preflight exact Expo project and publishing credentials
      shell: bash
      run: "set -euo pipefail\ntest \"$GITHUB_REPOSITORY\" = 'Chimera1988/connect-android'\ntest \"$GITHUB_REF\" = 'refs/heads/main'\n\
        test -n \"${EXPO_TOKEN:-}\" || { echo '::error::GitHub Secret EXPO_TOKEN is required for Android OTA publication.';exit\
        \ 1; }\npython3 - <<'PY'\nimport json\nfrom pathlib import Path\nr=Path('native');a=json.loads((r/'app.json').read_text())['expo']\n\
        assert a['android']['package']=='com.connect.messenger'\nassert a['android']['versionCode']==25 and a['version']=='3.0.7'\n\
        assert a['runtimeVersion']=='connect-android-ota-v1-sdk58'\nassert a['extra']['eas']['projectId']=='430c7f08-3921-48d5-96d1-f7c3d686d3bf'\n\
        assert a['updates']['url']=='https://u.expo.dev/430c7f08-3921-48d5-96d1-f7c3d686d3bf'\nassert a['updates']['requestHeaders']['expo-channel-name']=='production'\
        \ and a['updates']['enabled']\nfor p in ['native/src/ConnectNativePush.ts','native/src/App.tsx','native/src/hybridProtocol.ts','native/web/components/ConnectNotificationSettings.tsx','native/PARITY_SOURCE_LOCK.json']:\n\
        \ assert Path(p).is_file(),p\nprint('Android 3.0.7 (25), Expo production, unchanged runtime and native identity verified')\n\
        PY\n"
      env:
        EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    - name: Install Node.js 24
      uses: actions/setup-node@v4
      with:
        node-version: '24'
        cache: npm
        cache-dependency-path: native/package-lock.json
    - name: Verify existing locked Android sources
      shell: bash
      run: 'set -euo pipefail

        npm ci --no-audit --no-fund

        node scripts/check-parity-source.mjs

        '
      working-directory: native
