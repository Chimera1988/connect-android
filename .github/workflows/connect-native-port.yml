# Connect PWA port is already committed in native/.
# This workflow validates that source; it never rebuilds/reapplies the old 21-part patch.
name: Connect Native — verify installed PWA port (NO APK)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/connect-native-port.yml'

permissions:
  contents: read

concurrency:
  group: connect-native-verified-port-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-native:
    name: Validate PWA source and compile Java/Kotlin (no APK)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
      GRADLE_OPTS: '-Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx4g'
    steps:
      - name: Checkout latest main without write credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: main

      - name: Ensure audited source port is already installed
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'Chimera1988/connect-android'
          test -s native/PWA_PARITY_REVIEW.md
          test -s native/src/ConnectNativeScene.ts
          test -s native/src/ConnectNativeGlassPanel.tsx
          test -s native/plugins/waveform/ConnectWaveformModule.java
          test -s native/plugins/withConnectWaveform.js
          grep -Fq 'df71ca06e615ca5f981ae9276bd3642587f76e1a' native/PWA_PARITY_REVIEW.md
          echo 'Audited Connect PWA source files are present. No source patch is needed.'

      - name: Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: native/package-lock.json

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v4

      - name: Cache verified Gradle distribution and downloaded modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/wrapper/dists
            ~/.gradle/caches/modules-2
          key: connect-android-sdk58-gradle9.4.1-${{ runner.os }}-${{ hashFiles('native/package-lock.json') }}

      - name: Verify TypeScript, behavior tests and Android JS bundle
        working-directory: native
        shell: bash
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm run typecheck
          npm test
          npx expo export --platform android --output-dir "$RUNNER_TEMP/connect-native-bundle"

      - name: Install Android SDK platform 37
        shell: bash
        run: |
          set -euo pipefail
          if ! sdkmanager --channel=3 --install 'platforms;android-37.0' 'build-tools;37.0.0' 'platform-tools'; then
            sdkmanager --channel=3 --install 'platforms;android-37' 'build-tools;37.0.0' 'platform-tools'
          fi

      - name: Generate Android project and verify native modules
        working-directory: native
        shell: bash
        run: |
          set -euo pipefail
          npx expo prebuild --platform android --no-install --clean
          test -s android/app/google-services.json
          test -s android/app/src/main/java/com/connect/waveform/ConnectWaveformModule.java
          grep -Fq ConnectWaveformPackage android/app/src/main/java/com/connect/messenger/MainApplication.kt

      - name: Download SHA256-pinned Gradle 9.4.1 from multiple mirrors
        working-directory: native/android
        shell: bash
        run: |
          set -euo pipefail
          wrapper=gradle/wrapper/gradle-wrapper.properties
          grep -Eq '^distributionUrl=.*gradle-9\.4\.1-bin\.zip' "$wrapper"
          sha=2ab2958f2a1e51120c326cad6f385153bb11ee93b3c216c5fccebfdfbb7ec6cb
          target="$RUNNER_TEMP/gradle-9.4.1-bin.zip"
          for host in \
            https://downloads.gradle.org/distributions \
            https://services.gradle.org/distributions \
            https://downloads.gradle-dn.com/distributions; do
            echo "Downloading Gradle from $host"
            rm -f "$target.partial"
            if curl --fail --location --silent --show-error \
                --retry 5 --retry-all-errors --retry-delay 6 \
                --connect-timeout 25 --max-time 360 \
                "$host/gradle-9.4.1-bin.zip" -o "$target.partial"; then
              if echo "$sha  $target.partial" | sha256sum -c --status; then
                mv "$target.partial" "$target"
                break
              fi
              echo 'Rejected Gradle archive with wrong checksum.' >&2
            fi
          done
          test -s "$target" || { echo 'Network error: verified Gradle archive unavailable.' >&2; exit 1; }
          python3 - "$wrapper" "$target" <<'PY'
          from pathlib import Path
          import re,sys
          p=Path(sys.argv[1]); v=p.read_text()
          v,n=re.subn(r'(?m)^distributionUrl=.*$', 'distributionUrl='+Path(sys.argv[2]).resolve().as_uri(), v)
          assert n==1
          p.write_text(v)
          print('Gradle wrapper uses checksum-verified local distribution (CI only).')
          PY

      - name: Configure alternate Kotlin compiler Maven sources
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/connect-gradle-repositories.init.gradle" <<'GRADLE'
          // Apply to all projects, including Expo composite builds, before project evaluation.
          gradle.beforeProject { project ->
            project.repositories.maven {
              url 'https://maven.aliyun.com/repository/central'
              content { includeGroup('org.jetbrains.kotlin') }
            }
            project.repositories.maven {
              url 'https://maven-central.storage-download.googleapis.com/maven2/'
              content { includeGroup('org.jetbrains.kotlin') }
            }
          }
          GRADLE

      - name: Compile Java and Kotlin with network retries (no APK)
        working-directory: native/android
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          log="$RUNNER_TEMP/connect-native-gradle-compile.log"
          for attempt in 1 2 3 4; do
            echo "Native compile attempt $attempt/4"
            if ./gradlew :app:compileDebugJavaWithJavac :app:compileDebugKotlin \
                --init-script "$RUNNER_TEMP/connect-gradle-repositories.init.gradle" \
                --no-daemon --max-workers=2 --console=plain 2>&1 | tee "$log"; then
              echo 'BUILD SUCCESSFUL: Kotlin/Java compiled; no APK was produced.'
              echo '### Connect Native — Java/Kotlin compile succeeded (no APK)' >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            # The wrapper reports HTTP 504 as "Server returned HTTP response code: 504".
            # Do not misclassify this as a code/compilation error.
            if ! grep -Eiq 'response code: *5[0-9]{2}|status code: *5[0-9]{2}|Gateway Time-out|Could not GET|Could not download|Connect timed out|Read timed out|Connection reset|Temporary failure|UnknownHostException|SocketTimeoutException|SSLHandshakeException|Connection refused|Remote host terminated|502 Bad Gateway|503 Service Unavailable|504 Gateway' "$log"; then
              echo 'Non-network compilation error: see uploaded log.' >&2
              exit 1
            fi
            if [ "$attempt" -eq 4 ]; then
              echo 'External Gradle/Maven downloads still unavailable after 4 attempts.' >&2
              exit 1
            fi
            echo "Transient network failure, retrying after $((attempt * 15)) seconds"
            sleep $((attempt * 15))
          done

      - name: Assert no APK/AAB was built
        shell: bash
        run: |
          set -euo pipefail
          if find native/android -type f \( -name '*.apk' -o -name '*.aab' \) -print -quit | grep -q .; then
            echo 'Unexpected APK/AAB; failing strict source-only workflow.' >&2
            exit 1
          fi
          echo 'No APK/AAB produced.'

      - name: Upload native compile diagnostics when failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: connect-native-verify-compile-log
          path: ${{ runner.temp }}/connect-native-gradle-compile.log
          if-no-files-found: ignore
          retention-days: 14
