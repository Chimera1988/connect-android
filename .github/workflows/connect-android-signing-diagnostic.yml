name: Connect Android | Diagnose signing compatibility
run-name: Connect signing diagnosis - public certificate comparison

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    name: Verify previous APK and configured signing key
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: production
    steps:
      - uses: actions/setup-java@v6.3.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4.0.4
      - name: Compare public certificates (no signing or publication)
        env:
          GH_TOKEN: ${{ github.token }}
          CONNECT_RELEASE_KEYSTORE_BASE64: ${{ secrets.CONNECT_RELEASE_KEYSTORE_BASE64 }}
          CONNECT_RELEASE_STORE_PASSWORD: ${{ secrets.CONNECT_RELEASE_STORE_PASSWORD }}
          CONNECT_RELEASE_KEY_ALIAS: ${{ secrets.CONNECT_RELEASE_KEY_ALIAS }}
          CONNECT_RELEASE_KEY_PASSWORD: ${{ secrets.CONNECT_RELEASE_KEY_PASSWORD }}
          PINNED_CERT: a6507c8b798b77774144502fb1d9a6d09c53da98946b174c692175a96c230130
        run: |
          set -euo pipefail
          umask 077
          work="$RUNNER_TEMP/connect-signing-check"
          mkdir -p "$work"
          trap 'rm -rf "$work"' EXIT
          gh release download connect-android-v3.0.7-b25 \
            --repo Chimera1988/connect-android \
            --pattern Connect.apk --dir "$work"
          printf '%s  %s\n' \
            '5d50755822cb2fd4c9fe781cd140b9dc164cf747cab9fce5ceec5caa37e3a5a8' \
            "$work/Connect.apk" | sha256sum --check
          sdkmanager 'build-tools;37.0.0'
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify \
            --min-sdk-version 29 --verbose "$work/Connect.apk" > "$work/apksigner-verification.txt"
          # Read the actual DER certificate from the APK v2/v3 signing block.
          # This avoids relying on formatting changes in apksigner --print-certs.
          python3 - "$work/Connect.apk" "$work/previous-cert.sha256" <<'PY'
          import hashlib,struct,sys
          from pathlib import Path
          apk=Path(sys.argv[1]).read_bytes()
          tail=apk[-65557:]
          where=tail.rfind(b'PK\x05\x06')
          if where<0:raise SystemExit('Invalid APK ZIP central directory')
          eocd=len(apk)-len(tail)+where
          central=struct.unpack_from('<I',apk,eocd+16)[0]
          if apk[central-16:central]!=b'APK Sig Block 42':
              raise SystemExit('No APK v2/v3 signing block (cannot establish installed signer)')
          size=struct.unpack_from('<Q',apk,central-24)[0]
          start=central-size-8
          if start<0 or struct.unpack_from('<Q',apk,start)[0]!=size:
              raise SystemExit('Invalid APK signing block sizes')
          def chunk(buf,offset):
              if offset+4>len(buf):raise ValueError('Truncated length-prefixed field')
              n=struct.unpack_from('<I',buf,offset)[0]
              end=offset+4+n
              if end>len(buf):raise ValueError('Out-of-range signed field')
              return buf[offset+4:end],end
          schemes={0x7109871a:'v2',0xf05368c0:'v3',0x1b93ad61:'v3.1'}
          found={}
          pos=start+8
          while pos<central-24:
              n=struct.unpack_from('<Q',apk,pos)[0]
              if n<4 or pos+8+n>central-24:raise SystemExit('Invalid APK signing pair')
              ident=struct.unpack_from('<I',apk,pos+8)[0]
              if ident in schemes:
                  signers=apk[pos+12:pos+8+n]
                  cursor=0
                  while cursor<len(signers):
                      signer,cursor=chunk(signers,cursor)
                      signed,_=chunk(signer,0)
                      _,after_digests=chunk(signed,0)
                      certs,_=chunk(signed,after_digests)
                      cert,_=chunk(certs,0)
                      found.setdefault(schemes[ident],set()).add(hashlib.sha256(cert).hexdigest())
              pos+=8+n
          all_certs=set().union(*found.values()) if found else set()
          if len(all_certs)!=1:
              raise SystemExit('Cannot unambiguously establish APK signer; scheme fingerprints: '+str({k:len(v) for k,v in found.items()}))
          fp=next(iter(all_certs))
          Path(sys.argv[2]).write_text(fp+'\n')
          print('Verified published APK signer SHA-256:',fp)
          print('Verified signing schemes:',', '.join(sorted(found)))
          PY
          if [[ -z "$CONNECT_RELEASE_KEYSTORE_BASE64" || -z "$CONNECT_RELEASE_STORE_PASSWORD" || -z "$CONNECT_RELEASE_KEY_ALIAS" || -z "$CONNECT_RELEASE_KEY_PASSWORD" ]]; then
            {
              echo '## Connect signing comparison'
              echo "- Published APK signer SHA-256: \`$(cat "$work/previous-cert.sha256")\`"
              echo '- One or more production signing Secrets are missing; cannot compare keys.'
              echo '- No APK was signed or published.'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          printf '%s' "$CONNECT_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$work/connect-release.jks"
          keytool -list -v -keystore "$work/connect-release.jks" \
            -alias "$CONNECT_RELEASE_KEY_ALIAS" \
            -storepass:env CONNECT_RELEASE_STORE_PASSWORD \
            -J-Duser.language=en > "$work/keytool.txt"
          keytool -certreq -keystore "$work/connect-release.jks" \
            -alias "$CONNECT_RELEASE_KEY_ALIAS" \
            -storepass:env CONNECT_RELEASE_STORE_PASSWORD \
            -keypass:env CONNECT_RELEASE_KEY_PASSWORD \
            -file "$work/private-key-check.csr" > /dev/null
          python3 - "$work/previous-cert.sha256" "$work/keytool.txt" <<'PY'
          import os,re,sys
          from pathlib import Path
          previous=Path(sys.argv[1]).read_text().strip()
          keytool=Path(sys.argv[2]).read_text()
          match=re.search(r'^\s*SHA256:\s*([0-9a-fA-F:]{64,95})\s*$',keytool,re.M)
          if not match:raise SystemExit('Keystore public certificate SHA-256 not found')
          current=match.group(1).replace(':','').lower()
          pinned=os.environ['PINNED_CERT'].lower()
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:
              f.write('## Connect signing comparison\n')
              f.write('- Previously published Connect 3.0.7 APK signer: `'+previous+'`\n')
              f.write('- Configured production keystore signer: `'+current+'`\n')
              f.write('- Recorded expected signer: `'+pinned+'`\n')
              f.write('- Key matches published APK: **'+str(current==previous)+'**\n')
              f.write('- Recorded signer matches published APK: **'+str(pinned==previous)+'**\n')
              f.write('- Private key and passwords verified via keytool CSR (not published).\n')
              f.write('- No APK was signed or published. This does not prove the signer of a locally installed app.\n')
          print('Keystore public certificate SHA-256:',current)
          print('Matches published APK:',current==previous)
          PY
