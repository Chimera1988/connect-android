name: Connect Native - in-chat video notes and PWA compatibility
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/connect-native-video-notes.yml
permissions:
  contents: write
concurrency:
  group: connect-native-video-notes
  cancel-in-progress: false
jobs:
  integrate-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Checkout Connect Android
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - name: Install video notes with guarded source edits
        shell: bash
        run: |
          python3 - <<'PY_VIDEO_NOTES'
          from pathlib import Path
          import base64, hashlib, json, zlib

          root = Path('native')
          filename = root / 'src/ConnectNativeVideoNote.tsx'
          # Asset replaced at packaging time, and checksum checked before installation.
          ENCODED_ASSET = ''
          EXPECTED_SHA256 = 'b327f5bf4bd9ae5d905e9401ceefa1414175e3be2bb03f6cb066fc8347c41918'
          asset = zlib.decompress(base64.b64decode(ENCODED_ASSET))
          if hashlib.sha256(asset).hexdigest() != EXPECTED_SHA256:
              raise SystemExit('Video note component checksum mismatch')
          if filename.exists() and filename.read_bytes() != asset:
              raise SystemExit('Refusing to replace a modified video-note component')
          filename.parent.mkdir(parents=True, exist_ok=True)
          filename.write_bytes(asset)

          def once(src,old,new,description):
              if new in src:
                  print('Already installed:',description)
                  return src
              if src.count(old)!=1:
                  raise SystemExit(f'{description}: expected one anchor, got {src.count(old)}')
              return src.replace(old,new,1)

          chat=root/'src/ConnectNativeChat.tsx'
          s=chat.read_text('utf-8')
          s=once(s,"import {ConnectNativeAttachment} from './ConnectNativeMedia';",
           "import {ConnectNativeAttachment} from './ConnectNativeMedia';\nimport ConnectNativeVideoNote from './ConnectNativeVideoNote';",'video note import')
          s=once(s,"  const [uploading,setUploading]=useState(false);",
           "  const [uploading,setUploading]=useState(false);\n  const [videoNoteOpen,setVideoNoteOpen]=useState(false);",'video note modal state')
          s=once(s,"  async function sendAttachment(file:LocalUpload,kind?:'image'|'video'|'file'|'audio'){\n    if(uploading||busy)return;",
           "  async function sendAttachment(file:LocalUpload,kind?:'image'|'video'|'file'|'audio'):Promise<boolean>{\n    if(uploading||busy)return false;",'upload result type')
          s=once(s,"      setReply(null);await load();\n    }catch(e){setNotice('Вложение: '+(e instanceof Error?e.message:String(e)));}\n    finally{setUploading(false);}",
           "      setReply(null);await load();\n      return true;\n    }catch(e){setNotice('Вложение: '+(e instanceof Error?e.message:String(e)));return false;}\n    finally{setUploading(false);}",'upload success reporting')
          s=once(s,"      <Btn name=\"attach-outline\" colors={colors} label=\"Прикрепить\" onPress={showAttachmentMenu} disabled={uploading||busy}/>",
           "      <Btn name=\"attach-outline\" colors={colors} label=\"Прикрепить\" onPress={showAttachmentMenu} disabled={uploading||busy}/>\n      <Btn name=\"radio-button-on-outline\" colors={colors} label=\"Записать видеокружок\" onPress={()=>setVideoNoteOpen(true)} disabled={uploading||busy||recorderState.isRecording}/>",'chat video-note button')
          s=once(s,'    <Modal visible={Boolean(actionMessage)} onRequestClose={()=>setActionMessage(null)} animationType="fade" transparent>',
           "    <ConnectNativeVideoNote visible={videoNoteOpen} colors={colors} onClose={()=>setVideoNoteOpen(false)}\n      onSend={file=>sendAttachment(file,'video')}/>\n    <Modal visible={Boolean(actionMessage)} onRequestClose={()=>setActionMessage(null)} animationType=\"fade\" transparent>",'chat video note modal')
          chat.write_text(s,'utf-8')

          media=root/'src/ConnectNativeMedia.tsx'
          s=media.read_text('utf-8')
          helper='''
          /** Circular playable video note, matching the PWA's filename contract. */
          function VideoNoteBubble({uri,colors}:{uri:string;colors:Palette}) {
            const player=useVideoPlayer(uri,instance=>{instance.loop=false;});
            const [playing,setPlaying]=useState(false);
            return <Pressable accessibilityRole="button" accessibilityLabel={playing?'Пауза видеокружка':'Воспроизвести видеокружок'}
              onPress={()=>{if(playing)player.pause();else player.play();setPlaying(!playing);}}
              style={{width:208,height:208,borderRadius:104,overflow:'hidden',backgroundColor:'#081421',borderWidth:2,borderColor:colors.accent}}>
              <VideoView player={player} nativeControls={false} contentFit="cover" surfaceType="textureView" style={{width:'100%',height:'100%'}} />
              {!playing&&<View pointerEvents="none" style={{position:'absolute',top:0,left:0,right:0,bottom:0,alignItems:'center',justifyContent:'center',backgroundColor:'#06101b44'}}>
                <Ionicons name="play-circle" size={52} color="#fff"/>
              </View>}
            </Pressable>;
          }
          '''
          s=once(s,'export function ConnectNativeMediaViewer(',helper+'\nexport function ConnectNativeMediaViewer(','video note bubble component')
          s=once(s,"  if(k==='video')return <><IconButton name=\"play-circle\"",
           "  if(k==='video'&&/^connect-video-note-\\d+\\.(?:mp4|webm)$/i.test(name))return <VideoNoteBubble uri={url} colors={colors}/>;\n  if(k==='video')return <><IconButton name=\"play-circle\"",'recognize PWA-compatible video notes')
          media.write_text(s,'utf-8')

          pkg=root/'package.json'
          data=json.loads(pkg.read_text('utf-8'))
          deps=data.setdefault('dependencies',{})
          if 'expo-camera' in deps and deps['expo-camera'] != '~58.0.14':
              raise SystemExit('Unexpected expo-camera version; review before updating')
          deps['expo-camera']='~58.0.14'
          pkg.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n','utf-8')

          cfg=root/'app.json'
          data=json.loads(cfg.read_text('utf-8'))
          plugins=data['expo'].setdefault('plugins',[])
          name='expo-camera'
          if not any((p if isinstance(p,str) else p[0])==name for p in plugins):
              plugins.append(['expo-camera',{'recordAudioAndroid':True,'cameraPermission':'Камера нужна для записи видеокружков Connect.','microphonePermission':'Микрофон нужен для записи видеокружков Connect.'}])
          cfg.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n','utf-8')
          print('Native video notes added. Old app/ untouched. Run npm install, typecheck and Gradle before commit.')
          PY_VIDEO_NOTES
      - name: Install dependencies and TypeScript check
        working-directory: native
        env:
          CI: '1'
          EXPO_NO_TELEMETRY: '1'
        run: |
          npm install --no-audit --no-fund
          npm run typecheck
      - name: Expo native Android prebuild
        working-directory: native
        env:
          CI: '1'
          EXPO_NO_TELEMETRY: '1'
        run: npx expo prebuild --platform android --no-install --clean
      - name: Android SDK 37 (same as previous green native build)
        run: |
          sdkmanager --channel=3 --install 'platforms;android-37.0' 'build-tools;37.0.0' 'platform-tools'
          test -s "${ANDROID_SDK_ROOT}/platforms/android-37.0/android.jar"
      - name: Compile native debug APK for CI validation only
        working-directory: native/android
        env:
          CI: '1'
          EXPO_NO_TELEMETRY: '1'
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon --stacktrace
          test -s app/build/outputs/apk/debug/app-debug.apk
      - name: Commit native sources after all checks pass
        shell: bash
        run: |
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add native/src/ConnectNativeVideoNote.tsx native/src/ConnectNativeChat.tsx native/src/ConnectNativeMedia.tsx native/app.json native/package.json native/package-lock.json
          if git diff --cached --quiet; then echo 'Video notes already present'; exit 0; fi
          git commit -m 'feat(native): in-chat PWA-compatible video notes'
          git push origin HEAD:main
