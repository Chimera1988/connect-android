          }
          for name,expected_sha in expected.items():
              file=pathlib.Path(name)
              if not file.is_file() or hashlib.sha256(file.read_bytes()).hexdigest()!=expected_sha:
                  sys.exit('STOP: production source changed for '+name)
          for name in ['native/src/ConnectOtaNetwork.ts','native/tests/connect-ota-network-retry-20261119.test.cjs']:
              if pathlib.Path(name).exists():sys.exit('STOP: patch already present: '+name)
          PYHASH
          (cd native && node scripts/check-parity-source.mjs)
