name: Connect Android | Repair Expo OTA Wi-Fi timeouts
run-name: Connect 3.0.8 — safe OTA network retries

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: connect-android-ota-wifi-repair
  cancel-in-progress: false

jobs:
  install:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: native/package-lock.json
      - name: Guard current Connect 3.0.8 sources and hashes
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'Chimera1988/connect-android'
          test "$GITHUB_REF" = 'refs/heads/main'
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          test -z "$(git status --porcelain)"
          node -e "const a=require('./native/app.json').expo;if(a.version!=='3.0.8'||a.android.versionCode!==26||a.runtimeVersion!=='connect-android-ota-v2-sdk58')process.exit(1)"
          python3 - <<'PYHASH'
          import pathlib,hashlib,sys
          expected={
            'native/src/App.tsx': 'f3941526a98bb64f259413f7f0cd0996b0199929cd17ee81c7e2b6d7f9631d0c',
            'native/web/hybrid/runtime.ts': '72a54279c633b7327e9ada22529c11d91a09784ad57f3a7ec991a1303b3e9d5a',
            'native/web/components/ConnectOtaSettings.tsx': '81d8b1159fae54bf8d70e2ed2d06eebe4fe560fc50c1e8a84362e2b22713f7d4',
