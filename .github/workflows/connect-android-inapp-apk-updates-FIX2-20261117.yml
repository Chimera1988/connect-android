name: Connect Android | Trusted in-app APK releases 2026-11-17
'on':
  workflow_dispatch:
    inputs:
      mode:
        description: setup = first OTA + baseline release; publish-apk = promote a future signed Android build
        type: choice
        options:
        - setup
        - publish-apk
        default: setup
      source_run_id:
        description: Successful signed APK workflow run ID (default verified 3.0.7)
        type: string
        default: '44152534236'
      artifact_name:
        description: Exact verified signed APK artifact name
        type: string
        default: Connect-Android-3.0.7-OTA-permanent-signed-candidate
permissions:
  contents: write
  actions: read
concurrency:
  group: connect-android-inapp-apk-updates
  cancel-in-progress: false
jobs:
  update:
    name: Install trusted Android APK update checker and publish Expo OTA
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
      EXPO_PUBLIC_SUPABASE_URL: https://tpwkmoxxzjfdsqsomhhr.supabase.co
      NEXT_PUBLIC_SUPABASE_URL: https://tpwkmoxxzjfdsqsomhhr.supabase.co
      EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_tAg8rPwuBNcA2iPF7voc2Q_vsKUpyZa
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_tAg8rPwuBNcA2iPF7voc2Q_vsKUpyZa
      EXPO_PUBLIC_CONNECT_URL: https://connect-chat.duckdns.org
    steps:
    - name: Checkout Connect Android main
      uses: actions/checkout@v4
      with:
        ref: main
        fetch-depth: 0
        persist-credentials: true
    - name: Preflight Expo credentials before changing reviewed Android sources
      shell: bash
      env:
        EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      run: |
        set -euo pipefail
        [[ -n "${EXPO_TOKEN:-}" ]] || { echo '::error::EXPO_TOKEN missing';exit 1; }
    - name: Guard installed version, permanent runtime, and exact Expo project
      shell: bash
      run: |
        set -euo pipefail
        test "$GITHUB_REPOSITORY" = 'Chimera1988/connect-android'
        test "$GITHUB_REF" = 'refs/heads/main'
        python3 - <<'PY'
        import json
        from pathlib import Path
        r=Path('native')
        for f in ['app.json','PARITY_SOURCE_LOCK.json','package-lock.json','src/App.tsx','web/app/page.tsx','src/hybridProtocol.ts']:
         assert (r/f).is_file(),f'Missing source: {f}'
        a=json.loads((r/'app.json').read_text())['expo']
        assert a['android']['package']=='com.connect.messenger' and a['android']['versionCode']==25 and a['version']=='3.0.7'
        assert a['runtimeVersion']=='connect-android-ota-v1-sdk58'
        assert a['extra']['eas']['projectId']=='430c7f08-3921-48d5-96d1-f7c3d686d3bf'
        assert a['updates']['url']=='https://u.expo.dev/430c7f08-3921-48d5-96d1-f7c3d686d3bf'
        assert a['updates']['requestHeaders']['expo-channel-name']=='production' and a['updates']['enabled']
        print('Installed Android 3.0.7 (25) and Expo production runtime unchanged')
        PY
    - name: Install Node.js 24
      uses: actions/setup-node@v4
      with:
        node-version: '24'
        cache: npm
        cache-dependency-path: native/package-lock.json
    - name: Verify existing locked Android sources
      shell: bash
      run: |
        set -euo pipefail
        npm ci --no-audit --no-fund
        node scripts/check-parity-source.mjs
      working-directory: native
    - name: Install exact native bridge, About update UI and strict source hashes
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p "$(dirname native/web/components/ConnectOtaSettings.tsx)"
