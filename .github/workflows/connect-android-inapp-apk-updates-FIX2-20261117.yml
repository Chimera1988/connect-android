        /** Only releases from the project's public, pinned GitHub repository are considered.
         * A browser/system installer performs the final Android APK signature check.
         * No untrusted URL is accepted from the WebView. */
        const API = 'https://api.github.com/repos/Chimera1988/connect-android/releases/latest';
        const PREFIX = 'https://github.com/Chimera1988/connect-android/releases/download/';
        const TAG = /^connect-android-v([0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3})-b([1-9][0-9]{0,8})$/;
        const DIGEST = /^sha256:[0-9a-f]{64}$/;

        export type ConnectApkCandidate = {
          version: string;
          build: number;
          size: number;
          sha256: string;
          url: string;
          checkedAt: number;
        };
        export type ConnectApkCheck = {
          state: 'available' | 'current' | 'unpublished';
          version?: string;
          build?: number;
          size?: number;
          candidate?: ConnectApkCandidate;
        };

        function entry(value: unknown): Record<string, unknown> | null {
          return value !== null && typeof value === 'object' && !Array.isArray(value)
            ? value as Record<string, unknown> : null;
        }

        /** Pure validation; reject releases with missing digests, different paths or any ambiguous APK assets. */
        export function parseConnectApkRelease(value: unknown, installedBuild: number): ConnectApkCheck {
          const release = entry(value);
          if (!release || release.draft !== false || release.prerelease !== false) throw Error('Некорректные данные выпуска Connect');
          const tag = release.tag_name;
          const match = typeof tag === 'string' ? TAG.exec(tag) : null;
          if (!match) throw Error('Неподдерживаемый формат версии Android');
          const version = match[1], build = Number(match[2]);
          if (!Number.isSafeInteger(build) || build < 1 || build > 2000000000) throw Error('Некорректный номер Android-сборки');
          if (!Array.isArray(release.assets)) throw Error('В выпуске отсутствует подписанный APK');
          const assets = release.assets.filter(asset => entry(asset)?.name === 'Connect.apk');
          if (assets.length !== 1) throw Error('Ожидался ровно один Connect.apk');
          const apk = entry(assets[0])!;
          const expected = PREFIX + tag + '/Connect.apk';
          if (apk.state !== 'uploaded' || apk.browser_download_url !== expected ||
              !Number.isSafeInteger(apk.size) || (apk.size as number) < 5_000_000 || (apk.size as number) > 200_000_000 ||
              typeof apk.digest !== 'string' || !DIGEST.test(apk.digest)) {
            throw Error('APK не прошёл проверку адреса, размера и SHA-256');
          }
          if (!Number.isSafeInteger(installedBuild) || installedBuild < 1) throw Error('Не удалось определить номер установленного APK');
          if (build <= installedBuild) return {state: 'current', version, build};
          const candidate: ConnectApkCandidate = {
            version, build, size: apk.size as number, sha256: apk.digest.slice(7), url: expected, checkedAt: Date.now(),
          };
          return {state: 'available', version, build, size: candidate.size, candidate};
        }

        export async function checkConnectApkRelease(installedBuild: number): Promise<ConnectApkCheck> {
          const timeout = new AbortController();
          const timer = setTimeout(() => timeout.abort(), 12000);
          try {
            const response = await fetch(API, {
              method: 'GET',
              headers: {'Accept': 'application/vnd.github+json', 'User-Agent': 'Connect-Android-Updater'},
              signal: timeout.signal,
            });
            if (response.status === 404) return {state: 'unpublished'};
            if (!response.ok) throw Error('GitHub не подтвердил доступность обновлений (' + response.status + ')');
            return parseConnectApkRelease(await response.json() as unknown, installedBuild);
          } catch (error) {
            if (timeout.signal.aborted) throw Error('Превышено время ожидания ответа GitHub');
            throw error;
          } finally {clearTimeout(timer);}
        }
        END_CONNECT_APK_UPDATES_927
        mkdir -p "$(dirname native/web/components/ConnectOtaSettings.tsx)"
        cat > native/web/components/ConnectOtaSettings.tsx <<'END_CONNECT_APK_UPDATES_927'
        import {useEffect,useState} from 'react';

        type OtaInfo={version:string;build:number|null;enabled:boolean;pending:boolean;channel:string|null;runtime:string|null;embedded:boolean};
        type OtaState='loading'|'idle'|'checking'|'current'|'available'|'downloading'|'ready'|'restarting'|'disabled'|'error';
        type ApkInfo={state:'unpublished'|'current'|'available';version?:string;build?:number;size?:number};
        type ApkState='checking'|'unpublished'|'current'|'available'|'opening'|'opened'|'error';

        /** Both update paths use only the nonce-bound Android bridge. WebView never chooses an APK URL. */
        export default function ConnectOtaSettings(){
          const [info,setInfo]=useState<OtaInfo|null>(null);
          const [state,setState]=useState<OtaState>('loading');
          const [error,setError]=useState('');
          const [apkInfo,setApkInfo]=useState<ApkInfo|null>(null);
          const [apkState,setApkState]=useState<ApkState>('checking');
          const [apkError,setApkError]=useState('');
          useEffect(()=>{
            let alive=true;
            const bridge=window.ConnectNative;
            if(!bridge){setState('disabled');setApkState('error');setApkError('Android недоступен');return;}
            void bridge.request('updates:info',{}).then((value:OtaInfo)=>{
              if(!alive)return;
              setInfo(value);
              setState(!value.enabled?'disabled':value.pending?'ready':'idle');
            }).catch((reason:unknown)=>{
              if(!alive)return;
              setError(reason instanceof Error?reason.message:'Не удалось проверить состояние обновлений.');
              setState('error');
            });
            void bridge.request('updates:apk-check',{}).then((value:ApkInfo)=>{
              if(!alive)return;
              setApkInfo(value);setApkState(value.state);
            }).catch((reason:unknown)=>{
              if(!alive)return;
              setApkError(reason instanceof Error?reason.message:'Не удалось проверить новые APK.');
              setApkState('error');
            });
            return()=>{alive=false;};
          },[]);
          async function run(command:'updates:check'|'updates:download'|'updates:apply'){
            const bridge=window.ConnectNative;
            if(!bridge)return;
            setError('');
            setState(command==='updates:check'?'checking':command==='updates:download'?'downloading':'restarting');
            try{
              const response=await bridge.request(command,{});
              if(command==='updates:apply')return;
              const next=response?.state;
              if(next==='available'||next==='ready'||next==='current')setState(next);
              else throw Error('Android вернул неизвестное состояние обновления.');
            }catch(reason){
              setError(reason instanceof Error?reason.message:'Не удалось выполнить обновление.');
              setState('error');
            }
          }
          async function checkApk(){
            const bridge=window.ConnectNative;
            if(!bridge)return;
            setApkError('');setApkState('checking');
            try{
              const result=await bridge.request('updates:apk-check',{}) as ApkInfo;
              if(!['current','available','unpublished'].includes(result?.state))throw Error('Некорректный ответ Android');
              setApkInfo(result);setApkState(result.state);
            }catch(reason){
              setApkError(reason instanceof Error?reason.message:'Не удалось проверить APK.');
              setApkState('error');
            }
          }
          async function openApk(){
            const bridge=window.ConnectNative;
            if(!bridge)return;
            setApkError('');setApkState('opening');
            try{
              const result=await bridge.request('updates:apk-open',{});
              if(result?.state!=='opened')throw Error('Android не подтвердил открытие загрузки');
              setApkState('opened');
            }catch(reason){
              setApkError(reason instanceof Error?reason.message:'Не удалось открыть скачивание APK.');
              setApkState('error');
            }
          }
          const progress=state==='checking'||state==='downloading'||state==='restarting';
          const status=state==='loading'?'Получаем сведения о версии…':
            state==='checking'?'Проверяем обновления…':state==='downloading'?'Скачиваем проверенное обновление…':
            state==='restarting'?'Перезапускаем Connect…':state==='available'?'Доступно совместимое обновление интерфейса.':
            state==='ready'?'Обновление загружено и готово к применению.':
            state==='current'?'Обновлений интерфейса пока нет.':
            state==='disabled'?'Автоматические обновления недоступны в этой сборке.':
            state==='error'?error:'Проверка обновлений доступна.';
          const apkStatus=apkState==='checking'?'Проверяем выпуски Connect для Android…':
            apkState==='unpublished'?'Подписанные APK ещё не опубликованы в разделе Releases.':
            apkState==='current'?'Установлена последняя опубликованная версия Android.':
            apkState==='available'?`Доступна версия ${apkInfo?.version} (${apkInfo?.build}), ${apkInfo?.size?Math.round(apkInfo.size/1048576):'?'} МиБ.`:
            apkState==='opening'?'Открываем загрузку APK…':
            apkState==='opened'?'Загрузка открыта. Скачайте APK и подтвердите установку в Android.':
            apkError;
          return <div className="settings-group data-settings connect-ota-about">
            <strong>Connect Messenger</strong>
            <p>Версия {info?.version?(info.build===null?info.version:`${info.version} (${info.build})`):'определяется…'}</p>
            <p><strong>Разработчики: Алина и Кирилл</strong></p>
            <p className="settings-hint">Мессенджер для личного общения.</p>
            <div className="connect-ota-rule"/>
            <strong>Обновление приложения</strong>
            <p className="settings-hint"><strong>Обновления интерфейса</strong></p>
            <p className="settings-hint">Совместимые изменения интерфейса загружаются по воздуху через Expo, без установки APK.</p>
            <p className="connect-ota-status" role="status" aria-live="polite">{status}</p>
            {state==='ready'?<button type="button" className="settings-action" disabled={progress} onClick={()=>void run('updates:apply')}>Применить и перезапустить</button>:
              state==='available'?<button type="button" className="settings-action" disabled={progress} onClick={()=>void run('updates:download')}>Скачать обновление</button>:
              state!=='disabled'&&state!=='loading'&&state!=='restarting'?<button type="button" className="settings-action" disabled={progress} onClick={()=>void run('updates:check')}>Проверить обновления интерфейса</button>:null}
            {info?.enabled&&<p className="settings-hint">Канал: {info.channel||'неизвестен'}. Connect также проверяет Expo при обычном запуске.</p>}
            <div className="connect-ota-rule"/>
            <strong>Новая версия Android (APK)</strong>
            <p className="settings-hint">Для изменений звонков и системных функций Connect проверяет только подписанные выпуски из официального GitHub-репозитория.</p>
            <p className="connect-ota-status" role="status" aria-live="polite">{apkStatus}</p>
            {apkState==='available'?<button type="button" className="settings-action" onClick={()=>void openApk()}>Скачать APK {apkInfo?.version}</button>:null}
            {apkState!=='checking'&&apkState!=='opening'?<button type="button" className="settings-action secondary" onClick={()=>void checkApk()}>Проверить версию Android</button>:null}
            <p className="settings-hint">APK скачивается через системный браузер. Android попросит подтвердить установку. Не удаляйте старую версию: при совпадении подписи обновление установится поверх неё.</p>
          </div>;
        }
        END_CONNECT_APK_UPDATES_927
        mkdir -p "$(dirname native/tests/connect-apk-update-20261117.test.cjs)"
        cat > native/tests/connect-apk-update-20261117.test.cjs <<'END_CONNECT_APK_UPDATES_927'
        'use strict';
        const {test}=require('node:test'),assert=require('node:assert/strict'),fs=require('node:fs'),path=require('node:path');
        const ts=require('typescript');
        const root=path.resolve(__dirname,'..'),read=p=>fs.readFileSync(path.join(root,p),'utf8');
        const source=read('src/ConnectApkUpdates.ts');
        const transpiled=ts.transpileModule(source,{compilerOptions:{target:ts.ScriptTarget.ES2022,module:ts.ModuleKind.CommonJS}}).outputText;
        const mod={exports:{}};new Function('module','exports',transpiled)(mod,mod.exports);
        const parse=mod.exports.parseConnectApkRelease;
        const valid=(version='3.0.8',build=26)=>({
         tag_name:`connect-android-v${version}-b${build}`,draft:false,prerelease:false,
         assets:[{name:'Connect.apk',state:'uploaded',size:48_000_000,digest:'sha256:'+'a'.repeat(64),
         browser_download_url:`https://github.com/Chimera1988/connect-android/releases/download/connect-android-v${version}-b${build}/Connect.apk`}]
        });
        test('GitHub Releases: strictly newer verified candidate only',()=>{
         const result=parse(valid(),25);
         assert.equal(result.state,'available');assert.equal(result.build,26);
         assert.equal(result.candidate.url,valid().assets[0].browser_download_url);
         assert.equal(result.candidate.sha256,'a'.repeat(64));
         assert.equal(parse(valid(),26).state,'current');
         assert.equal(parse(valid('3.0.7',25),26).state,'current');
         assert.equal(parse(valid('3.0.7',25),25).state,'current');
        });
        test('refuse spoofed, ambiguous, corrupt or unsigned external APK assets',()=>{
         const attacks=[
          x=>{x.assets[0].browser_download_url='https://evil.example/Connect.apk';},
          x=>{x.assets[0].digest=null;},
          x=>{x.assets[0].digest='sha256:'+'b'.repeat(60);},
          x=>{x.assets[0].size=10;},
          x=>{x.assets[0].state='starter';},
          x=>{x.assets.push({...x.assets[0]});},
          x=>{x.tag_name='connect-android-v3.0.8-b26/../../';},
          x=>{x.tag_name='v3.0.8';},
          x=>{x.draft=true;},
          x=>{x.prerelease=true;},
          x=>{x.assets[0].name='evil.apk';},
         ];
         for(const alter of attacks){const data=valid();alter(data);assert.throws(()=>parse(data,25));}
         assert.throws(()=>parse(valid(),0));
         assert.throws(()=>parse(valid(),NaN));
        });
        test('real Android bridge provides no arbitrary URL/payload to native APK download',()=>{
         const app=read('src/App.tsx'),proto=read('src/hybridProtocol.ts'),ui=read('web/components/ConnectOtaSettings.tsx');
         for(const op of ['apk-check','apk-open']){
          assert.match(app,new RegExp(`case 'updates:${op}'`));
          assert.match(proto,new RegExp(`'updates:${op}'`));
          assert.match(ui,new RegExp(`updates:${op}`));
         }
         assert.match(app,/checkConnectApkRelease\(installedBuild\)/);
         assert.match(app,/apkCandidate\.current/);
         assert.match(proto,/updates:apk-check':case 'updates:apk-open':return fields\(value,\[\]\)/);
         assert.doesNotMatch(ui,/fetch\(|EXPO_TOKEN|SERVICE_ROLE_KEY/);
         assert.match(app,/voiceRef\.current\.phase!==['"]idle['"]\|\|recordingActive\.current/);
        });
        test('source integrity covers every modified and new file',()=>{
         const lock=JSON.parse(read('PARITY_SOURCE_LOCK.json'));
         const crypto=require('node:crypto');
         for(const name of ['src/App.tsx','src/hybridProtocol.ts','src/ConnectApkUpdates.ts',
           'web/components/ConnectOtaSettings.tsx','tests/connect-apk-update-20261117.test.cjs']){
          assert.equal(lock.files[name],crypto.createHash('sha256').update(fs.readFileSync(path.join(root,name))).digest('hex'),name);
         }
         assert.equal(JSON.parse(read('app.json')).expo.android.versionCode,25);
         assert.ok(Object.keys(lock.files).length>=377);
        });
        END_CONNECT_APK_UPDATES_927
        mkdir -p "$(dirname "$RUNNER_TEMP/connect-apk-patch.py")"
        cat > "$RUNNER_TEMP/connect-apk-patch.py" <<'END_CONNECT_APK_UPDATES_927'
        from pathlib import Path
        import hashlib, json
        root=Path('native')

        def replace_once(relative, before, after):
            path=root/relative
            src=path.read_text(encoding='utf-8')
            if after in src:
                print('ALREADY_PATCHED', relative)
                return
            if src.count(before)!=1:
                raise SystemExit(f'SOURCE_DRIFT: {relative}: expected 1 exact anchor, found {src.count(before)}')
            path.write_text(src.replace(before,after,1),encoding='utf-8')

        app='src/App.tsx'
        replace_once(app,
            "import * as Updates from 'expo-updates';",
            "import * as Updates from 'expo-updates';\nimport {checkConnectApkRelease,type ConnectApkCandidate} from './ConnectApkUpdates';")
        replace_once(app,
            "  const otaDownloaded=useRef(false),recordingActive=useRef(false);",
            "  const otaDownloaded=useRef(false),recordingActive=useRef(false);\n  const apkCandidate=useRef<ConnectApkCandidate|null>(null);")
        replace_once(app,
            'build:Constants.platform?.android?.versionCode??null,',
            'build:Constants.platform?.android?.versionCode??Constants.expoConfig?.android?.versionCode??null,')

        commands="""        case 'updates:apk-check':{
                  const installedBuild=Number(Constants.platform?.android?.versionCode??Constants.expoConfig?.android?.versionCode??0);
                  const checked=await checkConnectApkRelease(installedBuild);
                  apkCandidate.current=checked.candidate??null;
                  result={state:checked.state,version:checked.version??null,build:checked.build??null,size:checked.size??null};
                  break;
                }
                case 'updates:apk-open':{
                  const apk=apkCandidate.current;
                  if(!apk||Date.now()-apk.checkedAt>10*60*1000)throw Error('Сначала заново проверьте обновление Android');
                  if(voiceRef.current.phase!=='idle'||recordingActive.current||saves.current.size||fileTransfers.current.size||AppState.currentState!=='active')
                    throw Error('Завершите звонок, запись или передачу файла перед открытием APK.');
                  // The URL was validated inside checkConnectApkRelease; WebView cannot supply a download URL.
                  await Linking.openURL(apk.url);
                  result={state:'opened'};
                  break;
                }
        """
        replace_once(app,"        case 'notification:diagnostics':",commands+"        case 'notification:diagnostics':")

        protocol='src/hybridProtocol.ts'
        replace_once(protocol,
          "  | 'updates:info' | 'updates:check' | 'updates:download' | 'updates:apply'",
          "  | 'updates:info' | 'updates:check' | 'updates:download' | 'updates:apply' | 'updates:apk-check' | 'updates:apk-open'")
        replace_once(protocol,
          "    case 'updates:info':case 'updates:check':case 'updates:download':case 'updates:apply':return fields(value,[]);",
          "    case 'updates:info':case 'updates:check':case 'updates:download':case 'updates:apply':case 'updates:apk-check':case 'updates:apk-open':return fields(value,[]);")

        # Preserve exactly the source-locked ABI and all native dependencies.
        appcfg=json.loads((root/'app.json').read_text())['expo']
        assert appcfg['android']['package']=='com.connect.messenger'
        assert appcfg['version']=='3.0.7' and appcfg['android']['versionCode']==25
        assert appcfg['runtimeVersion']=='connect-android-ota-v1-sdk58'
        assert appcfg['updates']['requestHeaders']['expo-channel-name']=='production'
        assert appcfg['extra']['eas']['projectId']=='430c7f08-3921-48d5-96d1-f7c3d686d3bf'

        manifest=root/'PARITY_SOURCE_LOCK.json'
        obj=json.loads(manifest.read_text())
        for file in ['src/App.tsx','src/hybridProtocol.ts','src/ConnectApkUpdates.ts',
                     'web/components/ConnectOtaSettings.tsx','tests/connect-apk-update-20261117.test.cjs']:
            p=root/file
            if not p.is_file(): raise SystemExit('MISSING_ADDED_FILE: '+file)
            obj['files'][file]=hashlib.sha256(p.read_bytes()).hexdigest()
        assert len(obj['files'])>=377
        manifest.write_text(json.dumps(obj,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
        print('APK_CHECKER_SOURCE_LOCKED:',len(obj['files']),'files; Expo SDK and native APK identity unchanged')
        END_CONNECT_APK_UPDATES_927
        python3 "$RUNNER_TEMP/connect-apk-patch.py"
        # The About-screen test was created for four Expo-only commands. Expand
        # its exact-denylist test to the two new APK commands without weakening
        # the nonce/origin/payload validation it protects.
        python3 - <<'PY_COMPAT_OTA_TEST_20261117'
        from pathlib import Path
        import json,hashlib
        root=Path('native')
        file=root/'tests/connect-ota-about-20261117.test.cjs'
        source=file.read_text(encoding='utf-8')
        old=r"  assert.match(proto,/case 'updates:info':case 'updates:check':case 'updates:download':case 'updates:apply':return fields\(value,\[\]\)/);"
        new=r"  assert.match(proto,/case 'updates:info':case 'updates:check':case 'updates:download':case 'updates:apply':case 'updates:apk-check':case 'updates:apk-open':return fields\(value,\[\]\)/);"
        if source.count(old)==1 and new not in source:
            file.write_text(source.replace(old,new,1),encoding='utf-8')
        elif source.count(new)!=1:
            raise SystemExit('SOURCE_DRIFT: OTA protocol security test changed unexpectedly')
        # Explicitly assert that the new bridge still has EMPTY payload schemas.
        protocol=(root/'src/hybridProtocol.ts').read_text(encoding='utf-8')
        expected="    case 'updates:info':case 'updates:check':case 'updates:download':case 'updates:apply':case 'updates:apk-check':case 'updates:apk-open':return fields(value,[]);"
        assert protocol.count(expected)==1,'Strict APK/OTA bridge validation missing'
        manifest=root/'PARITY_SOURCE_LOCK.json'
        lock=json.loads(manifest.read_text(encoding='utf-8'))
        assert 'tests/connect-ota-about-20261117.test.cjs' in lock['files']
        lock['files']['tests/connect-ota-about-20261117.test.cjs']=hashlib.sha256(file.read_bytes()).hexdigest()
        manifest.write_text(json.dumps(lock,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
        print('OTA_SECURITY_REGRESSION_UPDATED: six strict no-payload commands; source lock refreshed')
        PY_COMPAT_OTA_TEST_20261117
        git diff --check
        (cd native && node scripts/check-parity-source.mjs)
    - name: Verify refreshed dependency lock and OTA contract tests
      shell: bash
      run: |
        set -euo pipefail
        npm ci --no-audit --no-fund
        node scripts/check-parity-source.mjs
        node --test tests/connect-apk-update-20261117.test.cjs tests/android-ui-polish.test.cjs tests/connect-ota-about-20261117.test.cjs tests/connect-ota-config-20261117.test.cjs tests/source-lock.test.cjs
        node scripts/verify-builtin-sounds.cjs
        node scripts/generate-call-policy.cjs --check
      working-directory: native
    - name: Build embedded WebView and check TypeScript, all regression and browser tests
      shell: bash
      run: |
        set -euo pipefail
        npm run build:web
        test -s src/generated/pwa.ts
        npm run typecheck:web
        npm run typecheck
        npx --no-install playwright-core install --with-deps chromium
        export CHROMIUM_PATH="$(node -p "require('playwright-core').chromium.executablePath()")"
        test -x "$CHROMIUM_PATH"
        npm test
        npm run test:browser
        node scripts/check-parity-source.mjs
      working-directory: native
    - name: Export real Android Hermes bundle and validate exact installed runtime
      shell: bash
      run: |
        set -euo pipefail
        npx --no-install expo export --platform android --output-dir "$RUNNER_TEMP/connect-ota-about-export"
        python3 - <<'PY'
        import os,json
        from pathlib import Path
        folder=Path(os.environ['RUNNER_TEMP'])/'connect-ota-about-export'
        assert (folder/'metadata.json').is_file(),'Expo OTA metadata missing'
        assert any(p.stat().st_size>100000 for p in list(folder.rglob('*.hbc'))+list(folder.rglob('*.js'))),'Android Hermes/JS bundle missing'
        app=json.loads(Path('app.json').read_text())['expo']
        assert app['runtimeVersion']=='connect-android-ota-v1-sdk58'
        assert app['android']['versionCode']==25 and app['version']=='3.0.7'
        assert app['updates']['requestHeaders']['expo-channel-name']=='production'
        assert Path('src/generated/pwa.ts').stat().st_size>100000
        print('OTA_EXPORT_VERIFIED: compatible Android JS + built-in WebView only; no new APK')
        PY
      working-directory: native
    - name: Commit only verified OTA sources to Android main
      shell: bash
      run: |
        set -euo pipefail
        (cd native && node scripts/check-parity-source.mjs)
        git add -- native/src/App.tsx native/src/ConnectApkUpdates.ts native/src/hybridProtocol.ts native/web/app/page.tsx native/web/hybrid/android.css native/web/components/ConnectOtaSettings.tsx native/tests/connect-ota-about-20261117.test.cjs native/tests/connect-apk-update-20261117.test.cjs native/tests/android-ui-polish.test.cjs native/package.json native/package-lock.json native/PARITY_SOURCE_LOCK.json
        git diff --cached --check
        if git diff --cached --quiet; then
          echo 'OTA source was already committed; safe to retry publication'
        else
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$(git rev-parse HEAD)" || { echo '::error::Main moved during validation; refusing unsafe push';exit 1; }
          git -c user.name='Connect CI' -c user.email='actions@users.noreply.github.com' commit -m 'Android: native About version and safe OTA update controls'
          git push origin HEAD:main
        fi
    - name: Publish signed-APK checker to Expo production without new APK
      shell: bash
      run: |
        set -euo pipefail
        if [[ -z "${EXPO_TOKEN:-}" ]]; then
          echo '::error::EXPO_TOKEN missing. Source validated but OTA cannot publish. Add the secret and rerun.'
          echo 'CONNECT_OTA_PUBLISHED=no_token' >> "$GITHUB_ENV"
          exit 1
        fi
        # This is a new Expo project; its production channel might not exist yet.
        # Create it only if absent. Do not change an existing channel's branch mapping.
        EAS='npx --yes eas-cli@27.6.0'
        if ! $EAS channel:view production --non-interactive >/dev/null 2>&1; then
          echo 'Expo production channel is not configured; creating it for the first release'
          $EAS channel:create production --non-interactive
        fi
        # Confirm the channel now resolves before attempting to publish.
        $EAS channel:view production --non-interactive
        # Publish exactly the previously tested Expo Android artifact; never rebuild with a different environment.
        npx --yes eas-cli@27.6.0 update --channel production --platform android --environment production --input-dir "$RUNNER_TEMP/connect-ota-about-export" --skip-bundler --message 'Connect Android: in-app signed APK release checker' --non-interactive
        echo 'CONNECT_OTA_PUBLISHED=yes' >> "$GITHUB_ENV"
      working-directory: native
      env:
        EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    - name: Report source/deployment status without false claims
      shell: bash
      run: |
        set -euo pipefail
        {
          echo '## Connect Android 3.0.7 — in-app signed APK updates'
          echo '- Installed APK, signing certificate, native runtime: unchanged.'
          if [[ "${CONNECT_OTA_PUBLISHED:-}" == yes ]]; then
            echo '- Expo OTA: PUBLISHED to production. Restart Connect to receive the update.'
          elif [[ "${CONNECT_OTA_PUBLISHED:-}" == no_token ]]; then
            echo '- Expo OTA: NOT PUBLISHED. Add GitHub secret EXPO_TOKEN and rerun this workflow.'
          else
            echo '- Expo OTA: NOT CONFIRMED (check publish step or publish_ota input).'
          fi
        } >> "$GITHUB_STEP_SUMMARY"
      if: always()
    if: ${{ inputs.mode == 'setup' }}
  release:
    name: Publish signed APK for in-app version discovery
    if: ${{ always() && (inputs.mode == 'publish-apk' || (inputs.mode == 'setup' && needs.update.result == 'success')) }}
    needs:
    - update
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
    - name: Checkout release source provenance
      uses: actions/checkout@v4
      with:
        ref: main
        fetch-depth: 0
    - name: Setup Android SDK signature verification
      uses: android-actions/setup-android@v4
    - name: Prepare verified APK signature and package tools
      shell: bash
      run: |
        set -euo pipefail
        sdkmanager --install 'build-tools;37.0.0' >/dev/null
        test -x "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools/37.0.0/apksigner"
    - name: Create immutable GitHub Release only from verified permanent-signed Connect APK
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        RUN_ID="${{ inputs.source_run_id }}"
        ARTIFACT="${{ inputs.artifact_name }}"
        [[ "$RUN_ID" =~ ^[0-9]{8,12}$ ]] || { echo '::error::Expected a valid Actions run id';exit 1; }
        [[ "$ARTIFACT" =~ ^[A-Za-z0-9._-]{5,128}$ ]] || { echo '::error::Unsafe artifact name';exit 1; }
        mkdir -p "$RUNNER_TEMP/connect-apk-release"
        RUN_JSON="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID")"
        export RUN_JSON
        python3 - <<'PY_RUN_META_879'
        import json,os
        r=json.loads(os.environ['RUN_JSON'])
        assert r['conclusion']=='success' and r['status']=='completed', 'Source APK workflow must be successful'
        assert r['head_repository']['full_name']=='Chimera1988/connect-android', 'Wrong source repository'
        assert r['head_branch']=='main', 'Only main builds are releasable'
        assert r['name'].startswith('Connect Android'), 'Unexpected workflow'
        print('Audited source run',r['id'],r['head_sha'])
        PY_RUN_META_879
        gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$ARTIFACT" --dir "$RUNNER_TEMP/connect-apk-release"
        APK="$RUNNER_TEMP/connect-apk-release/Connect.apk"
        REPORT="$RUNNER_TEMP/connect-apk-release/APK-VERIFICATION.json"
        test -s "$APK" && test -s "$REPORT"
        export APK REPORT RUN_ID
        python3 - <<'PY_VERIFY_META_876'
        import os,json,re,hashlib
        from pathlib import Path
        apk=Path(os.environ['APK']);report=json.loads(Path(os.environ['REPORT']).read_text())
        assert report['applicationId']=='com.connect.messenger'
        version=report['version'];code=report['versionCode']
        assert re.fullmatch(r'[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}',version)
        assert type(code) is int and 25<=code<=2000000000
        assert report['minSdk']==29
        assert report['signing']=='supplied-release-key'
        assert report['compatibleWithPreviousCertificate'] is True
        assert report['signerSha256'].lower()=='a6507c8b798b77774144502fb1d9a6d09c53da98946b174c692175a96c230130'
        sha=hashlib.sha256(apk.read_bytes()).hexdigest()
        assert sha==report['sha256'], 'APK digest differs from audited verification report'
        if os.environ['RUN_ID']=='44152534236':
         assert version=='3.0.7' and code==25
         assert sha=='5d50755822cb2fd4c9fe781cd140b9dc164cf747cab9fce5ceec5caa37e3a5a8', 'Pinned 3.0.7 APK changed'
        assert 5_000_000<apk.stat().st_size<200_000_000
        base=Path(os.environ['RUNNER_TEMP'],'connect-apk-release')
        (base/'release-tag.txt').write_text(f'connect-android-v{version}-b{code}')
        (base/'release-version.txt').write_text(version)
        (base/'release-code.txt').write_text(str(code))
        (base/'release-sha.txt').write_text(sha)
        print('Verified artifact report',version,code,sha)
        PY_VERIFY_META_876
        TOOLS="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}/build-tools/37.0.0"
        test -x "$TOOLS/apksigner" && test -x "$TOOLS/aapt"
        "$TOOLS/apksigner" verify --verbose --print-certs "$APK" > "$RUNNER_TEMP/connect-apk-release/apk-signature.txt"
        "$TOOLS/aapt" dump badging "$APK" > "$RUNNER_TEMP/connect-apk-release/apk-badging.txt"
        python3 - <<'PY_VERIFY_APK_873'
        import os,re
        from pathlib import Path
        base=Path(os.environ['RUNNER_TEMP'],'connect-apk-release')
        sig=(base/'apk-signature.txt').read_text()
        badge=(base/'apk-badging.txt').read_text()
        match=re.search(r'Signer #1 certificate SHA-256 digest: ([0-9a-fA-F]{64})',sig)
        assert match and match.group(1).lower()=='a6507c8b798b77774144502fb1d9a6d09c53da98946b174c692175a96c230130', 'APK signer differs from installed Connect'
        assert "package: name='com.connect.messenger'" in badge
        version=(base/'release-version.txt').read_text();code=(base/'release-code.txt').read_text()
        assert "versionCode='"+code+"'" in badge and "versionName='"+version+"'" in badge
        assert "sdkVersion:'29'" in badge
        assert 'application-debuggable' not in badge
        print('Actual APK package, Android 10 compatibility and permanent certificate verified')
        PY_VERIFY_APK_873
        TAG="$(cat "$RUNNER_TEMP/connect-apk-release/release-tag.txt")"
        SHA="$(cat "$RUNNER_TEMP/connect-apk-release/release-sha.txt")"
        VERSION="$(cat "$RUNNER_TEMP/connect-apk-release/release-version.txt")"
        CODE="$(cat "$RUNNER_TEMP/connect-apk-release/release-code.txt")"
        if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1;then
          echo 'Existing release: verify matching APK digest without overwriting'
        else
          SRC_SHA="$(python3 -c 'import json,os;print(json.loads(os.environ["RUN_JSON"])["head_sha"])')"
          gh release create "$TAG" "$APK#Connect.apk" \
            --repo "$GITHUB_REPOSITORY" --target "$SRC_SHA" \
            --title "Connect Android $VERSION ($CODE)" \
            --notes "Проверенная подписанная сборка Connect Android $VERSION ($CODE). Подпись совместима с установленной Connect. Установите поверх предыдущей версии, не удаляя приложение. Обновления интерфейса публикуются отдельно через Expo OTA."
        fi
        DIGEST=''
        for attempt in 1 2 3 4 5 6;do
          DIGEST="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" --jq '.assets[] | select(.name == "Connect.apk") | .digest' || true)"
          if [[ "$DIGEST" == "sha256:$SHA" ]];then break;fi
          sleep 3
        done
        [[ "$DIGEST" == "sha256:$SHA" ]] || { echo "::error::Missing or different Release SHA-256 for $TAG";exit 1; }
        echo "::notice::Signed APK published to https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG"
    - name: Report published APK to GitHub Actions
      shell: bash
      run: |
        set -euo pipefail
        echo '### Verified Connect Android APK published in GitHub Releases' >> "$GITHUB_STEP_SUMMARY"
        echo 'Future versions can now be discovered inside Connect without searching for a workflow artifact.' >> "$GITHUB_STEP_SUMMARY"
