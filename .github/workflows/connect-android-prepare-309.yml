name: Connect Android | Prepare APK 3.0.9
run-name: Prepare native media cache APK 3.0.9 (27) on main

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: connect-android-production-release
  cancel-in-progress: false

jobs:
  prepare:
    name: Update version and verify the existing native cache
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    defaults:
      run:
        shell: bash
        working-directory: native
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Require current main and unmodified audited source
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'Chimera1988/connect-android'
          test "$GITHUB_REF" = 'refs/heads/main'
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          test -z "$(git status --porcelain)"
          node scripts/check-parity-source.mjs
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: native/package-lock.json
      - name: Prepare the new APK identity, runtime and source lock
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          OLD = ('3.0.8', 26, 'connect-android-ota-v2-sdk58')
          NEW = ('3.0.9', 27, 'connect-android-ota-v3-sdk58')
          app = json.loads(Path('app.json').read_text())['expo']
          package = json.loads(Path('package.json').read_text())
          package_lock = json.loads(Path('package-lock.json').read_text())
          current = (app['version'], app['android']['versionCode'], app['runtimeVersion'])
          if current not in (OLD, NEW):
              raise SystemExit(f'Unexpected version, build or runtime: {current!r}; refusing any edits')
          if package['version'] != current[0] or package_lock['version'] != current[0] or package_lock['packages']['']['version'] != current[0]:
              raise SystemExit('Package and lockfile identities differ; refusing any edits')
          if app['android']['package'] != 'com.connect.messenger':
              raise SystemExit('Unexpected package name')

          def edit(name, pairs):
              file = Path(name)
              source = file.read_text()
              for old, new in pairs:
                  occurrences = source.count(old)
                  if occurrences != 1:
                      raise SystemExit(f'{name}: expected one occurrence of {old!r}, got {occurrences}')
                  source = source.replace(old, new, 1)
              file.write_text(source)

          changed = []
          if current == OLD:
              edits = {
                  'app.json': [
                      ('"version": "3.0.8"', '"version": "3.0.9"'),
                      ('"versionCode": 26', '"versionCode": 27'),
                      ('"runtimeVersion": "connect-android-ota-v2-sdk58"', '"runtimeVersion": "connect-android-ota-v3-sdk58"'),
                  ],
                  'package.json': [
                      ('"version": "3.0.8"', '"version": "3.0.9"'),
                  ],
                  'scripts/check-parity-source.mjs': [
                      ("app.version!=='3.0.8'||app.android.versionCode!==26", "app.version!=='3.0.9'||app.android.versionCode!==27"),
                  ],
                  'tests/source-lock.test.cjs': [
                      ("expo:{version:'3.0.8',android:{package:'com.connect.messenger',versionCode:26}", "expo:{version:'3.0.9',android:{package:'com.connect.messenger',versionCode:27}"),
                  ],
                  'tests/connect-ota-config-20261117.test.cjs': [
                      ("assert.equal(app.version,'3.0.8')", "assert.equal(app.version,'3.0.9')"),
                      ('assert.equal(app.android.versionCode,26)', 'assert.equal(app.android.versionCode,27)'),
                      ("assert.equal(app.runtimeVersion,'connect-android-ota-v2-sdk58')", "assert.equal(app.runtimeVersion,'connect-android-ota-v3-sdk58')"),
                  ],
                  'tests/release-config.test.cjs': [
                      ('assert.equal(expo.android.versionCode, 26)', 'assert.equal(expo.android.versionCode, 27)'),
                  ],
                  # Preserve historical 3.0.8 release fixtures; only update the
                  # assertion about the actual CURRENT installation's version.
                  'tests/connect-apk-update-20261117.test.cjs': [
                      ('assert.equal(JSON.parse(read(\'app.json\')).expo.android.versionCode,26)',
                       'assert.equal(JSON.parse(read(\'app.json\')).expo.android.versionCode,27)'),
                  ],
                  'tests/connect-ota-about-20261117.test.cjs': [
                      ("test('Expo OTA uses the installed production channel and unchanged 3.0.7 runtime'",
                       "test('Expo OTA uses the installed production channel and new v3 runtime'"),
                      ("assert.equal(cfg.version,'3.0.8');assert.equal(cfg.android.versionCode,26)",
                       "assert.equal(cfg.version,'3.0.9');assert.equal(cfg.android.versionCode,27)"),
                      ("assert.equal(cfg.runtimeVersion,'connect-android-ota-v2-sdk58')",
                       "assert.equal(cfg.runtimeVersion,'connect-android-ota-v3-sdk58')"),
                  ],
              }
              # First validate every replacement against the unchanged working tree.
              for name, pairs in edits.items():
                  value = Path(name).read_text()
                  for old, _ in pairs:
                      if value.count(old) != 1:
                          raise SystemExit(f'{name}: changed upstream; expected exactly one {old!r}')
              locktext = Path('package-lock.json').read_text()
              if locktext.count('"version": "3.0.8"') < 2 or locktext[:500].count('"version": "3.0.8"') != 2:
                  raise SystemExit('Unexpected package-lock format; refusing edits')
              for name, pairs in edits.items():
                  edit(name, pairs)
                  changed.append(name)
              Path('package-lock.json').write_text(locktext.replace('"version": "3.0.8"', '"version": "3.0.9"', 2))
              changed.append('package-lock.json')


          # Fix the production verifier's outdated 3.0.8/26 assertion, without
          # weakening signature, runtime, manifest or package safety checks.
          validator=Path('scripts/verify-apk.py')
          script=validator.read_text()
          old_check = 'assert "versionCode=\'26\'" in badging and "versionName=\'3.0.8\'" in badging, \'Wrong release version\''
          new_check = 'assert f"versionCode=\'{app_config[\'android\'][\'versionCode\']}\'" in badging and f"versionName=\'{app_config[\'version\']}\'" in badging, \'Wrong release version\''
          old_report = "'version': '3.0.8', 'versionCode': 26, 'minSdk': 29,"
          new_report = "'version': app_config['version'], 'versionCode': app_config['android']['versionCode'], 'minSdk': 29,"
          badging_line = "badging = subprocess.check_output([str(tools / 'aapt'), 'dump', 'badging', str(apk)], text=True)"
          config_line = "app_config = json.loads((Path(__file__).resolve().parents[1]/'app.json').read_text())['expo']"
          if script.count(old_check)==1:
              if script.count(old_report)!=1 or script.count(badging_line)!=1 or script.count('    '+config_line)!=1:
                  raise SystemExit('Unexpected verify-apk.py; refusing unsafe patch')
              script=script.replace(badging_line,config_line+'\n'+badging_line,1)
              script=script.replace(old_check,new_check,1)
              script=script.replace('    '+config_line+'\n','',1)
              script=script.replace(old_report,new_report,1)
              validator.write_text(script)
              changed.append('scripts/verify-apk.py')
          elif script.count(new_check)==1 and script.count(new_report)==1 and script.count(config_line)==1:
              print('APK verifier is already updated')
          else:
              raise SystemExit('Unknown APK verifier state; refusing unsafe patch')

          lock_path = Path('PARITY_SOURCE_LOCK.json')
          lock = json.loads(lock_path.read_text())
          if not lock.get('files') or len(lock['files']) < 300:
              raise SystemExit('Unexpected or incomplete source lock')
          # Rehash only files deliberately updated by this installer.
          for name in changed:
              if name not in lock['files']:
                  raise SystemExit(f'Source lock is missing {name}')
              lock['files'][name] = hashlib.sha256(Path(name).read_bytes()).hexdigest()
          if changed:
              lock_path.write_text(json.dumps(lock, ensure_ascii=False, indent=2) + '\n')
          next_app = json.loads(Path('app.json').read_text())['expo']
          assert (next_app['version'], next_app['android']['versionCode'], next_app['runtimeVersion']) == NEW
          assert json.loads(Path('package-lock.json').read_text())['packages']['']['version'] == '3.0.9'
          print('Prepared version 3.0.9 (27), new native OTA runtime v3; modified:', ', '.join(changed) if changed else 'none')
          PY
          node scripts/check-parity-source.mjs
          # Exercise the exact production version assertion against real and stale APK metadata.
          python3 - <<'PY'
          import ast
          import json
          from pathlib import Path
          cfg=json.loads(Path('app.json').read_text())['expo']
          source=Path('scripts/verify-apk.py').read_text()
          tree=ast.parse(source)
          assertions=[n for n in ast.walk(tree) if isinstance(n,ast.Assert) and isinstance(n.msg,ast.Constant) and n.msg.value=='Wrong release version']
          assert len(assertions)==1
          condition=compile(ast.Expression(assertions[0].test),'verify-apk-version-guard','eval')
          for badging,ok in (
              ("package: name='com.connect.messenger' versionCode='27' versionName='3.0.9'",True),
              ("package: name='com.connect.messenger' versionCode='26' versionName='3.0.8'",False),
              ("package: name='com.connect.messenger' versionCode='27' versionName='3.0.8'",False),
              ("package: name='com.connect.messenger' versionCode='26' versionName='3.0.9'",False),
          ):
              assert bool(eval(condition,{'app_config':cfg,'badging':badging})) is ok
          assert "'version': app_config['version'], 'versionCode': app_config['android']['versionCode']" in source
          assert 'validate_certificate(fingerprint, expected' in source
          print('APK 3.0.9/27 identity guard verified; prior/mixed versions rejected and production signature checks preserved')
          PY
          git diff --check
      - name: Install locked dependencies and run release regressions
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          node scripts/check-parity-source.mjs
          node scripts/release/config.mjs
          # Generate src/generated/pwa.ts before the native TypeScript compiler imports it.
          npm run build:web
          npm run typecheck:web
          npm run typecheck
          # Both Node integration and browser suites need the actual Chromium binary.
          # Keep tests enabled; do not skip them or hide test failures.
          npx --no-install playwright-core install --with-deps chromium
          CHROMIUM_PATH="$(node -p "require('playwright-core').chromium.executablePath()")"
          test -x "$CHROMIUM_PATH"
          export CHROMIUM_PATH
          npm test
          npm run test:browser
          node scripts/release/validate.mjs source
      - name: Confirm only approved files changed, commit to main
        run: |
          set -euo pipefail
          git diff --check
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" || { echo '::error::main changed while verifying. No commit.'; exit 1; }
          python3 - <<'PY'
          import subprocess
          allowed = {
              'native/app.json', 'native/package.json', 'native/package-lock.json',
              'native/PARITY_SOURCE_LOCK.json', 'native/scripts/check-parity-source.mjs',
              'native/tests/source-lock.test.cjs',
              'native/tests/connect-ota-config-20261117.test.cjs',
              'native/tests/release-config.test.cjs',
              'native/tests/connect-apk-update-20261117.test.cjs',
              'native/tests/connect-ota-about-20261117.test.cjs',
              'native/scripts/verify-apk.py',
          }
          changed = set(subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines())
          unexpected = changed - allowed
          if unexpected:
              raise SystemExit(f'Unexpected changed files: {sorted(unexpected)}')
          untracked = subprocess.check_output(['git', 'ls-files', '--others', '--exclude-standard'], text=True).strip()
          if untracked:
              raise SystemExit('Unexpected untracked files: ' + untracked)
          print('Approved changed files:', ', '.join(sorted(changed)) if changed else 'none')
          PY
          if test -z "$(git diff --name-only)"; then
            echo 'APK 3.0.9 already prepared; nothing to commit.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- app.json package.json package-lock.json PARITY_SOURCE_LOCK.json scripts/check-parity-source.mjs tests/source-lock.test.cjs tests/connect-ota-config-20261117.test.cjs tests/release-config.test.cjs tests/connect-apk-update-20261117.test.cjs tests/connect-ota-about-20261117.test.cjs scripts/verify-apk.py
          git diff --cached --check
          git commit -m 'fix(android): verify APK version using reviewed app config'
          git push origin HEAD:main
          echo 'APK verifier fixed for version 3.0.9 build 27. Next: existing Connect Android | PWA parity release, mode=apk, previous_release=connect-android-v3.0.8-b26.' >> "$GITHUB_STEP_SUMMARY"
