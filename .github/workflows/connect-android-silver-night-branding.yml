      - name: Install matching SDK 58 native splash dependency in lockfile
        shell: bash
        working-directory: native
        run: |
          set -euo pipefail
          npm install 'expo-splash-screen@~58.0.13' --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Verify TypeScript and Expo app config - no APK
        shell: bash
        working-directory: native
        env:
          CI: '1'
          EXPO_NO_TELEMETRY: '1'
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm run typecheck
          npx expo config --type public --json > /tmp/connect-android-branding-config.json
          python3 - <<'PY_CONFIG'
          import json
          from pathlib import Path
          c=json.loads(Path('app.json').read_text())['expo']
          assert c['name']=='Connect'
          assert c['icon']=='./assets/connect-icon.png'
          assert c['android']['package']=='com.connect.messenger'
          assert c['android']['adaptiveIcon']['foregroundImage']=='./assets/connect-adaptive-foreground.png'
          assert any(isinstance(p,list) and p[0]=='expo-splash-screen' for p in c['plugins'])
          assert Path('assets/connect-splash-wordmark.png').is_file()
          print('Exact PWA branding configured. Build deferred until final release.')
          PY_CONFIG

      - name: Commit validated sources and pinned PWA art (NO APK)
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git add -- native/app.json native/package.json native/package-lock.json native/src/App.tsx native/src/ConnectNativeSplash.tsx native/assets/connect-icon.png native/assets/connect-adaptive-foreground.png native/assets/connect-splash-bubbles.png native/assets/connect-splash-wordmark.png
          if git diff --cached --quiet; then
            echo 'Silver Night branding already integrated.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(android): mirror PWA icon and Silver Night animated splash'
          git push origin HEAD:main

      - name: Summary - no Android build occurred
        if: success()
        run: |
          {
            echo '### Connect Android — exact PWA Silver Night branding'
            echo '- Launcher uses current PWA icon-512.png; Android adaptive layer uses exact maskable PNG.'
            echo '- Native splash uses exact PWA bubble artwork and dark background.'
            echo '- React Native animated overlay uses exact PWA silver wordmark, 200ms letter reveals, waiting for chat directory before the final t, and 12s fallback.'
            echo '- Only sources and assets changed. TypeScript and Expo configuration validated.'
            echo '- No APK generated. Visual acceptance on device still required before final build.'
          } >> "$GITHUB_STEP_SUMMARY"
