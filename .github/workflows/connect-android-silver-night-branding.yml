# Mirror the *exact* approved PWA visuals on Connect Android.
# Install-only workflow. NO APK, Gradle, prebuild, or Android build.
name: Connect Android - exact PWA icon and Silver Night splash (NO APK)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/connect-android-silver-night-branding.yml

permissions:
  contents: write

concurrency:
  group: connect-android-silver-night-branding
  cancel-in-progress: false

jobs:
  install-branding:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout current Connect Android source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Synchronize to latest main and verify APK gate
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B main origin/main
          python3 - <<'PY_GUARD'
          import re
          from pathlib import Path
          p=Path('.github/workflows/android-apk.yml')
          if not p.is_file():raise SystemExit('Legacy APK workflow missing: refusing branding installation')
          s=p.read_text()
          if re.search(r'^\s{2}push\s*:',s,re.M) or re.search(r'\bassemble(?:Debug|Release)\b',s):
              raise SystemExit('Legacy APK build must remain disabled')
          if not Path('native/src/App.tsx').is_file():raise SystemExit('Native app missing')
          print('APK build remains disabled. This workflow edits only source/assets.')
          PY_GUARD

      - name: Get PWA original icon, adaptive icon, and exact splash artwork
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p native/assets
          PWA_SHA=b9a24c4e2f8e4782793e57cf25c037723cf6f9c7
          RAW="https://raw.githubusercontent.com/Chimera1988/connect-messenger/${PWA_SHA}/public"
          curl -fL --retry 3 --connect-timeout 15 --max-time 120 "$RAW/icon-512.png" -o native/assets/connect-icon.png
          curl -fL --retry 3 --connect-timeout 15 --max-time 120 "$RAW/icon-maskable-512.png" -o native/assets/connect-adaptive-foreground.png
          curl -fL --retry 3 --connect-timeout 15 --max-time 120 "$RAW/connect-splash-bubbles-exact-silver.png" -o native/assets/connect-splash-bubbles.png
          curl -fL --retry 3 --connect-timeout 15 --max-time 120 "$RAW/connect-splash-wordmark-reference.png" -o native/assets/connect-splash-wordmark.png

