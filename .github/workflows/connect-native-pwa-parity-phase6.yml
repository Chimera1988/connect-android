name: Connect Native - PWA parity phase 6 (stickers and favorites)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/connect-native-pwa-parity-phase6.yml

permissions:
  contents: write

concurrency:
  group: connect-native-pwa-parity-phase6
  cancel-in-progress: false

jobs:
  integrate-stickers:
    name: Sticker favorites and recents; TypeScript check (NO APK)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout full native repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Check current main and standalone native app
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B main origin/main
          test -s native/src/ConnectNativeStickers.tsx
          test -s native/src/ConnectNativeChat.tsx
          test -s native/package-lock.json
          test ! -e app

      - name: Apply guarded PWA sticker parity source changes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_CONNECT_PHASE6'
          #!/usr/bin/env python3
          """Phase 6: PWA built-in favorites/recents and durable received keyboard sticker favorites.
          All matching is guarded and changes are committed only after TS validation.
          """
          import subprocess
          from pathlib import Path
          
          STICKERS=Path('native/src/ConnectNativeStickers.tsx')
          CHAT=Path('native/src/ConnectNativeChat.tsx')
          HELPER=Path('native/src/ConnectNativeStickerLibrary.ts')
          MARK='CONNECT_NATIVE_PWA_PHASE6_STICKER_LIBRARY'
          EXPECTED_STICKERS='3a9cebe60a9b0d9efffebcd64f7d2e834153942e'
          EXPECTED_CHAT='84711a13163c8719e7328fbd7d0eb549a34b6496'
          
          def hash_file(path):return subprocess.check_output(['git','hash-object',str(path)],text=True).strip()
          def patch(src,old,new,label):
              n=src.count(old)
              if n!=1:raise SystemExit(f'Phase 6 preflight: {label}: expected 1 anchor, found {n}. No source changes written.')
              return src.replace(old,new,1)
          
          sticker=STICKERS.read_text('utf-8')
          chat=CHAT.read_text('utf-8')
          if MARK in sticker and MARK in chat and HELPER.is_file():
              print('Phase 6 already applied; source unchanged.');raise SystemExit(0)
          if MARK in sticker or MARK in chat or HELPER.exists():
              raise SystemExit('Phase 6 already partially present. Refusing to overwrite current source.')
          if hash_file(STICKERS)!=EXPECTED_STICKERS or hash_file(CHAT)!=EXPECTED_CHAT:
              raise SystemExit('Source changed since phase 5; review anchor versions. No modifications written.')
          
          sticker=patch(sticker,
              "import {ActivityIndicator,Image,Pressable,ScrollView,Text,View} from 'react-native';",
              "import {ActivityIndicator,Alert,Image,Pressable,ScrollView,Text,View} from 'react-native';\nimport * as SecureStore from 'expo-secure-store';",'sticker imports')
          sticker=patch(sticker,
              "const textError=(e:unknown)=>e instanceof Error?e.message:String(e);",
              """const textError=(e:unknown)=>e instanceof Error?e.message:String(e);
          // CONNECT_NATIVE_PWA_PHASE6_STICKER_LIBRARY: device-specific built-in favorites and recents.
          const validBuiltIn=(key:string)=>{
            const [pack,id]=key.split(':');
            return Boolean(packs.some(p=>p.id===pack)&&moods.some(m=>m.id===id));
          };
          const favoriteKey=(id:string)=>`connect-native-sticker-favorites-v1:${id}`;
          const recentKey=(id:string)=>`connect-native-sticker-recent-v1:${id}`;
          """,'storage helpers')
          sticker=patch(sticker,
              "onSend:(body:string)=>Promise<void>;onEmoji:(emoji:string)=>void;onClose:()=>void;enabledPacks?:string[];",
              "onSend:(body:string)=>Promise<boolean>;onEmoji:(emoji:string)=>void;onClose:()=>void;enabledPacks?:string[];",'onSend typed success')
          sticker=patch(sticker,
              "  const [selected,setSelected]=useState('speed');",
              """  const [selected,setSelected]=useState('speed');
            const [favorites,setFavorites]=useState<string[]>([]);
            const [recent,setRecent]=useState<string[]>([]);
            const [localLoaded,setLocalLoaded]=useState(false);
            useEffect(()=>{
              let active=true;setLocalLoaded(false);setFavorites([]);setRecent([]);
              void Promise.all([SecureStore.getItemAsync(favoriteKey(ownerId)),SecureStore.getItemAsync(recentKey(ownerId))])
                .then(([fav,rec])=>{
                  if(!active)return;
                  const parse=(raw:string|null,max:number):string[]=>{
                    try{const value:unknown=raw?JSON.parse(raw):[];
                      return Array.isArray(value)?Array.from(new Set(value.filter((x):x is string=>typeof x==='string'&&validBuiltIn(x)))).slice(0,max):[];
                    }catch{return [];}
                  };
                  setFavorites(parse(fav,100));setRecent(parse(rec,30));
                }).catch(()=>{}).finally(()=>{if(active)setLocalLoaded(true);});
              return()=>{active=false;};
            },[ownerId]);
            useEffect(()=>{if(localLoaded)void SecureStore.setItemAsync(favoriteKey(ownerId),JSON.stringify(favorites)).catch(()=>{});},[favorites,localLoaded,ownerId]);
            useEffect(()=>{if(localLoaded)void SecureStore.setItemAsync(recentKey(ownerId),JSON.stringify(recent)).catch(()=>{});},[recent,localLoaded,ownerId]);
            function toggleFavorite(key:string){if(validBuiltIn(key))setFavorites(prev=>prev.includes(key)?prev.filter(v=>v!==key):[key,...prev].slice(0,100));}
            async function sendBuiltIn(pack:string,id:string){
              if(!validBuiltIn(`${pack}:${id}`)||busy)return;
              const success=await onSend(`[[connect-sticker:${pack}:${id}]]`);
              if(success){
                const key=`${pack}:${id}`;
                const next=[key,...recent.filter(v=>v!==key)].slice(0,30);
                // Parent chat closes the picker after sending. Persist before unmount.
                await SecureStore.setItemAsync(recentKey(ownerId),JSON.stringify(next)).catch(()=>{});
                setRecent(next);
              }
            }
          """,'local favorites state')
          sticker=patch(sticker,
              "  const chosen=active?customStickers.filter(s=>s.pack_id===active.id):[];",
              """  const chosen=active?customStickers.filter(s=>s.pack_id===active.id):[];
            const builtInKeys=selected==='favorites'?favorites:selected==='recent'?recent:
              packs.some(p=>p.id===selected)?moods.map(m=>`${selected}:${m.id}`):[];
            const ownedFavorites=customPacks.filter(p=>p.owner_id===ownerId&&p.name===FAVORITE_NAME);
            const ownedFavoriteIds=new Set(ownedFavorites.map(p=>p.id));
            const savedKeyboardStickers=selected==='favorites'?customStickers.filter(s=>ownedFavoriteIds.has(s.pack_id)):[];
            function removeSavedFavorite(st:CustomSticker){
              Alert.alert('Удалить из избранного?',st.name,[{text:'Отмена',style:'cancel'},
                {text:'Удалить',style:'destructive',onPress:()=>void(async()=>{
                  try{
                    const removed=await db.from('connect_stickers').delete().eq('id',st.id);
                    if(removed.error)throw removed.error;
                    await db.storage.from('connect-stickers').remove([st.storage_path]);
                    setCustomStickers(prev=>prev.filter(x=>x.id!==st.id));
                    setCustomUrls(prev=>{const next={...prev};delete next[st.id];return next;});
                  }catch(e){setError('Не удалось удалить из избранного: '+textError(e));}
                })()}]);
            }
          """,'favorite items')
          sticker=patch(sticker,
              """  useEffect(()=>{
              if(!active)return;
              let alive=true;
              // Resolve only the selected pack; signing every image from all packs at once
              // can overwhelm mobile networks and wastes tokens on files never viewed.
              const selectedStickers=customStickers.filter(x=>x.pack_id===active.id).slice(0,120);""",
              """  useEffect(()=>{
              const selectedStickers=selected==='favorites'
                ? customStickers.filter(st=>customPacks.some(p=>p.id===st.pack_id&&p.owner_id===ownerId&&p.name===FAVORITE_NAME)).slice(0,120)
                : active?customStickers.filter(x=>x.pack_id===active.id).slice(0,120):[];
              if(!selectedStickers.length)return;
              let alive=true;
              // Resolve only the currently visible pack, including saved keyboard stickers.""",'sign favorites when opened')
          sticker=patch(sticker,
              "  },[selected,customStickers]);",
              "  },[selected,customStickers,customPacks,ownerId]);",'favorites signing dependencies')
          sticker=patch(sticker,
              "      {customPacks.map(p=>toggleButton(p.id,`${p.name===FAVORITE_NAME?'⭐':p.emoji||'🎨'} ${p.name===FAVORITE_NAME?'Избранное':p.name}`))}",
              """      {customPacks.filter(p=>!(p.owner_id===ownerId&&p.name===FAVORITE_NAME)).map(p=>toggleButton(p.id,`${p.emoji||'🎨'} ${p.name}`))}
                {toggleButton('favorites','⭐ Избранное')}
                {toggleButton('recent','🕒 Недавние')}""",'favorite and recent tabs')
          start="""      {packs.some(p=>p.id===selected)&&moods.map(m=><Pressable key={m.id} disabled={busy}
                  accessibilityRole="button" accessibilityLabel={'Отправить '+m.title}
                  onPress={()=>void onSend(`[[connect-sticker:${selected}:${m.id}]]`)}
                  style={{width:78,height:89,alignItems:'center',justifyContent:'center',borderRadius:12,backgroundColor:colors.elevated}}>
                  <SvgUri width={67} height={67} uri={builtInUrl(selected as Pack['id'],m.id)}/>
                  <Text numberOfLines={1} style={{fontSize:10,color:colors.muted}}>{m.title}</Text>
                </Pressable>)}"""
          replace="""      {builtInKeys.map(key=>{
                  const [pack,id]=key.split(':');
                  const mood=moods.find(m=>m.id===id);
                  if(!mood||!packs.some(p=>p.id===pack))return null;
                  return <View key={key} style={{width:81,borderRadius:12,backgroundColor:colors.elevated,alignItems:'center',paddingVertical:3}}>
                    <Pressable disabled={busy} accessibilityRole="button" accessibilityLabel={'Отправить '+mood.title}
                      onPress={()=>void sendBuiltIn(pack,id)} style={{alignItems:'center',width:80}}>
                      <SvgUri width={65} height={65} uri={builtInUrl(pack as Pack['id'],id)}/>
                      <Text numberOfLines={1} style={{fontSize:10,color:colors.muted}}>{mood.title}</Text>
                    </Pressable>
                    <Pressable accessibilityRole="button" accessibilityLabel={favorites.includes(key)?'Убрать из избранного':'Добавить в избранное'}
                      onPress={()=>toggleFavorite(key)} style={{width:80,alignItems:'flex-end',paddingRight:7,paddingBottom:3}}>
                      <Text style={{color:favorites.includes(key)?colors.accent:colors.muted,fontSize:17}}>{favorites.includes(key)?'★':'☆'}</Text>
                    </Pressable>
                  </View>;
                })}
                {savedKeyboardStickers.map(st=><View key={st.id} style={{width:82,borderRadius:12,backgroundColor:colors.elevated,paddingVertical:6,alignItems:'center'}}>
                  <Pressable accessibilityRole="button" disabled={busy||!customUrls[st.id]} accessibilityLabel={'Отправить сохранённый стикер '+st.name}
                    onPress={()=>void onSend(`[[connect-custom-sticker:${st.id}]]`)}>
                    {customUrls[st.id]?<Image source={{uri:customUrls[st.id]}} resizeMode="contain" style={{width:68,height:68}}/>:<ActivityIndicator color={colors.accent}/>}
                  </Pressable>
                  <Pressable accessibilityRole="button" accessibilityLabel="Удалить сохранённый стикер" onPress={()=>removeSavedFavorite(st)}>
                    <Text style={{color:colors.accent,fontSize:18}}>★</Text>
                  </Pressable>
                </View>)}
                {selected==='favorites'&&!builtInKeys.length&&!savedKeyboardStickers.length&&<Text style={{padding:14,color:colors.muted}}>Избранных стикеров пока нет.</Text>}
                {selected==='recent'&&!builtInKeys.length&&<Text style={{padding:14,color:colors.muted}}>Недавно отправленных стикеров пока нет.</Text>}"""
          sticker=patch(sticker,start,replace,'built in sticker cards')
          
          chat=patch(chat,
            "import ConnectNativeStickerPicker,{ConnectNativeStickerBubble,parseStickerReference} from './ConnectNativeStickers';",
            "import ConnectNativeStickerPicker,{ConnectNativeStickerBubble,parseStickerReference} from './ConnectNativeStickers';\nimport {saveKeyboardStickerFavorite} from './ConnectNativeStickerLibrary';",'chat helper import')
          chat=patch(chat,
            '  async function sendSticker(body:string):Promise<void>{',
            '  async function sendSticker(body:string):Promise<boolean>{','chat sticker return type')
          chat=patch(chat,
            '    if(busy||uploading||!parseStickerReference(body))return;\n    setBusy(true);',
            '    if(busy||uploading||!parseStickerReference(body))return false;\n    setBusy(true);','chat sticker guard')
          chat=patch(chat,
            "      setReply(null);setStickerPickerOpen(false);await load();\n    }catch(e){setNotice('Стикер не отправлен: '+(e instanceof Error?e.message:String(e)));}\n    finally{setBusy(false);}",
            "      setReply(null);setStickerPickerOpen(false);await load();\n      return true;\n    }catch(e){setNotice('Стикер не отправлен: '+(e instanceof Error?e.message:String(e)));return false;}\n    finally{setBusy(false);}",'chat sticker success')
          chat=patch(chat,
            '  async function sendSticker(body:string):Promise<boolean>{',
            """  // CONNECT_NATIVE_PWA_PHASE6_STICKER_LIBRARY: persist received keyboard images as private stickers.
            async function addKeyboardFavorite(item:Message){
              if(!ownerId||busy)return;
              setBusy(true);setActionMessage(null);
              try{
                const result=await saveKeyboardStickerFavorite(item,ownerId);
                setNotice(result==='exists'?'Этот стикер уже в избранном':'Стикер добавлен в избранное');
              }catch(e){setNotice('Не удалось сохранить стикер: '+(e instanceof Error?e.message:String(e)));}
              finally{setBusy(false);}
            }
            async function sendSticker(body:string):Promise<boolean>{""",'favorite save handler')
          chat=patch(chat,
            "            <LabelButton title=\"Выбрать\" colors={colors} onPress={()=>{setSelectionMode(true);setSelected([actionMessage.id]);setActionMessage(null);}}/>",
            """            <LabelButton title="Выбрать" colors={colors} onPress={()=>{setSelectionMode(true);setSelected([actionMessage.id]);setActionMessage(null);}}/>
                      {actionMessage.attachment_kind==='image'&&/^sticker-\\d+\\.(?:png|webp|gif|jpe?g)$/i.test(actionMessage.attachment_name||'')&&
                        <LabelButton title="Добавить стикер в избранное" colors={colors} onPress={()=>void addKeyboardFavorite(actionMessage)}/>}""",'favorite context menu')
          
          # Preflight completed: make all changes only after the full patch set matched.
          import base64,hashlib
          helper_source=base64.b64decode('')
          if hashlib.sha256(helper_source).hexdigest()!='206490ae26b21f1965014da2de6988163cb195e1ab2797e0cfbc1293c5efbf60':
              raise SystemExit('Bundled helper has failed checksum verification')
          CHAT.write_text(chat,encoding='utf-8')
          STICKERS.write_text(sticker,encoding='utf-8')
          HELPER.write_bytes(helper_source)
          # The helper is bundled in this workflow and validated as a distinct file.
          print('Phase 6 patched chat and picker. No APK/Gradle. TypeScript must pass before commit.')
          PY_CONNECT_PHASE6
          git diff --check

      - name: Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: native/package-lock.json

      - name: Verify React Native TypeScript without compiling APK
        shell: bash
        working-directory: native
        env:
          CI: '1'
          EXPO_NO_TELEMETRY: '1'
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm run typecheck

      - name: Commit source changes only after successful verification
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git add -- native/src/ConnectNativeStickers.tsx native/src/ConnectNativeChat.tsx native/src/ConnectNativeStickerLibrary.ts
          if git diff --cached --quiet; then
            echo 'Sticker parity already integrated. No changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(native): PWA sticker favorites, recent history and saved keyboard stickers'
          git push origin HEAD:main

      - name: Phase 6 summary - no APK
        if: success()
        shell: bash
        run: |
          {
            echo '### Connect Native: PWA sticker parity phase 6'
            echo '- Built-in sticker favorites and recent history, saved per device/account.'
            echo '- Favorites for keyboard stickers are durable private server copies, accessible on other Connect devices.'
            echo '- SHA-256 deduplication, 2 MB limit, JPEG / PNG / WebP / GIF accepted.'
            echo '- The PWA-converted JPEG files and Android original JPEG files may have different fingerprints.'
            echo '- Existing four packs and user-created packs are retained.'
            echo '- TypeScript validation succeeded; **NO APK, Gradle, emulator or runtime test executed**.'
          } >> "$GITHUB_STEP_SUMMARY"
