          CONNECT_306_PATCH
          base64 --decode "$RUNNER_TEMP/connect-source.gz.b64" | gzip -dc > "$RUNNER_TEMP/connect-source.patch"
          printf '%s  %s\n' 'c7c6524404c8291fa20e3c8d9d4a28904082906a3fec023a91e9e0b44ff835fd' "$RUNNER_TEMP/connect-source.patch" | sha256sum --check --status || { echo '::error::Embedded source patch checksum failed'; exit 1; }
