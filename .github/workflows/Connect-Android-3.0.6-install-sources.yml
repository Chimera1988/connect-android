# One-time installation of the reviewed Codex 3.0.6 patch.
# Does not build an APK. Only updates tracked source after drift checks and tests.
name: Connect Android 3.0.6 | Install source update
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: connect-android-install-3-0-6-main
  cancel-in-progress: false
jobs:
  install-source:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    env:
      SOURCE_BASE_SHA: 2948c22df5d3060ae0e15c199737b2cd82c77af3
      PWA_REFERENCE_SHA: 55a5314043e604bdd2f21d35a032bc34fc1ce075
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
      EXPO_PUBLIC_SUPABASE_URL: https://tpwkmoxxzjfdsqsomhhr.supabase.co
      EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_tAg8rPwuBNcA2iPF7voc2Q_vsKUpyZa
      EXPO_PUBLIC_CONNECT_URL: https://connect-chat.duckdns.org
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Verify baseline and apply reviewed patch to main
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$(git rev-parse HEAD)" || { echo '::error::SOURCE_DRIFT: Android main changed during checkout'; exit 1; }
          test "$(git ls-remote https://github.com/Chimera1988/connect-messenger.git refs/heads/main | cut -f1)" = "$PWA_REFERENCE_SHA" || { echo '::error::SOURCE_DRIFT: PWA main changed'; exit 1; }
          if test -s native/PARITY_SOURCE_LOCK.json && node native/scripts/check-parity-source.mjs; then
            echo 'Connect Android 3.0.6 source already installed and verified; no changes.'
            exit 0
          fi
          test "$(git merge-base "$SOURCE_BASE_SHA" HEAD)" = "$SOURCE_BASE_SHA" || { echo '::error::Unexpected Android source ancestry'; exit 1; }
          while IFS= read -r changed; do
            case "$changed" in
              .github/workflows/connect-android-parity-notifications-final.yml|.github/workflows/Connect-Android-3.0.6-install-sources.yml) ;;
              *) echo "::error::SOURCE_DRIFT: unexpected change since source baseline: $changed"; exit 1;;
            esac
