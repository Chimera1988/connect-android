          node native/scripts/check-parity-source.mjs
          git diff --cached --check
          echo 'Source installed in runner. Running tests before commit.'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: native/package-lock.json
      - name: Verify web, native types and unit regressions before publish
        shell: bash
        working-directory: native
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm run build:web
          npm run typecheck:web
          npm run typecheck
          npm test
      - name: Publish source-only commit (no APK)
        shell: bash
        run: |
          set -euo pipefail
          node native/scripts/check-parity-source.mjs
          git diff --cached --check
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$(git rev-parse HEAD)" || { echo '::error::Android main changed during tests; refusing to push'; exit 1; }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git diff --cached --quiet; then echo 'No source changes'; exit 0; fi
          git commit -m 'Connect Android 3.0.6: verified PWA parity and notification fixes'
          git push origin HEAD:main
          echo '3.0.6 sources published. Next: run the parity verification workflow with release_candidate=false.'
