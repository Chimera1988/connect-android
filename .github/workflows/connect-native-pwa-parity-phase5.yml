name: Connect Native - PWA parity phase 5 (voice, video notes and attachments)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/connect-native-pwa-parity-phase5.yml

permissions:
  contents: write

concurrency:
  group: connect-native-pwa-parity-phase5
  cancel-in-progress: false

jobs:
  integrate-media:
    name: Integrate PWA media controls; validate TypeScript (NO APK)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Connect Native history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Get latest main and assert pure native application
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B main origin/main
          test -s native/src/ConnectNativeChat.tsx
          test -s native/src/ConnectNativeMedia.tsx
          test -s native/package-lock.json
          test ! -e app

      - name: Apply guarded phase 5 source changes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_CONNECT_PHASE5'
          #!/usr/bin/env python3
          """Phase 5: PWA voice notes, media playback, attachment preflight. Source-only; no APK."""
          import subprocess
          from pathlib import Path

          CHAT = Path('native/src/ConnectNativeChat.tsx')
          MEDIA = Path('native/src/ConnectNativeMedia.tsx')
          MARK='CONNECT_NATIVE_PWA_PHASE5_MEDIA'
          EXPECTED_CHAT='aaf816ddd8c581daedad0ec0209b4387782b854a'
          EXPECTED_MEDIA='a818b0f2fcd0acb5b9930bb04d23e9396882569d'

          def sha(path):
              return subprocess.check_output(['git','hash-object',str(path)],text=True).strip()

          def patch(src,old,new,label):
              n=src.count(old)
              if n!=1: raise SystemExit(f'Phase 5 preflight: {label}: expected 1 anchor, got {n}. No source files were changed.')
              return src.replace(old,new,1)

          chat=CHAT.read_text('utf-8');media=MEDIA.read_text('utf-8')
          if MARK in chat and MARK in media:
              print('Phase 5 has already been applied. Nothing to commit.');raise SystemExit(0)
          if MARK in chat or MARK in media:
              raise SystemExit('Phase 5 partially present: refused to overwrite.')
          if sha(CHAT)!=EXPECTED_CHAT or sha(MEDIA)!=EXPECTED_MEDIA:
              raise SystemExit('Native sources have changed since verified phase 4. Review them before applying phase 5; nothing modified.')

          # Audio playback: timestamp, seekable progress, speed 1/1.5/2 x, controls in chat AND profile library.
          media=patch(media,
          '''function AudioClip({uri,colors}:{uri:string;colors:Palette}) {
            const player = useAudioPlayer(uri,{updateInterval:250});
            const state = useAudioPlayerStatus(player);
            return <View style={{flexDirection:'row',alignItems:'center',gap:10,flex:1}}>
              <IconButton name={state.playing?'pause-circle':'play-circle'} label={state.playing?'Пауза':'Воспроизвести'} colors={colors}
                onPress={()=>state.playing?player.pause():player.play()}/>
              <Text style={{color:colors.muted,fontSize:12}}>{Math.floor(state.currentTime||0)} / {Math.floor(state.duration||0)} с</Text>
            </View>;
          }''',
          '''// CONNECT_NATIVE_PWA_PHASE5_MEDIA: seekable audio messages with 1x/1.5x/2x playback.
          const audioClock=(value:number)=>{
            const n=Math.max(0,Math.floor(Number.isFinite(value)?value:0));
            return `${Math.floor(n/60)}:${String(n%60).padStart(2,'0')}`;
          };
          function AudioClip({uri,colors}:{uri:string;colors:Palette}) {
            const player=useAudioPlayer(uri,{updateInterval:250});
            const state=useAudioPlayerStatus(player);
            const [speed,setSpeed]=useState(1);
            const [barWidth,setBarWidth]=useState(1);
            const duration=Math.max(0,state.duration||0);
            const position=Math.max(0,Math.min(duration,state.currentTime||0));
            const fraction=duration>0?position/duration:0;
            return <View style={{width:260,maxWidth:'100%',gap:4}}>
              <View style={{flexDirection:'row',alignItems:'center',gap:5}}>
                <IconButton name={state.playing?'pause-circle':'play-circle'} label={state.playing?'Пауза':'Воспроизвести'} colors={colors}
                  onPress={()=>state.playing?player.pause():player.play()}/>
                <Pressable accessibilityRole="button" accessibilityLabel={`Перемотка аудио: ${audioClock(position)} из ${audioClock(duration)}`}
                  onLayout={event=>setBarWidth(Math.max(1,event.nativeEvent.layout.width))}
                  onPress={event=>{if(duration>0){const x=event.nativeEvent.locationX;void player.seekTo(Math.max(0,Math.min(duration,duration*x/barWidth)));}}}
                  style={{height:31,flex:1,justifyContent:'center',paddingVertical:13}}>
                  <View pointerEvents="none" style={{height:5,backgroundColor:colors.line,borderRadius:4,overflow:'hidden'}}>
                    <View style={{height:5,width:Math.round(fraction*barWidth),backgroundColor:colors.accent,borderRadius:4}}/>
                  </View>
                </Pressable>
                <Pressable accessibilityRole="button" accessibilityLabel={`Скорость воспроизведения ${speed}x`}
                  onPress={()=>{const next=speed===1?1.5:speed===1.5?2:1;player.setPlaybackRate(next);setSpeed(next);}}
                  style={{paddingHorizontal:7,paddingVertical:5,borderRadius:8,backgroundColor:colors.elevated}}>
                  <Text style={{color:colors.accent,fontWeight:'700',fontSize:12}}>{speed}×</Text>
                </Pressable>
              </View>
              <Text style={{color:colors.muted,fontSize:11,marginLeft:7}}>{audioClock(position)} / {audioClock(duration)}</Text>
            </View>;
          }''','audio playback component')

          # Inline video notes loop and can be muted/unmuted, keeping the PWA round player.
          media=patch(media,
          '''function VideoNoteBubble({uri,colors}:{uri:string;colors:Palette}) {
            const player=useVideoPlayer(uri,instance=>{instance.loop=false;});
            const [playing,setPlaying]=useState(false);
            return <Pressable accessibilityRole="button" accessibilityLabel={playing?'Пауза видеокружка':'Воспроизвести видеокружок'}
              onPress={()=>{if(playing)player.pause();else player.play();setPlaying(!playing);}}
              style={{width:208,height:208,borderRadius:104,overflow:'hidden',backgroundColor:'#081421',borderWidth:2,borderColor:colors.accent}}>
              <VideoView player={player} nativeControls={false} contentFit="cover" surfaceType="textureView" style={{width:'100%',height:'100%'}} />
              {!playing&&<View pointerEvents="none" style={{position:'absolute',top:0,left:0,right:0,bottom:0,alignItems:'center',justifyContent:'center',backgroundColor:'#06101b44'}}>
                <Ionicons name="play-circle" size={52} color="#fff"/>
              </View>}
            </Pressable>;
          }''',
          '''function VideoNoteBubble({uri,colors}:{uri:string;colors:Palette}) {
            const player=useVideoPlayer(uri,instance=>{instance.loop=true;});
            const [playing,setPlaying]=useState(false);
            const [muted,setMuted]=useState(false);
            return <View style={{width:208,height:220}}>
              <Pressable accessibilityRole="button" accessibilityLabel={playing?'Пауза видеокружка':'Воспроизвести видеокружок'}
                onPress={()=>{if(playing)player.pause();else player.play();setPlaying(!playing);}}
                style={{width:208,height:208,borderRadius:104,overflow:'hidden',backgroundColor:'#081421',borderWidth:2,borderColor:colors.accent}}>
                <VideoView player={player} nativeControls={false} contentFit="cover" surfaceType="textureView" style={{width:'100%',height:'100%'}} />
                {!playing&&<View pointerEvents="none" style={{position:'absolute',top:0,left:0,right:0,bottom:0,alignItems:'center',justifyContent:'center',backgroundColor:'#06101b44'}}>
                  <Ionicons name="play-circle" size={52} color="#fff"/>
                </View>}
              </Pressable>
              <Pressable accessibilityRole="button" accessibilityLabel={muted?'Включить звук видеокружка':'Выключить звук видеокружка'}
                onPress={()=>{const next=!muted;player.muted=next;setMuted(next);}}
                style={{position:'absolute',right:2,bottom:0,borderRadius:17,padding:8,backgroundColor:colors.surface,borderWidth:1,borderColor:colors.line}}>
                <Ionicons name={muted?'volume-mute':'volume-high'} size={19} color={colors.accent}/>
              </Pressable>
            </View>;
          }''','video-note bubble looping and mute')

          # Recording state: timer, cancel without uploading, and microphone mode restored before lengthy uploads.
          chat=patch(chat,
          '''  const recorder=useAudioRecorder(RecordingPresets.HIGH_QUALITY);
            const recorderState=useAudioRecorderState(recorder);
            const id=conversation.id;''',
          '''  const recorder=useAudioRecorder(RecordingPresets.HIGH_QUALITY);
            const recorderState=useAudioRecorderState(recorder);
            // CONNECT_NATIVE_PWA_PHASE5_MEDIA: recording may be sent or cancelled; never auto-send on cancel.
            const [recordSeconds,setRecordSeconds]=useState(0);
            const recordingBegan=useRef(0);
            const recordingTransition=useRef(false);
            useEffect(()=>{
              if(!recorderState.isRecording)return;
              const timer=setInterval(()=>setRecordSeconds(recordingBegan.current?Math.floor((Date.now()-recordingBegan.current)/1000):0),250);
              return()=>clearInterval(timer);
            },[recorderState.isRecording]);
            const id=conversation.id;''','recording state and timer')
          chat=patch(chat,
          '''  async function toggleRecord(){
              if(uploading)return;
              try{
                if(recorderState.isRecording){
                  await recorder.stop();
                  const uri=recorder.uri;
                  if(!uri)throw new Error('Запись не найдена');
                  await db.from('conversation_user_state').upsert({conversation_id:id,user_id:ownerId,recording_until:null},{onConflict:'conversation_id,user_id'});
                  await sendAttachment({uri,name:`connect-voice-${Date.now()}.m4a`,mime:'audio/mp4',size:new File(uri).size},'audio');
                  await setAudioModeAsync({allowsRecording:false,playsInSilentMode:true});
                }else{
                  const permission=await AudioModule.requestRecordingPermissionsAsync();
                  if(!permission.granted){setNotice('Нужен доступ к микрофону');return;}
                  await setAudioModeAsync({allowsRecording:true,playsInSilentMode:true});
                  await recorder.prepareToRecordAsync();
                  recorder.record();
                  await db.from('conversation_user_state').upsert({conversation_id:id,user_id:ownerId,recording_until:new Date(Date.now()+120000).toISOString()},{onConflict:'conversation_id,user_id'});
                }
              }catch(e){setNotice('Запись: '+(e instanceof Error?e.message:String(e)));}
            }''',
          '''  async function clearRecordingPresence(){
              await db.from('conversation_user_state').upsert({conversation_id:id,user_id:ownerId,recording_until:null},{onConflict:'conversation_id,user_id'});
            }
            async function cancelRecord(){
              if(!recorderState.isRecording||recordingTransition.current)return;
              recordingTransition.current=true;
              try{
                await recorder.stop();
                recordingBegan.current=0;setRecordSeconds(0);
                await setAudioModeAsync({allowsRecording:false,playsInSilentMode:true});
                await clearRecordingPresence();
                setNotice('Запись отменена');
              }catch(e){setNotice('Отмена записи: '+(e instanceof Error?e.message:String(e)));}
              finally{recordingTransition.current=false;}
            }
            async function toggleRecord(){
              if(uploading||recordingTransition.current)return;
              recordingTransition.current=true;
              try{
                if(recorderState.isRecording){
                  await recorder.stop();
                  const uri=recorder.uri;
                  recordingBegan.current=0;setRecordSeconds(0);
                  // Release microphone audio mode immediately, before an upload that can take minutes.
                  await setAudioModeAsync({allowsRecording:false,playsInSilentMode:true});
                  await clearRecordingPresence();
                  if(!uri)throw new Error('Запись не найдена');
                  const bytes=new File(uri).size;
                  if(bytes<1000)throw new Error('Записан пустой файл. Попробуйте ещё раз.');
                  await sendAttachment({uri,name:`connect-voice-${Date.now()}.m4a`,mime:'audio/mp4',size:bytes},'audio');
                }else{
                  const permission=await AudioModule.requestRecordingPermissionsAsync();
                  if(!permission.granted){setNotice('Нужен доступ к микрофону');return;}
                  await setAudioModeAsync({allowsRecording:true,playsInSilentMode:true});
                  await recorder.prepareToRecordAsync();
                  recordingBegan.current=Date.now();setRecordSeconds(0);
                  recorder.record();
                  await db.from('conversation_user_state').upsert({conversation_id:id,user_id:ownerId,recording_until:new Date(Date.now()+120000).toISOString()},{onConflict:'conversation_id,user_id'});
                }
              }catch(e){setNotice('Запись: '+(e instanceof Error?e.message:String(e)));}
              finally{recordingTransition.current=false;}
            }''','recording send/cancel logic')

          # Files: the PWA has a pre-send tray; adding and removing up to 20 selected files is safer than immediate send.
          chat=patch(chat,
          '''  const [albumProgress,setAlbumProgress]=useState('');
            const [uploadProgress,setUploadProgress]=useState('');''',
          '''  const [albumProgress,setAlbumProgress]=useState('');
            const [uploadProgress,setUploadProgress]=useState('');
            const [pendingFiles,setPendingFiles]=useState<LocalUpload[]>([]);''','pending file state')
          chat=patch(chat,
          '''  async function sendAlbum(files:LocalUpload[]){
              if(uploading||busy||files.length<2||files.length>20)return;''',
          '''  async function sendAlbum(files:LocalUpload[]):Promise<boolean>{
              if(uploading||busy||files.length<2||files.length>20)return false;''','album boolean result signature')
          chat=patch(chat,
          '''      setReply(null);
                await load();
              }catch(e){
                if(created.length){''',
          '''      setReply(null);
                await load();
                return true;
              }catch(e){
                if(created.length){''','album success marker')
          chat=patch(chat,
          '''      setNotice('Альбом: '+(e instanceof Error?e.message:String(e)));
              }finally{setUploading(false);setAlbumProgress('');}
            }''',
          '''      setNotice('Альбом: '+(e instanceof Error?e.message:String(e)));
                return false;
              }finally{setUploading(false);setAlbumProgress('');}
            }''','album failure marker')
          chat=patch(chat,
          '''  async function attachMedia(fromCamera=false){''',
          '''  function queueAttachments(files:LocalUpload[]){
              if(!files.length)return;
              const invalid=files.find(f=>(f.size??new File(f.uri).size)>100*1024*1024);
              if(invalid){setNotice('Файл '+invalid.name+' больше 100 МБ');return;}
              setPendingFiles(prev=>{
                if(prev.length+files.length>20){setNotice('Можно выбрать не более 20 файлов за раз');return prev;}
                return [...prev,...files];
              });
            }
            async function sendPending(){
              if(!pendingFiles.length||uploading||busy)return;
              const files=[...pendingFiles];
              const media=files.filter(f=>f.mime.startsWith('image/')||f.mime.startsWith('video/'));
              const documents=files.filter(f=>!f.mime.startsWith('image/')&&!f.mime.startsWith('video/'));
              if(media.length&&documents.length){setNotice('Для альбома выбирайте фото и видео отдельно от документов');return;}
              if(media.length>1){
                if(await sendAlbum(media))setPendingFiles([]);
                return;
              }
              for(let i=0;i<files.length;i++){
                const f=files[i];
                if(!await sendAttachment(f)){
                  setPendingFiles(files.slice(i));
                  return;
                }
              }
              setPendingFiles([]);
            }
            async function attachMedia(fromCamera=false){''','pending file queue and dispatch')
          chat=patch(chat,
          '''          if(files.length===1)await sendAttachment(files[0]);
                    else if(files.length>1){
                      if(files.length>20){setNotice('В альбоме может быть максимум 20 файлов.');return;}
                      Alert.alert('Отправить альбом?',`${files.length} фото и видео будут отправлены одним сообщением.`,[
                        {text:'Отмена',style:'cancel'},
                        {text:'Отправить',onPress:()=>void sendAlbum(files)},
                      ]);
                    }''',
          '''          queueAttachments(files);''','gallery pending selection')
          chat=patch(chat,
          '''      const pick=await DocumentPicker.getDocumentAsync({type:'*/*',multiple:false,copyToCacheDirectory:true});
                if(!pick.canceled)for(const file of pick.assets){await sendAttachment({uri:file.uri,name:file.name,mime:file.mimeType||'application/octet-stream',size:file.size});}''',
          '''      const pick=await DocumentPicker.getDocumentAsync({type:'*/*',multiple:true,copyToCacheDirectory:true});
                if(!pick.canceled)queueAttachments(pick.assets.map(file=>({uri:file.uri,name:file.name,mime:file.mimeType||'application/octet-stream',size:file.size})));''','multi-document pending selection')
          chat=patch(chat,
              '      {Boolean(draft.trim())?<Btn name="send" colors={colors} label="Отправить" disabled={busy} onPress={()=>void submit()}/>',
              '      {!recorderState.isRecording&&Boolean(draft.trim())?<Btn name="send" colors={colors} label="Отправить" disabled={busy} onPress={()=>void submit()}/>',
              'recording stop control always visible')
          chat=patch(chat,
          '''    {uploadProgress!==''&&<Text style={{color:colors.accent,textAlign:'center',padding:5}}>{uploadProgress}</Text>}''',
          '''    {pendingFiles.length>0&&<View style={{marginHorizontal:10,marginBottom:7,padding:10,borderRadius:15,backgroundColor:glassColor(colors.surface,.93),borderWidth:1,borderColor:colors.line}}>
                <Text style={{color:colors.text,fontSize:13,fontWeight:'700',marginBottom:8}}>Выбрано файлов: {pendingFiles.length}</Text>
                <ScrollView horizontal showsHorizontalScrollIndicator={false} keyboardShouldPersistTaps="always">
                  {pendingFiles.map((file,index)=><View key={`${file.uri}-${index}`} style={{width:105,marginRight:10,gap:3}}>
                    {file.mime.startsWith('image/')?<Image source={{uri:file.uri}} resizeMode="cover" style={{width:102,height:68,borderRadius:8}}/>:
                      <View style={{width:102,height:68,backgroundColor:colors.elevated,borderRadius:8,alignItems:'center',justifyContent:'center'}}>
                        <Ionicons name={file.mime.startsWith('video/')?'videocam-outline':'document-outline'} size={30} color={colors.accent}/>
                      </View>}
                    <Text numberOfLines={2} style={{color:colors.text,fontSize:11}}>{file.name}</Text>
                    <Pressable accessibilityRole="button" accessibilityLabel={`Убрать ${file.name}`} disabled={uploading}
                      onPress={()=>setPendingFiles(prev=>prev.filter((_,j)=>j!==index))}>
                      <Text style={{color:colors.danger,fontSize:12}}>Убрать</Text>
                    </Pressable>
                  </View>)}
                </ScrollView>
                <View style={{flexDirection:'row',justifyContent:'space-between',marginTop:7}}>
                  <Btn name="close-circle-outline" label="Отменить выбор" colors={colors} disabled={uploading} onPress={()=>setPendingFiles([])}/>
                  <Pressable accessibilityRole="button" accessibilityLabel="Отправить выбранные вложения" disabled={uploading||busy}
                    onPress={()=>void sendPending()} style={{padding:10,borderRadius:12,backgroundColor:colors.accent,opacity:uploading?0.5:1}}>
                    <Text style={{color:colors.bg,fontSize:13,fontWeight:'800'}}>Отправить выбранное</Text>
                  </Pressable>
                </View>
              </View>}
              {uploadProgress!==''&&<Text style={{color:colors.accent,textAlign:'center',padding:5}}>{uploadProgress}</Text>}''','pending files preview UI')
          chat=patch(chat,
          '''    {recorderState.isRecording&&<Text style={{color:colors.danger,textAlign:'center',padding:5}}>● Идёт запись — нажми Стоп для отправки</Text>}''',
          '''    {recorderState.isRecording&&<View style={{paddingHorizontal:14,paddingVertical:9,flexDirection:'row',alignItems:'center',justifyContent:'space-between',gap:10}}>
                <Text style={{color:colors.danger,fontWeight:'700',fontSize:13}}>● Запись {audioTime(recordSeconds)}</Text>
                <Pressable accessibilityRole="button" accessibilityLabel="Отменить голосовое сообщение" onPress={()=>void cancelRecord()}
                  style={{padding:8,borderRadius:10,backgroundColor:colors.elevated}}>
                  <Text style={{color:colors.danger,fontWeight:'700',fontSize:13}}>Отменить</Text>
                </Pressable>
                <Text style={{color:colors.muted,fontSize:12}}>Стоп — отправить</Text>
              </View>}''','recording timer and cancel UI')
          chat=patch(chat,
          '''const time=(value:string)=>new Date(value).toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'});''',
          '''const time=(value:string)=>new Date(value).toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'});
          const audioTime=(seconds:number)=>`${Math.floor(seconds/60)}:${String(seconds%60).padStart(2,'0')}`;''','time formatting helper')

          # Write after all anchors validated. CI will run TypeScript and commit only on success.
          CHAT.write_text(chat,encoding='utf-8')
          MEDIA.write_text(media,encoding='utf-8')
          print('Phase 5 applied to 2 source files; ready for TypeScript verification. NO APK.')
          PY_CONNECT_PHASE5
          git diff --check

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: native/package-lock.json

      - name: Verify native TypeScript; no Android build
        shell: bash
        working-directory: native
        env:
          CI: '1'
          EXPO_NO_TELEMETRY: '1'
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm run typecheck

      - name: Save only verified media source changes
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git add -- native/src/ConnectNativeChat.tsx native/src/ConnectNativeMedia.tsx
          if git diff --cached --quiet; then
            echo 'PWA media controls already integrated; no commit needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(native): PWA voice controls and attachment composer parity'
          git push origin HEAD:main

      - name: Summary - phase 5, source only
        if: success()
        shell: bash
        run: |
          {
            echo '### Connect Native phase 5: voice, inline video, attachment composer'
            echo '- Voice recording can be sent or cancelled with a live timer.'
            echo '- Audio playback has seeking, timestamps and 1x/1.5x/2x speeds.'
            echo '- Video circles repeat and expose a mute button.'
            echo '- Up to 20 selected files have a preview tray with removal before sending.'
            echo '- TypeScript validation passed; **NO APK or Gradle build performed**.'
            echo '- Runtime microphone, camera and storage tests are still required for final release.'
          } >> "$GITHUB_STEP_SUMMARY"
