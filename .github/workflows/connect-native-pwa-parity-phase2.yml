# Connect PWA parity phase 2 — Native settings/appearance SOURCE ONLY.
# Upload this file to .github/workflows/connect-native-pwa-parity-phase2.yml on main.
# Trigger only when this installer is uploaded; does not run Gradle or create any APK.
name: Connect Native - PWA parity phase 2 (settings and appearance)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/connect-native-pwa-parity-phase2.yml

permissions:
  contents: write

concurrency:
  group: connect-native-pwa-parity-phase2
  cancel-in-progress: false

jobs:
  integrate-native-settings:
    name: Integrate PWA settings and TypeScript check (NO APK)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout main with native history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Verify Connect Native project is present
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B main origin/main
          test -s native/src/App.tsx
          test -s native/src/ConnectNativeChat.tsx
          test -s native/src/ConnectNativeStickers.tsx
          test -s native/src/ConnectNativeGlass.tsx
          test -s native/src/ConnectNativeInvites.tsx
          test -s native/package-lock.json
          test ! -e app

