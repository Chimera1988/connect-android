              raise SystemExit('Installer payload checksum mismatch; refused to alter the source tree.')
          files=json.loads(raw.decode('utf-8'))
          names={'PWA_PARITY_PHASE2.md', 'ConnectNativeStickerManager.tsx', 'ConnectNativeSettings.tsx', 'ConnectNativeAppearance.ts', 'apply_phase2.py'}
          if set(files)!=names:
              raise SystemExit('Unexpected installer files')
          target=Path('native/src')
          for name in ('ConnectNativeAppearance.ts','ConnectNativeSettings.tsx','ConnectNativeStickerManager.tsx'):
              path=target/name
              if path.exists() and path.read_text(encoding='utf-8')!=files[name]:
                  raise SystemExit('Source changed unexpectedly: '+str(path))
              path.write_text(files[name],encoding='utf-8')
              print('Wrote',path)
          doc=Path('native/PWA_PARITY_PHASE2.md')
          if doc.exists() and doc.read_text(encoding='utf-8')!=files['PWA_PARITY_PHASE2.md']:
              raise SystemExit('Parity documentation was changed; manual review required')
          doc.write_text(files['PWA_PARITY_PHASE2.md'],encoding='utf-8')
          installer=Path('/tmp/connect-native-phase2-apply.py')
          installer.write_text(files['apply_phase2.py'],encoding='utf-8')
          subprocess.run([sys.executable,str(installer)],check=True)
          print('Ready for TS typecheck. No Android/Gradle/APK build requested.')
          PY_CONNECT_PHASE2

      - name: Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: native/package-lock.json

      - name: Install dependencies and verify native TypeScript
        shell: bash
        working-directory: native
        env:
          CI: '1'
          EXPO_NO_TELEMETRY: '1'
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm run typecheck

      - name: Commit only typechecked native source changes
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git add -- native/src/App.tsx native/src/theme.ts native/src/ConnectNativeGlass.tsx \
            native/src/ConnectNativeChat.tsx native/src/ConnectNativeStickers.tsx \
            native/src/ConnectNativeAppearance.ts native/src/ConnectNativeSettings.tsx \
            native/src/ConnectNativeStickerManager.tsx native/PWA_PARITY_PHASE2.md
          if git diff --cached --quiet; then
            echo 'This PWA settings phase was already applied; nothing to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(native): add PWA settings hierarchy and appearance preferences'
          git push origin HEAD:main

      - name: Source integration summary - APK still prohibited
        if: success()
        shell: bash
        run: |
          {
            echo '### Connect Native - PWA settings/appearance integration'
            echo '- TypeScript passed and native sources committed.'
            echo '- Separate PWA-style settings pages, light/dark modes, scene and accent preferences, wallpaper, sticker management.'
            echo '- Notification settings, profile editing, and existing invitation administration integrated.'
            echo '- Still incomplete: full JSON export, FCM delivery, music mini-player, game, fine UI parity.'
            echo '- **NO APK, NO Gradle, NO Android build.**'
          } >> "$GITHUB_STEP_SUMMARY"
