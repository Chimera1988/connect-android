# Connect Native: chosen audio files + notification read sync. NEVER modifies legacy app/
name: Connect Native - custom Android sounds and cross-device read sync
'on':
  workflow_dispatch: null
  push:
    branches:
    - main
    paths:
    - .github/workflows/connect-native-alerts-sounds.yml
permissions:
  contents: write
concurrency:
  group: connect-native-alerts-sounds
  cancel-in-progress: false
jobs:
  integrate-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
    - name: Checkout Connect Android
      uses: actions/checkout@v4
      with:
        persist-credentials: true
    - name: Sync latest main and verify previous integration
      shell: bash
      run: |-
        set -euo pipefail
        git fetch origin main
        git checkout -B main origin/main
        for p in native/src/ConnectNativeStickers.tsx native/src/ConnectNativeVideoNote.tsx native/src/ConnectNativeAlbum.tsx native/src/ConnectNativePush.ts; do
          test -s "$p" || { echo "Missing required native feature: $p" >&2; exit 1; }
        done
        # Require the preceding combined upload improvements.
        grep -q 'tus' native/src/nativeMediaUtils.ts || { echo 'Run media bundle integration first' >&2; exit 1; }
    - name: Node.js 24
      uses: actions/setup-node@v4
      with:
        node-version: '24'
    - name: Java 17
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'
    - name: Android SDK
      uses: android-actions/setup-android@v4
      with:
        packages: platform-tools
    - name: Integrate Android sounds and safe notification read sync
      shell: bash
      run: |-
        python3 - <<'PY_CONNECT_ALERTS'
        from pathlib import Path
        import base64,hashlib,zlib,subprocess
        files=[
            ('native/src/ConnectNativeSoundSettings.tsx','c122019928e3f25ba1504c5ff1be3422e9aed336a2362dd9a9c27ebf14114a08',''),
            ('native/plugins/withConnectSounds.js','02aad776d9224001fcc067d5359989eacc011e16ce949210a32445b880d38355',''),
            ('scripts/apply.py','0846745696247498997ff85a02c9cae5649da219820dc53c632cf9b210797889',''),
        ]
        for target,sha,encoded in files:
            raw=zlib.decompress(base64.b64decode(encoded))
            if hashlib.sha256(raw).hexdigest()!=sha:
                raise SystemExit('Corrupted installer payload: '+target)
            if target=='scripts/apply.py':
                # Build-script-only, not committed or deployed.
                Path('/tmp/connect-native-sounds-apply.py').write_bytes(raw)
                continue
            path=Path(target)
            if path.exists() and path.read_bytes()!=raw:
                raise SystemExit('Cannot overwrite modified source file: '+target)
            path.parent.mkdir(parents=True,exist_ok=True)
            path.write_bytes(raw)
        subprocess.run(['python3','/tmp/connect-native-sounds-apply.py'],check=True)

        PY_CONNECT_ALERTS
    - name: Verify TypeScript
      working-directory: native
      env:
        CI: '1'
        EXPO_NO_TELEMETRY: '1'
      run: |-
        npm ci --no-audit --no-fund
        npm run typecheck
    - name: Generate Android with native MediaStore sound module
      working-directory: native
      env:
        CI: '1'
        EXPO_NO_TELEMETRY: '1'
      run: |-
        npx expo prebuild --platform android --no-install --clean
        python3 - <<'PY_CHECK'
        from pathlib import Path
        pkg=Path('android/app/src/main/java/com/connect/messenger')
        app=(pkg/'MainApplication.kt').read_text()
        assert 'add(ConnectSoundPackage())' in app, 'Native SoundPackage not registered in MainApplication'
        assert (pkg/'ConnectSoundModule.kt').is_file(), 'Missing MediaStore bridge'
        assert (pkg/'ConnectSoundPackage.kt').is_file(), 'Missing ReactPackage bridge'
        print('Android sound selection MediaStore module installed')
        PY_CHECK
    - name: Install Android SDK 37 (as previous green native builds)
      run: |-
        sdkmanager --channel=3 --install 'platforms;android-37.0' 'build-tools;37.0.0' 'platform-tools'
        test -s "${ANDROID_SDK_ROOT}/platforms/android-37.0/android.jar"
    - name: Compile native Android debug for CI verification ONLY
      working-directory: native/android
      env:
        CI: '1'
        EXPO_NO_TELEMETRY: '1'
      run: |-
        chmod +x gradlew
        ./gradlew :app:assembleDebug --no-daemon --stacktrace
        test -s app/build/outputs/apk/debug/app-debug.apk
    - name: Commit tested native sources only
      shell: bash
      run: |-
        set -euo pipefail
        git diff --check
        git config user.name 'github-actions[bot]'
        git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
        git add native/src/ConnectNativeSoundSettings.tsx native/plugins/withConnectSounds.js native/src/ConnectNativePush.ts native/src/ConnectNativeTelecom.ts native/src/App.tsx native/src/ConnectNativeChat.tsx native/app.json
        if git diff --cached --quiet; then echo 'Native sound and read sync features already installed'; exit 0; fi
        git commit -m 'feat(native): phone-selected notification sounds and read synchronization'
        git push origin HEAD:main
