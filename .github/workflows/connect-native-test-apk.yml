name: Connect Native - Standalone Test APK with JS bundle and icon

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/connect-native-test-apk.yml

permissions:
  contents: read

concurrency:
  group: connect-native-safe-test-apk
  cancel-in-progress: false

jobs:
  native-standalone-test-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
      EXPO_PUBLIC_SUPABASE_URL: https://tpwkmoxxzjfdsqsomhhr.supabase.co
      # Public client key only. NEVER put a service-role key in a mobile APK.
      EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_tAg8rPwuBNcA2iPF7voc2Q_vsKUpyZa
      EXPO_PUBLIC_CONNECT_URL: https://connect-chat.duckdns.org
    steps:
      - name: Checkout Connect Native, without modifying the repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check native sources and original Connect icon
        shell: bash
        run: |
          set -euo pipefail
          test -s native/src/ConnectNativeInbox.ts
          test -s native/src/ConnectNativeSoundSettings.tsx
          test -s native/src/ConnectNativeTelecom.ts
          test -s native/plugins/withConnectSounds.js
          test -s app/google-services.json
          test -s app/src/main/res/drawable/connect_icon.png
          python3 - <<'PY_CHECK'
          import json
          from pathlib import Path
          config=json.loads(Path('native/app.json').read_text())
          assert config['expo']['android']['package']=='com.connect.messenger', 'Native package was changed unexpectedly'
          assert config['expo']['android']['googleServicesFile']=='../app/google-services.json', 'Firebase config path changed'
          print('Source package and original icon verified; legacy WebView will not be changed')
          PY_CHECK

      - name: Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install and type-check native dependencies
        working-directory: native
        shell: bash
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm run typecheck

      - name: Set the existing Connect icon in this CI build only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p native/assets
          cp app/src/main/res/drawable/connect_icon.png native/assets/connect-icon.png
          python3 - <<'PY_ICON'
          from pathlib import Path
          import json
          p=Path('native/app.json')
          value=json.loads(p.read_text())
          expo=value['expo']
          expo['name']='Connect Native Test'
          expo['icon']='./assets/connect-icon.png'
          expo['android']['adaptiveIcon']={
              'foregroundImage':'./assets/connect-icon.png',
              'backgroundColor':'#07121b',
          }
          p.write_text(json.dumps(value,ensure_ascii=False,indent=2)+'\n')
          print('Original Connect 512px icon selected for Android launcher and adaptive icon')
          PY_ICON

      - name: Generate Android project for a self-contained installable APK
        working-directory: native
        shell: bash
        run: |
          set -euo pipefail
          npx expo prebuild --platform android --no-install --clean

      - name: Use the isolated TEST package for the RELEASE build type
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_VARIANT'
          from pathlib import Path
          import json,copy,re

          # Modify generated Android files on the runner ONLY.
          # assembleRelease bundles JavaScript into the APK; assembleDebug does NOT.
          production='com.connect.messenger'
          preview=production+'.native'
          root=Path('native/android/app')
          groovy=root/'build.gradle'
          kotlin=root/'build.gradle.kts'
          if groovy.exists():
              path=groovy
              suffix='applicationIdSuffix ".native"'
              debug_signing='signingConfig signingConfigs.debug'
              matcher=r'(?m)^([ \t]*)release\s*\{'
          elif kotlin.exists():
              path=kotlin
              suffix='applicationIdSuffix = ".native"'
              debug_signing='signingConfig = signingConfigs.getByName("debug")'
              matcher=r'(?m)^([ \t]*)(?:getByName\(\s*"release"\s*\)|named\(\s*"release"\s*\)|release)\s*\{'
          else:
              raise SystemExit('Android Gradle application file was not generated')
          content=path.read_text()
          types=list(re.finditer(r'(?m)^[ \t]*buildTypes\s*\{',content))
          if len(types)!=1:
              raise SystemExit(f'Expected exactly one buildTypes block, found {len(types)}')
          begin=types[0].end()
          depth=1
          end=None
          for pos in range(begin,len(content)):
              if content[pos]=='{': depth+=1
              elif content[pos]=='}':
                  depth-=1
                  if depth==0:
                      end=pos
                      break
          if end is None:
              raise SystemExit('Unclosed buildTypes block')
          section=content[begin:end]
          hits=list(re.finditer(matcher,section))
          if len(hits)!=1:
              raise SystemExit(f'Expected exactly one buildTypes.release block, found {len(hits)}')
          match=hits[0]
          release_start=begin+match.end()
          # Detect a real closing brace, not the enclosing buildTypes closing brace.
          depth=1
          release_end=None
          for pos in range(release_start,len(content)):
              if content[pos]=='{': depth+=1
              elif content[pos]=='}':
                  depth-=1
                  if depth==0:
                      release_end=pos
                      break
          if release_end is None:
              raise SystemExit('Unclosed buildTypes.release block')
          body=content[release_start:release_end]
          if 'applicationIdSuffix' in body:
              raise SystemExit('Unexpected existing release applicationIdSuffix; refusing to make an unsafe APK')
          # QA-only APK: sign the release variant with Android's temporary debug
          # keystore so it can be installed without requiring production credentials.
          additions=[suffix]
          if not re.search(r'\bsigningConfig\b',body):
              additions.append(debug_signing)
          elif not ('signingConfigs.debug' in body or 'signingConfigs.getByName("debug")' in body):
              raise SystemExit('Unknown release signing setup. Do not overwrite production signing configuration.')
          indent=match.group(1)+'    '
          insertion='\n'+''.join(indent+line+'\n' for line in additions)
          content=content[:release_start]+insertion+content[release_start:]
          if content.count(suffix)!=1:
              raise SystemExit('Incorrect test applicationId suffix')
          path.write_text(content)
          print('Configured RELEASE JavaScript bundle + isolated test package + QA debug signing')

          # Firebase Gradle plugin otherwise rejects the new package. This
          # temporary cloned client ONLY allows compilation. It does not create
          # a real Firebase registration for the test app, so FCM needs separate testing.
          services=root/'google-services.json'
          data=json.loads(services.read_text())
          clients=data.get('client') or []
          base=next((x for x in clients if x.get('client_info',{}).get('android_client_info',{}).get('package_name')==production),None)
          if base is None:
              raise SystemExit('Original Firebase app is missing')
          if not any(x.get('client_info',{}).get('android_client_info',{}).get('package_name')==preview for x in clients):
              test=copy.deepcopy(base)
              test['client_info']['android_client_info']['package_name']=preview
              clients.append(test)
          services.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n')
          print('Generated test package:',preview)
          print('FCM push requires a separately registered Firebase test app to be fully verified')
          PY_VARIANT

      - name: Install preview Android SDK 37 used by prior successful builds
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --channel=3 --install 'platforms;android-37.0' 'build-tools;37.0.0' 'platform-tools'
          test -s "${ANDROID_SDK_ROOT}/platforms/android-37.0/android.jar"

      - name: Build standalone release-variant APK with bundled JavaScript
        working-directory: native/android
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew :app:assembleRelease --no-daemon --stacktrace
          test -s app/build/outputs/apk/release/app-release.apk

      - name: Verify offline JavaScript bundle, APK signature, icon and identity
        shell: bash
        run: |
          set -euo pipefail
          apk='native/android/app/build/outputs/apk/release/app-release.apk'
          test -s "$apk"
          unzip -t "$apk" | tail -n 2
          unzip -Z1 "$apk" | grep -Fx 'assets/index.android.bundle'
          aapt="${ANDROID_SDK_ROOT}/build-tools/37.0.0/aapt"
          signer="${ANDROID_SDK_ROOT}/build-tools/37.0.0/apksigner"
          test -x "$aapt"
          test -x "$signer"
          "$signer" verify --verbose "$apk"
          package_line="$("$aapt" dump badging "$apk" | sed -n '/^package:/p')"
          echo "$package_line"
          if [[ "$package_line" != *"name='com.connect.messenger.native'"* ]]; then
            echo 'Incorrect test package name; refusing to publish.' >&2
            exit 1
          fi
          if "$aapt" dump badging "$apk" | grep -q 'application-debuggable'; then
            echo 'APK still has a debuggable manifest; not a standalone QA release.' >&2
            exit 1
          fi
          # Confirm launcher icon resources exist in the compiled APK.
          "$aapt" dump badging "$apk" | grep -E 'application-icon|application: label' | sed -n '1,5p'
          git diff --exit-code -- app/
          mkdir -p test-apk
          cp "$apk" test-apk/Connect-Native-TEST.apk
          (cd test-apk && sha256sum Connect-Native-TEST.apk > SHA256.txt)
          printf '%s\n' \
            'Connect Native standalone Android TEST APK' \
            'Package: com.connect.messenger.native' \
            'Build type: release code bundle (no Metro required), signed with disposable QA debug key' \
            'This does NOT replace the original com.connect.messenger application.' \
            'Icon: original Connect artwork.' \
            'FCM push requires a real Firebase registration for the test application.' \
            'Not a production-signed update. Test login, chats, media, calls, Bluetooth and notifications.' \
            > test-apk/README.txt

      - name: Upload installable Connect Native test APK
        uses: actions/upload-artifact@v4
        with:
          name: Connect-Native-TEST-APK
          path: test-apk/
          retention-days: 30
          if-no-files-found: error

      - name: GitHub summary
        if: success()
        shell: bash
        run: |
          {
            echo '### Connect Native: standalone Android APK ready for testing'
            echo ''
            echo '- Download artifact **Connect-Native-TEST-APK**.'
            echo '- Install **Connect-Native-TEST.apk** from the archive.'
            echo '- Includes **index.android.bundle**: no Metro / USB / computer required.'
            echo '- Includes original Connect launcher icon.'
            echo '- Test-only package: `com.connect.messenger.native` (safe alongside old Connect).'
            echo '- Signed with a disposable QA/debug key, **not** a production release.'
            echo '- Firebase push in this isolated package is not guaranteed; it needs separate registration.'
          } >> "$GITHUB_STEP_SUMMARY"
