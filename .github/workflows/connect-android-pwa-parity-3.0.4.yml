# One-shot exact-source parity update for Connect Android: selected PWA UI patch + APK.
# Repository: Chimera1988/connect-android
# Path: .github/workflows/connect-android-pwa-parity-3.0.4.yml
# Neither the PWA repository nor its deployment is modified.
name: Connect Android 3.0.4 — PWA UI parity and release APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/connect-android-pwa-parity-3.0.4.yml'

permissions:
  contents: write

concurrency:
  group: connect-android-pwa-parity-304-${{ github.ref }}
  cancel-in-progress: false

jobs:
  parity-and-apk:
    if: github.repository == 'Chimera1988/connect-android' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
      EXPO_PUBLIC_SUPABASE_URL: 'https://tpwkmoxxzjfdsqsomhhr.supabase.co'
      EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: 'sb_publishable_tAg8rPwuBNcA2iPF7voc2Q_vsKUpyZa'
      EXPO_PUBLIC_CONNECT_URL: 'https://connect-chat.duckdns.org'
      CONNECT_PREVIOUS_CERT_SHA256: ${{ vars.CONNECT_PREVIOUS_CERT_SHA256 || 'fac61745dc0903786fb9ede62a962b399f7348f0bb6f899b8332667591033b9c' }}
    steps:
      - name: Checkout verified Android 3.0.3 source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Fetch exact successful PWA source (read-only)
        uses: actions/checkout@v4
        with:
          repository: Chimera1988/connect-messenger
          ref: d64183598bdee2efa81a1c6bb96cde1ae14fbc99
          path: .pwa-reference
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Merge PWA chat/media UI without replacing Android bridges
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/connect-pwa-parity.py.gz.b64" <<'CONNECT_PARITY_PAYLOAD'
          
          CONNECT_PARITY_PAYLOAD
          python3 - <<'PYTHON_DECODE'
          import base64,gzip,os,pathlib
          raw=base64.b64decode(pathlib.Path(os.environ['RUNNER_TEMP'],'connect-pwa-parity.py.gz.b64').read_text().strip())
          code=gzip.decompress(raw)
          file=pathlib.Path(os.environ['RUNNER_TEMP'],'connect-pwa-parity.py')
          file.write_bytes(code)
          print('Verified embedded parity patch:',len(code),'bytes')
          PYTHON_DECODE
          python3 "$RUNNER_TEMP/connect-pwa-parity.py"
          git diff --check

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: native/package-lock.json

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android platform and build tools
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --channel=3 'platforms;android-37.0' 'build-tools;37.0.0' 'platform-tools'

      - name: Verify shared PWA interface and unchanged native services
        working-directory: native
        shell: bash
        run: |
          set -euo pipefail
          node -e "const x=require('./app.json').expo;if(x.version!=='3.0.4'||x.android.versionCode!==22||x.android.package!=='com.connect.messenger')throw Error('Android version / package changed unexpectedly');"
          npm ci --no-audit --no-fund
          node scripts/verify-builtin-sounds.cjs
          node scripts/generate-call-policy.cjs --check
          npm run build:web
          npm run typecheck:web
          npm run typecheck
          npm test -- --test-isolation=none
          CHROMIUM_PATH="$(command -v google-chrome || command -v chromium)" npm run test:browser

      - name: Prepare release certificate
        env:
          CONNECT_RELEASE_KEYSTORE_BASE64: ${{ secrets.CONNECT_RELEASE_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "$CONNECT_RELEASE_KEYSTORE_BASE64" ]]; then
            umask 077
            printf '%s' "$CONNECT_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/connect-release.jks"
            echo "CONNECT_RELEASE_KEYSTORE_FILE=$RUNNER_TEMP/connect-release.jks" >> "$GITHUB_ENV"
          else
            echo '::warning::Using existing project signing fallback. Previous certificate hash verification is mandatory.'
          fi

      - name: Generate the unchanged native Android services and manifest
        working-directory: native
        shell: bash
        run: |
          set -euo pipefail
          npx expo prebuild --platform android --no-install
          python3 - <<'VERIFY_NATIVE'
          from pathlib import Path
          from xml.etree import ElementTree as ET
          path=Path('android/app/src/main/AndroidManifest.xml')
          root=ET.parse(path).getroot(); ns='{http://schemas.android.com/apk/res/android}'
          app=root.find('application')
          assert app is not None
          assert app.get(ns+'icon')=='@mipmap/connect_launcher_v303', 'Existing Connect branded icon lost'
          assert app.get(ns+'roundIcon')=='@mipmap/connect_launcher_v303_round','Existing adaptive icon lost'
          print('Android launcher manifests unchanged; native calls, push and proximity retained')
          VERIFY_NATIVE

      - name: Compile and test final Connect Android 3.0.4 APK
        working-directory: native/android
        env:
          CONNECT_RELEASE_STORE_PASSWORD: ${{ secrets.CONNECT_RELEASE_STORE_PASSWORD }}
          CONNECT_RELEASE_KEY_ALIAS: ${{ secrets.CONNECT_RELEASE_KEY_ALIAS }}
          CONNECT_RELEASE_KEY_PASSWORD: ${{ secrets.CONNECT_RELEASE_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew :app:testReleaseUnitTest :app:lintVitalRelease :app:assembleRelease -PreactNativeArchitectures=armeabi-v7a,arm64-v8a -Pkotlin.incremental=false --no-daemon --max-workers=2

      - name: Verify the signed APK and embedded full PWA UI
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release/Connect-Android-3.0.4
          cp native/android/app/build/outputs/apk/release/app-release.apk release/Connect-Android-3.0.4/Connect.apk
          python3 native/scripts/verify-apk.py release/Connect-Android-3.0.4/Connect.apk release/Connect-Android-3.0.4
          python3 - <<'VERIFY_UI'
          from pathlib import Path
          import json,zipfile
          apk=Path('release/Connect-Android-3.0.4/Connect.apk')
          report=json.loads(Path('release/Connect-Android-3.0.4/APK-VERIFICATION.json').read_text())
          assert (report['version'],report['versionCode'])==('3.0.4',22)
          assert report['compatibleWithPreviousCertificate'] is True, 'Signing certificate does not match the expected installed app'
          assert report['applicationId']=='com.connect.messenger'
          # Source-level features were compiled into the embedded Vite PWA, not merely copied as unused files.
          html=Path('native/web/dist/index.html').read_text(encoding='utf-8')
          for token in ['connect-v5-video-note','connect-forward-compact','connect-full-gallery','connect-unified-media','connect-media-thumb']:
            assert token in html, 'New PWA UI is missing from the compiled Android WebView: '+token
          assert 'ConnectTranscript' not in html,'Obsolete transcription UI accidentally restored'
          with zipfile.ZipFile(apk) as z:
            assert z.testzip() is None,'APK ZIP integrity failure'
          print('Embedded interface present; APK signature, package, Android 10 and assets verified')
          VERIFY_UI
          cp native/PWA_UI_PARITY_3_0_4.md release/Connect-Android-3.0.4/PWA-PORT-REPORT.md
          printf 'PWA source d64183598bdee2efa81a1c6bb96cde1ae14fbc99\n' > release/Connect-Android-3.0.4/PWA-SOURCE.txt

      - name: Save only verified Android source changes to main
        shell: bash
        run: |
          set -euo pipefail
          git add -- native/web/app/page.tsx native/web/app/profile-media.css \
            native/web/app/connect-unified-chat.css native/web/app/connect-media-frame-overlay.css \
            native/web/components/ConnectGalleryViewer.tsx native/web/components/ConnectProfileMedia.tsx \
            native/web/hybrid/main.tsx native/app.json native/package.json native/package-lock.json \
            native/scripts/verify-apk.py native/tests/release-config.test.cjs native/PWA_UI_PARITY_3_0_4.md
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Connect Android 3.0.4: port verified PWA UI while preserving native services [skip ci]'
            git push origin HEAD:main
          fi
          git rev-parse HEAD > release/Connect-Android-3.0.4/SOURCE-COMMIT.txt
          (cd release/Connect-Android-3.0.4 && zip -9 ../Connect-Android-3.0.4.zip ./*)

      - name: Upload one final APK ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: Connect-Android-3.0.4
          path: release/Connect-Android-3.0.4.zip
          if-no-files-found: error
          retention-days: 30

      - name: Remove signing material
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/connect-release.jks"
