name: Connect Native - PWA parity phase 4 (chat history and navigation)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/connect-native-pwa-parity-phase4.yml

permissions:
  contents: write

concurrency:
  group: connect-native-pwa-parity-phase4
  cancel-in-progress: false

jobs:
  apply-chat-history:
    name: Integrate PWA chat history and verify TypeScript (NO APK)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout complete Connect Native history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Lock to current main and verify standalone source
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B main origin/main
          test -s native/src/App.tsx
          test -s native/src/ConnectNativeChat.tsx
          test -s native/package-lock.json
          test ! -e app

      - name: Apply PWA conversation history and navigation changes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_CONNECT_PHASE4'
          #!/usr/bin/env python3
          """Atomic source-only phase 4: history and message navigation; no APK."""
          import subprocess
          from pathlib import Path

          APP=Path('native/src/App.tsx')
          CHAT=Path('native/src/ConnectNativeChat.tsx')
          MARK_APP='CONNECT_NATIVE_PWA_PHASE4_HISTORY'
          MARK_CHAT='CONNECT_NATIVE_PWA_PHASE4_CHAT'

          def blob(path):
              return subprocess.check_output(['git','hash-object',str(path)],text=True).strip()

          def patch(label,source,old,new):
              count=source.count(old)
              if count != 1:
                  raise SystemExit(f'Aborting: {label} matched {count} times (expected exactly 1)')
              return source.replace(old,new,1)

          app=APP.read_text(encoding='utf-8')
          chat=CHAT.read_text(encoding='utf-8')
          if MARK_APP in app and MARK_CHAT in chat:
              print('Phase 4 already committed; no changes necessary.')
              raise SystemExit(0)
          if MARK_APP in app or MARK_CHAT in chat:
              raise SystemExit('Partial phase 4 detected; refusing to overwrite files.')
          EXPECTED_APP='fef4820bcb86701aa0ae4111c02f10ad1b4f892c'
          EXPECTED_CHAT='d8e6929ee4d59b7eac343bfe40210b8e151b0dad'
          if blob(APP)!=EXPECTED_APP or blob(CHAT)!=EXPECTED_CHAT:
              raise SystemExit('Connect Native changed since phase 3; inspect before updating (no files modified).')

          # Application: local-only conversation clear, matching PWA's per-user local storage.
          app=patch('app SecureStore import',app,
              "import ConnectNativeGlass,{glassColor} from './ConnectNativeGlass';",
              "import ConnectNativeGlass,{glassColor} from './ConnectNativeGlass';\nimport * as SecureStore from 'expo-secure-store';")
          app=patch('app clear state',app,
              "  const [conversations,setConversations]=useState<Conversation[]>([]);",
              "  const [conversations,setConversations]=useState<Conversation[]>([]);\n"
              "  // CONNECT_NATIVE_PWA_PHASE4_HISTORY: local clear state belongs to the signed-in user.\n"
              "  const [clearedChats,setClearedChats]=useState<Record<string,string>>({});\n"
              "  const [clearedReady,setClearedReady]=useState(false);")
          app=patch('app restore state',app,
              "  const ownId=session?.user.id||'';",
              """  const ownId=session?.user.id||'';
            useEffect(()=>{
              let alive=true;
              setClearedChats({});setClearedReady(false);
              if(!ownId){setClearedReady(true);return()=>{alive=false;};}
              void SecureStore.getItemAsync('connect-native-cleared-chats:'+ownId).then(raw=>{
                if(!alive||!raw)return;
                const parsed:unknown=JSON.parse(raw);
                if(!parsed||typeof parsed!=='object'||Array.isArray(parsed))return;
                const restored:Record<string,string>={};
                for(const [key,value] of Object.entries(parsed)){
                  if(/^[0-9a-f-]{36}$/i.test(key)&&typeof value==='string'&&Number.isFinite(Date.parse(value)))restored[key]=value;
                }
                setClearedChats(restored);
              }).catch(()=>{}).finally(()=>{if(alive)setClearedReady(true)});
              return()=>{alive=false;};
            },[ownId]);""")
          app=patch('app derived list',app,
              "  const unreadTotal=useMemo(()=>chats.reduce((sum,item)=>sum+(inbox[item.conversation.id]?.unread||0),0),[chats,inbox]);",
              """  const displayChats=useMemo(()=>clearedReady?orderedChats.filter(item=>{
              const cleared=clearedChats[item.conversation.id];
              const newest=inbox[item.conversation.id]?.last;
              return !cleared || Boolean(newest && newest.created_at>cleared);
            }):[],[clearedReady,orderedChats,clearedChats,inbox]);
            const unreadTotal=useMemo(()=>displayChats.reduce((sum,item)=>sum+(inbox[item.conversation.id]?.unread||0),0),[displayChats,inbox]);""")
          app=patch('app action to clear',app,
              "  async function logout(){await disableNativePush();await db.auth.signOut();setScreen({kind:'tab'});setTab('chats');}",
              """  async function clearConversation(id:string){
              if(!ownId)return;
              const next={...clearedChats,[id]:new Date().toISOString()};
              try{
                await SecureStore.setItemAsync('connect-native-cleared-chats:'+ownId,JSON.stringify(next));
                setClearedChats(next);setScreen({kind:'tab'});setTab('chats');
                setNotice('Переписка скрыта только на этом устройстве');
              }catch(e){setNotice('Не удалось очистить переписку: '+(e instanceof Error?e.message:String(e)));}
            }
            function confirmClearConversation(id:string,person:string){
              Alert.alert('Удалить переписку?',`Переписка с ${person} будет скрыта только на этом устройстве. У собеседника сообщения останутся.`,[
                {text:'Отмена',style:'cancel'},
                {text:'Удалить',style:'destructive',onPress:()=>void clearConversation(id)},
              ]);
            }
            async function logout(){await disableNativePush();await db.auth.signOut();setClearedChats({});setScreen({kind:'tab'});setTab('chats');}""")
          app=patch('app chat props',app,
              "      wallpaperUri={appearance.prefs.wallpaper} enabledPacks={appearance.prefs.enabledPacks}",
              """      wallpaperUri={appearance.prefs.wallpaper} enabledPacks={appearance.prefs.enabledPacks}
                clearedAt={clearedChats[screen.conversation.id]||null}
                onClearChat={()=>confirmClearConversation(screen.conversation.id,screen.peer.display_name)}""")
          app=patch('app list uses visible chats',app,
              "    return <FlatList data={orderedChats.filter(item=>{",
              "    return <FlatList data={displayChats.filter(item=>{")
          app=patch('app list count',app,
              "{orderedChats.length}</Text>",
              "{displayChats.length}</Text>")
          app=patch('app pending list message',app,
              "      ListEmptyComponent={<Text style={s.subtitle}>Нет подходящих переписок.</Text>}",
              "      ListEmptyComponent={<Text style={s.subtitle}>{clearedReady?'Нет подходящих переписок.':'Загружаем чаты…'}</Text>}")
          app=patch('app list long press',app,
              "          style={[s.entry,{minHeight:78,paddingVertical:12}]} onPress={()=>{setSearch('');setScreen({kind:'chat',conversation:item.conversation,peer:item.peer});}}>",
              """          style={[s.entry,{minHeight:78,paddingVertical:12}]}
                    onLongPress={()=>confirmClearConversation(item.conversation.id,item.peer.display_name)}
                    onPress={()=>{setSearch('');setScreen({kind:'chat',conversation:item.conversation,peer:item.peer});}}>""")

          # Conversation: PWA-style header menu, date separators, full quotes, swipe-to-reply,
          # scroll-to-latest without jumping the reader during history updates.
          chat=patch('chat dates',chat,
              "const time=(value:string)=>new Date(value).toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'});",
              """const time=(value:string)=>new Date(value).toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'});
          // CONNECT_NATIVE_PWA_PHASE4_CHAT
          const dayKey=(value:string)=>new Date(value).toDateString();
          const dayLabel=(value:string)=>{
            const day=new Date(value),today=new Date(),yesterday=new Date();
            yesterday.setDate(today.getDate()-1);
            if(day.toDateString()===today.toDateString())return 'Сегодня';
            if(day.toDateString()===yesterday.toDateString())return 'Вчера';
            return day.toLocaleDateString('ru-RU',{day:'numeric',month:'long',year:'numeric'});
          };""")
          chat=patch('chat prop signature',chat,
              "export default function ConnectNativeChat({conversation,peer,ownerId,profiles,avatarUrl,colors,onBack,onOpenProfile,onCall,wallpaperUri,enabledPacks}:{",
              "export default function ConnectNativeChat({conversation,peer,ownerId,profiles,avatarUrl,colors,onBack,onOpenProfile,onCall,wallpaperUri,enabledPacks,clearedAt,onClearChat}:{")
          chat=patch('chat prop types',chat,
              "  conversation:Conversation;peer:Profile;ownerId:string;profiles:Profile[];avatarUrl?:string;colors:Palette;onBack:()=>void;onOpenProfile:()=>void;onCall:()=>void;wallpaperUri?:string|null;enabledPacks?:string[];",
              "  conversation:Conversation;peer:Profile;ownerId:string;profiles:Profile[];avatarUrl?:string;colors:Palette;onBack:()=>void;onOpenProfile:()=>void;onCall:()=>void;wallpaperUri?:string|null;enabledPacks?:string[];clearedAt?:string|null;onClearChat:()=>void;")
          chat=patch('chat navigation state',chat,
              "  const [searchOpen,setSearchOpen]=useState(false);",
              """  const [searchOpen,setSearchOpen]=useState(false);
            const [toolsOpen,setToolsOpen]=useState(false);
            const [showJump,setShowJump]=useState(false);
            const nearBottom=useRef(true);
            const swipeStart=useRef<{id:string;x:number;y:number}|null>(null);""")
          chat=patch('chat cleared view',chat,
              "  const visible=useMemo(()=>messages.filter(m=>!hidden.includes(m.id)),[messages,hidden]);",
              "  const visible=useMemo(()=>messages.filter(m=>!hidden.includes(m.id) && (!clearedAt || m.created_at>clearedAt)),[messages,hidden,clearedAt]);")
          chat=patch('chat selected visible',chat,
              "  const selectedMessages=messages.filter(x=>selected.includes(x.id));",
              "  const selectedMessages=visible.filter(x=>selected.includes(x.id));")
          chat=patch('chat top menu trigger',chat,
              '      <Btn name="ellipsis-vertical" label="Действия в чате" colors={colors} onPress={()=>setSearchOpen(!searchOpen)}/>',
              '      <Btn name="ellipsis-vertical" label="Действия в чате" colors={colors} onPress={()=>setToolsOpen(true)}/>')
          chat=patch('chat top menu UI',chat,
              '    {searchOpen&&<View style={{flexDirection:',
              """    <Modal visible={toolsOpen} transparent animationType="fade" onRequestClose={()=>setToolsOpen(false)}>
                <View style={{flex:1,justifyContent:'center',backgroundColor:'#020914bb'}}>
                  <Pressable style={{position:'absolute',top:0,bottom:0,left:0,right:0}} onPress={()=>setToolsOpen(false)}/>
                  <View style={{margin:22,borderRadius:18,padding:9,backgroundColor:colors.surface,borderWidth:1,borderColor:colors.line}}>
                    <LabelButton title="Найти в чате" colors={colors} onPress={()=>{setToolsOpen(false);setSearchOpen(true);}}/>
                    <LabelButton title="Выбрать сообщения" colors={colors} onPress={()=>{setToolsOpen(false);setSelectionMode(true);}}/>
                    <LabelButton title="Удалить переписку" colors={colors} danger onPress={()=>{setToolsOpen(false);onClearChat();}}/>
                    <LabelButton title="Закрыть" colors={colors} onPress={()=>setToolsOpen(false)}/>
                  </View>
                </View>
              </Modal>
              {searchOpen&&<View style={{flexDirection:""")
          chat=patch('chat list scrolling',chat,
              "      contentContainerStyle={{padding:14,gap:7,paddingBottom:18}} onContentSizeChange={()=>listRef.current?.scrollToEnd({animated:false})}",
              """      contentContainerStyle={{padding:14,gap:7,paddingBottom:18}}
                scrollEventThrottle={120}
                onScroll={e=>{
                  const {contentOffset,contentSize,layoutMeasurement}=e.nativeEvent;
                  const bottom=contentOffset.y+layoutMeasurement.height>=contentSize.height-110;
                  nearBottom.current=bottom;
                  setShowJump(!bottom && contentSize.height>layoutMeasurement.height+130);
                }}
                onContentSizeChange={()=>{if(nearBottom.current)listRef.current?.scrollToEnd({animated:false});}}""")
          chat=patch('chat item index',chat,
              '      renderItem={({item})=>{',
              '      renderItem={({item,index})=>{')
          chat=patch('chat original quote',chat,
              "        const isSelected=selected.includes(item.id);",
              """        const isSelected=selected.includes(item.id);
                  const dayBreak=index===0||dayKey(shown[index-1].created_at)!==dayKey(item.created_at);
                  const original=item.reply_to?messages.find(row=>row.id===item.reply_to):null;
                  const quoteText=!original?'Исходное сообщение':original.deleted_at?'Сообщение удалено':
                    original.attachment_name||forwardMeta(original.body||'').text||'Вложение';""")
          chat=patch('chat message wrapper',chat,
              '        return <Pressable onLongPress={()=>action(item)} onPress={()=>{if(selectionMode)action(item);}} style={{alignSelf:',
              """        return <View>
                    {dayBreak&&<View style={{alignItems:'center',marginVertical:10}}><Text style={{fontSize:11,color:colors.muted,backgroundColor:glassColor(colors.surface,.85),paddingHorizontal:14,paddingVertical:6,borderRadius:13}}>{dayLabel(item.created_at)}</Text></View>}
                    <Pressable onLongPress={()=>action(item)} onPress={()=>{if(selectionMode)action(item);}}
                    onTouchStart={e=>{const t=e.nativeEvent.touches[0];if(t)swipeStart.current={id:item.id,x:t.pageX,y:t.pageY};}}
                    onTouchEnd={e=>{const start=swipeStart.current;swipeStart.current=null;if(!start||start.id!==item.id||selectionMode)return;
                      const t=e.nativeEvent.changedTouches[0];if(!t)return;
                      const dx=t.pageX-start.x,dy=t.pageY-start.y;
                      if(dx>75&&Math.abs(dx)>Math.abs(dy)*1.5){setReply(item);setEdit(null);setActionMessage(null);}
                    }}
                    onTouchCancel={()=>{swipeStart.current=null;}}
                    style={{alignSelf:""")
          chat=patch('chat quote UI',chat,
              '            {item.reply_to&&<Text style={{fontSize:10,color:colors.accent,marginBottom:4}}>↩ Ответ на сообщение</Text>}',
              """            {item.reply_to&&<View style={{borderLeftWidth:3,borderLeftColor:colors.accent,paddingLeft:8,marginBottom:6}}>
                        <Text style={{fontSize:11,color:colors.accent,fontWeight:'700'}}>{original?.sender_id===ownerId?'Вы':peer.display_name}</Text>
                        <Text numberOfLines={2} style={{fontSize:12,color:colors.muted}}>{quoteText}</Text>
                      </View>}""")
          chat=patch('chat close message wrapper',chat,
              "        </Pressable>;\n      }}/>\n    {peerRecording&&",
              """          </Pressable>
                  </View>;
                }}/>
              {showJump&&<Pressable accessibilityRole="button" accessibilityLabel="К последнему сообщению"
                onPress={()=>{nearBottom.current=true;listRef.current?.scrollToEnd({animated:true});setShowJump(false);}}
                style={{alignSelf:'flex-end',flexDirection:'row',alignItems:'center',gap:6,marginRight:18,marginBottom:5,paddingHorizontal:13,paddingVertical:8,borderRadius:18,backgroundColor:glassColor(colors.surface,.92),borderWidth:1,borderColor:colors.line}}>
                <Ionicons name="arrow-down" size={18} color={colors.accent}/><Text style={{fontSize:12,color:colors.text}}>Вниз</Text>
              </Pressable>}
              {peerRecording&&""")

          # Validate every replacement before writing either source file.
          APP.write_text(app,encoding='utf-8')
          CHAT.write_text(chat,encoding='utf-8')
          print('Phase 4 ready: local chat clearing, contextual chat menu, date groups, quoted replies, swipe reply, scroll jump.')
          print('Only two TypeScript files modified; no Android, Gradle, or APK tasks.')
          PY_CONNECT_PHASE4
          git diff --check

      - name: Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: native/package-lock.json

      - name: Typecheck actual React Native source without Android build
        working-directory: native
        shell: bash
        env:
          CI: '1'
          EXPO_NO_TELEMETRY: '1'
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm run typecheck

      - name: Commit validated sources only
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git add -- native/src/App.tsx native/src/ConnectNativeChat.tsx
          if git diff --cached --quiet; then
            echo 'Chat history parity already saved; nothing to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(native): PWA chat clearing, navigation and reply gestures'
          git push origin HEAD:main

      - name: Phase 4 summary (NO APK)
        if: success()
        shell: bash
        run: |
          {
            echo '### Connect Native phase 4: chat history and navigation'
            echo '- PWA-style local conversation clearing; peer messages unaffected.'
            echo '- Chat actions menu with search, select and delete conversation.'
            echo '- Date separators, full quoted reply previews and swipe to reply.'
            echo '- Reader scroll position is preserved, with jump-to-bottom control.'
            echo '- TypeScript validated. Source-only workflow; **NO Gradle or APK**.'
          } >> "$GITHUB_STEP_SUMMARY"
