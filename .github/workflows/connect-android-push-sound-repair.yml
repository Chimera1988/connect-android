# Applied only to Connect Android native source. No APK is generated.
name: Connect Android - push, sound preview and visual fixes (NO APK)

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/connect-android-push-sound-repair.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: connect-android-push-sound-repair
  cancel-in-progress: false

jobs:
  patch-and-check:
    runs-on: ubuntu-latest
    timeout-minutes: 115
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
      GRADLE_OPTS: '-Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx3g'
    steps:
      - name: Checkout latest Connect Android
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Synchronize latest main and check scope
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B main origin/main
          test -s native/src/ConnectNativePush.ts
          test -s native/plugins/withConnectSounds.js
          test -s native/google-services.json
          test -s native/src/ConnectNativeSettings.tsx

