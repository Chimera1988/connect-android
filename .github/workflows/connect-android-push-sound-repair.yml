      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: native/package-lock.json

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Check JS/TypeScript without APK
        working-directory: native
        shell: bash
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm run typecheck

      - name: Check generated Android raw sounds and Expo plugins
        working-directory: native
        shell: bash
        run: |
          set -euo pipefail
          npx expo prebuild --platform android --no-install --clean
          test -s android/app/src/main/java/com/connect/messenger/ConnectSoundModule.kt
          for tone in soft bright gentle; do
            test -s "android/app/src/main/res/raw/connect_${tone}.wav"
          done
          grep -q 'fun previewSound' android/app/src/main/java/com/connect/messenger/ConnectSoundModule.kt
          grep -q 'fun stopPreviewSound' android/app/src/main/java/com/connect/messenger/ConnectSoundModule.kt

      - name: Install Android SDK 37
        shell: bash
        run: |
          set -euo pipefail
          command -v sdkmanager
          if ! sdkmanager --channel=3 --install 'platforms;android-37.0' 'build-tools;37.0.0' 'platform-tools'; then
            sdkmanager --channel=3 --install 'platforms;android-37' 'build-tools;37.0.0' 'platform-tools'
          fi

      - name: Compile native Kotlin/Java without building APK
        shell: bash
        working-directory: native/android
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew :app:processDebugMainManifest :app:compileDebugKotlin :app:compileDebugJavaWithJavac \
            --no-daemon --stacktrace --max-workers=2 2>&1 | tee "$GITHUB_WORKSPACE/connect-push-sound-compile.log"
          if find . -type f \( -name '*.apk' -o -name '*.aab' \) -print -quit | grep -q .; then
            echo 'APK/AAB is forbidden in source patch workflow' >&2
            exit 1
          fi

      - name: Commit verified Android source changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- native/app.json native/plugins/withConnectSounds.js native/plugins/withConnectBuiltinSounds.js \
            native/assets/notification_sounds/ native/src/ConnectNativePush.ts native/src/ConnectNativeSoundSettings.tsx \
            native/src/ConnectNativeSettings.tsx native/src/App.tsx
          if ! git diff --cached --quiet; then
            git commit -m 'fix(connect): reliable FCM diagnostics, sound preview and visual controls'
            git push origin main
          else
            echo 'No native source changes needed'
          fi

      - name: Upload diagnostic compiler log if failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: connect-push-sound-compile-log
          path: connect-push-sound-compile.log
          retention-days: 10
          if-no-files-found: ignore

      - name: Summary
        if: success()
        shell: bash
        run: |
          {
            echo '### Connect Android - push/sound repair'
            echo '- Native Kotlin and TypeScript checks passed.'
            echo '- Message notification diagnostics and local self-test added.'
            echo '- Built-in message tones and previews installed; personal files can be previewed.'
            echo '- Login branding and theme preview cards improved.'
            echo '- **NO APK compiled.** Rebuild later with consistent persistent signing.'
            echo '- Android device test and PWA server high priority update required.'
          } >> "$GITHUB_STEP_SUMMARY"
