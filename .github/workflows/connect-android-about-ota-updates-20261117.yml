        python3 "$RUNNER_TEMP/ota-about-patch.py"

        git diff --check

        '
    - name: Verify refreshed dependency lock and OTA contract tests
      shell: bash
      run: 'set -euo pipefail

        npm ci --no-audit --no-fund

        node scripts/check-parity-source.mjs

        node --test tests/connect-ota-about-20261117.test.cjs tests/connect-ota-config-20261117.test.cjs tests/source-lock.test.cjs

        node scripts/verify-builtin-sounds.cjs

        node scripts/generate-call-policy.cjs --check

        '
      working-directory: native
    - name: Build embedded WebView and check TypeScript, all regression and browser tests
      shell: bash
      run: 'set -euo pipefail

        npm run build:web

        test -s src/generated/pwa.ts

        npm run typecheck:web

        npm run typecheck

        npm test

        npx --no-install playwright-core install --with-deps chromium

        export CHROMIUM_PATH="$(node -p "require(''playwright-core'').chromium.executablePath()")"

        test -x "$CHROMIUM_PATH"

        npm run test:browser

        node scripts/check-parity-source.mjs

        '
      working-directory: native
    - name: Export real Android Hermes bundle and validate exact installed runtime
      shell: bash
      run: 'set -euo pipefail

        npx --no-install expo export --platform android --output-dir "$RUNNER_TEMP/connect-ota-about-export"

        python3 - <<''PY''

        import os,json

        from pathlib import Path

        folder=Path(os.environ[''RUNNER_TEMP''])/''connect-ota-about-export''

        assert (folder/''metadata.json'').is_file(),''Expo OTA metadata missing''

        assert any(p.stat().st_size>100000 for p in list(folder.rglob(''*.hbc''))+list(folder.rglob(''*.js''))),''Android
        Hermes/JS bundle missing''

        app=json.loads(Path(''app.json'').read_text())[''expo'']

        assert app[''runtimeVersion'']==''connect-android-ota-v1-sdk58''

        assert app[''android''][''versionCode'']==25 and app[''version'']==''3.0.7''

        assert app[''updates''][''requestHeaders''][''expo-channel-name'']==''production''

        assert Path(''src/generated/pwa.ts'').stat().st_size>100000

        print(''OTA_EXPORT_VERIFIED: compatible Android JS + built-in WebView only; no new APK'')

        PY

        '
      working-directory: native
    - name: Commit only verified OTA sources to Android main
      shell: bash
      run: "set -euo pipefail\n(cd native && node scripts/check-parity-source.mjs)\ngit add -- native/src/App.tsx\
        \ native/src/hybridProtocol.ts native/web/app/page.tsx native/web/hybrid/android.css native/web/components/ConnectOtaSettings.tsx\
        \ native/tests/connect-ota-about-20261117.test.cjs native/package.json native/package-lock.json native/PARITY_SOURCE_LOCK.json\n\
        git diff --cached --check\nif git diff --cached --quiet; then\n  echo 'OTA source was already committed;\
        \ safe to retry publication'\nelse\n  test \"$(git ls-remote origin refs/heads/main | cut -f1)\" = \"$(git\
        \ rev-parse HEAD)\" || { echo '::error::Main moved during validation; refusing unsafe push';exit 1; }\n\
        \  git -c user.name='Connect CI' -c user.email='actions@users.noreply.github.com' commit -m 'Android: native\
        \ About version and safe OTA update controls'\n  git push origin HEAD:main\nfi\n"
    - name: Publish first compatible About-screen OTA via Expo production
      shell: bash
      run: "set -euo pipefail\nif [[ -z \"${EXPO_TOKEN:-}\" ]]; then\n  echo '::warning::EXPO_TOKEN is missing.\
        \ Verified source is committed but OTA has NOT been published.'\n  echo 'CONNECT_OTA_PUBLISHED=no_token'\
        \ >> \"$GITHUB_ENV\"\n  exit 0\nfi\n# Publish exactly the previously tested Expo Android artifact; never\
        \ rebuild with a different environment.\nnpx --yes eas-cli@27.6.0 update --channel production --platform\
        \ android --environment production --input-dir \"$RUNNER_TEMP/connect-ota-about-export\" --skip-bundler\
        \ --message 'Connect Android 3.0.7: About version and safe OTA controls' --non-interactive\necho 'CONNECT_OTA_PUBLISHED=yes'\
        \ >> \"$GITHUB_ENV\"\n"
      working-directory: native
      if: ${{ inputs.publish_ota }}
      env:
        EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    - name: Report source/deployment status without false claims
      shell: bash
      run: "set -euo pipefail\n{\n  echo '## Connect Android 3.0.7 — About and OTA'\n  echo '- Installed APK, signing\
        \ certificate, native runtime: unchanged.'\n  if [[ \"${CONNECT_OTA_PUBLISHED:-}\" == yes ]]; then\n   \
        \ echo '- Expo OTA: PUBLISHED to production. Restart Connect to receive the update.'\n  elif [[ \"${CONNECT_OTA_PUBLISHED:-}\"\
        \ == no_token ]]; then\n    echo '- Expo OTA: NOT PUBLISHED. Add GitHub secret EXPO_TOKEN and rerun this\
        \ workflow.'\n  else\n    echo '- Expo OTA: NOT CONFIRMED (check publish step or publish_ota input).'\n\
        \  fi\n} >> \"$GITHUB_STEP_SUMMARY\"\n"
      if: always()
