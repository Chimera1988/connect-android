name: Connect Android | About version and OTA updates 2026-11-17
'on':
  workflow_dispatch:
    inputs:
      publish_ota:
        description: Publish tested Android-only OTA to Expo production (needs EXPO_TOKEN)
        type: boolean
        default: true
permissions:
  contents: write
concurrency:
  group: connect-android-about-ota
  cancel-in-progress: false
jobs:
  update:
    name: Check native About screen and publish compatible Android OTA
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
      EXPO_PUBLIC_SUPABASE_URL: https://tpwkmoxxzjfdsqsomhhr.supabase.co
      NEXT_PUBLIC_SUPABASE_URL: https://tpwkmoxxzjfdsqsomhhr.supabase.co
      EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_tAg8rPwuBNcA2iPF7voc2Q_vsKUpyZa
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_tAg8rPwuBNcA2iPF7voc2Q_vsKUpyZa
      EXPO_PUBLIC_CONNECT_URL: https://connect-chat.duckdns.org
    steps:
    - name: Checkout Connect Android main
      uses: actions/checkout@v4
      with:
        ref: main
        fetch-depth: 0
        persist-credentials: true
    - name: Guard installed version, permanent runtime, and exact Expo project
      shell: bash
      run: "set -euo pipefail\ntest \"$GITHUB_REPOSITORY\" = 'Chimera1988/connect-android'\ntest \"$GITHUB_REF\"\
        \ = 'refs/heads/main'\npython3 - <<'PY'\nimport json\nfrom pathlib import Path\nr=Path('native')\nfor f\
        \ in ['app.json','PARITY_SOURCE_LOCK.json','package-lock.json','src/App.tsx','web/app/page.tsx','src/hybridProtocol.ts']:\n\
        \ assert (r/f).is_file(),f'Missing source: {f}'\na=json.loads((r/'app.json').read_text())['expo']\nassert\
        \ a['android']['package']=='com.connect.messenger' and a['android']['versionCode']==25 and a['version']=='3.0.7'\n\
        assert a['runtimeVersion']=='connect-android-ota-v1-sdk58'\nassert a['extra']['eas']['projectId']=='430c7f08-3921-48d5-96d1-f7c3d686d3bf'\n\
        assert a['updates']['url']=='https://u.expo.dev/430c7f08-3921-48d5-96d1-f7c3d686d3bf'\nassert a['updates']['requestHeaders']['expo-channel-name']=='production'\
        \ and a['updates']['enabled']\nprint('Installed Android 3.0.7 (25) and Expo production runtime unchanged')\n\
        PY\n"
    - name: Install Node.js 24
      uses: actions/setup-node@v4
      with:
        node-version: '24'
        cache: npm
        cache-dependency-path: native/package-lock.json
    - name: Verify existing locked Android sources
      shell: bash
      run: 'set -euo pipefail

        npm ci --no-audit --no-fund

        node scripts/check-parity-source.mjs

        '
      working-directory: native
