# PWA parity phase 10B. Protected corrective workflow: NEVER builds an APK.
name: Connect Native - Phase 10B (password setup, JSON export, invite share; NO APK)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/connect-native-pwa-parity-phase10b.yml

permissions:
  contents: write

concurrency:
  group: connect-native-phase10b
  cancel-in-progress: false

jobs:
  parity-fixes:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout latest native project
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Fail closed if legacy APK build has reappeared
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B main origin/main
          python3 - <<'PY_GUARD'
          from pathlib import Path
          import re
          file=Path('.github/workflows/android-apk.yml')
          if not file.is_file():raise SystemExit('STOP: APK workflow status unknown')
          source=file.read_text()
          if re.search(r'^\s{2}push\s*:',source,re.M) or re.search(r'\bassemble(?:Debug|Release)\b',source):
              raise SystemExit('STOP: old APK build is enabled')
          for name in ['native/src/App.tsx','native/src/ConnectNativeInvites.tsx','native/src/ConnectNativeSettings.tsx','native/package-lock.json']:
              if not Path(name).is_file():raise SystemExit('STOP: missing required file '+name)
          PY_GUARD

