      - name: Prepare Node for Expo SDK 58
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: native/package-lock.json

      - name: Add Expo SDK-compatible sharing and validate TypeScript
        shell: bash
        working-directory: native
        env:
          CI: '1'
          EXPO_NO_TELEMETRY: '1'
        run: |
          set -euo pipefail
          npm install --package-lock-only --save-exact expo-sharing@58.0.22 --no-audit --no-fund
          npm ci --no-audit --no-fund
          npm run typecheck

      - name: Commit source changes only if validation succeeds
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git add -- native/src/App.tsx native/src/ConnectNativePasswordSetup.tsx native/src/ConnectNativeInvites.tsx native/src/ConnectNativeSettings.tsx native/package.json native/package-lock.json
          if git diff --cached --quiet; then
            echo 'Phase 10B already applied.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(native): password setup callbacks, export JSON share and invitation sharing'
          git push origin HEAD:main

      - name: Report limitations (NOT a release approval)
        if: success()
        shell: bash
        run: |
          {
            echo '### Connect Native - phase 10B applied (NO APK)'
            echo '- Password setup accepts verified connect:// recovery/invite callbacks and Supabase password recovery auth events.'
            echo '- HTTPS web-to-app links require server-side Android App Links/redirect settings and a real-device test.'
            echo '- JSON export is a local file shared via Android chooser; no automatic upload.'
            echo '- Invitation codes can be shared via the Android native share menu.'
            echo '- TypeScript checked. No APK build. Device and end-to-end acceptance still pending.'
            echo '- Re-run the 199-point audit after completing residual corrections.'
          } >> "$GITHUB_STEP_SUMMARY"
