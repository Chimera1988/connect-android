name: Connect Native — PWA chat appearance (no APK)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/connect-native-chat-pwa-polish.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: connect-native-chat-pwa-polish-${{ github.ref }}
  cancel-in-progress: false
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout Connect Android
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Apply targeted appearance changes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_POLISH'
          from pathlib import Path
          
          media_path=Path('native/src/ConnectNativeMedia.tsx')
          chat_path=Path('native/src/ConnectNativeChat.tsx')
          for path in (media_path,chat_path):
              if not path.is_file():
                  raise SystemExit(f'Missing native file: {path}')
          media=media_path.read_text(encoding='utf-8')
          chat=chat_path.read_text(encoding='utf-8')
          
          def replace_once(source, old, new, what):
              if old == new:
                  return source
              if source.count(old) == 1:
                  return source.replace(old,new,1)
              if new in source and old not in source:
                  print('Already applied:',what)
                  return source
              raise SystemExit(f'Unexpected source structure for {what}; no changes committed')
          
          video_before = r"if(k==='video'&&/^connect-video-note-\d+\.(?:mp4|webm)$/i.test(name))return <View><VideoNoteBubble uri={url} colors={colors} active={videoAutoPlay}/><SaveAttachment url={url} name={name} mime={message.attachment_type||'video/mp4'} colors={colors}/></View>;"
          video_after = r"if(k==='video'&&/^connect-video-note-\d+\.(?:mp4|webm)$/i.test(name))return <View><VideoNoteBubble uri={url} colors={colors} active={videoAutoPlay}/></View>;"
          media=replace_once(media,video_before,video_after,'video note save/share button')
          
          voice_before="if(k==='audio'||(message.attachment_type||'').startsWith('audio/'))return <View style={{maxWidth:255}}><Text numberOfLines={1} style={{color:colors.text}}>{name}</Text><AudioClip uri={url} colors={colors}/><SaveAttachment url={url} name={name} mime={message.attachment_type||'audio/mpeg'} colors={colors}/></View>;"
          voice_after="if(k==='audio'||(message.attachment_type||'').startsWith('audio/'))return <View style={{maxWidth:280}}><AudioClip uri={url} colors={colors}/></View>;"
          media=replace_once(media,voice_before,voice_after,'voice note save/share button and filename')
          
          # The actual PWA voice note sits in a compact translucent bubble.
          voice_wrapper_before="return <View style={{width:260,maxWidth:'100%',gap:4}}>"
          voice_wrapper_after="return <View style={{width:260,maxWidth:'100%',gap:6,paddingHorizontal:10,paddingVertical:8,borderRadius:20,backgroundColor:glassColor(colors.surface,.77),borderWidth:1,borderColor:glassColor(colors.text,.12)}}>"
          media=replace_once(media,voice_wrapper_before,voice_wrapper_after,'voice note bubble appearance')
          if 'import {glassColor} from \'./ConnectNativeGlass\';' not in media:
              anchor="import {getAudioWaveform} from './nativeWaveform';"
              media=replace_once(media,anchor,anchor+"\nimport {glassColor} from './ConnectNativeGlass';",'glass color import')
          
          # Preserve existing chat interactions and renderer, change only bubble skin.
          bubble_before="borderWidth:isSelected||activeSearchId===item.id?2:standalone?0:1,borderColor:isSelected||activeSearchId===item.id?colors.accent:own?glassColor(colors.accent,.32):glassColor(colors.text,.15),backgroundColor:standalone?'transparent':own?glassColor(colors.elevated,.84):glassColor(colors.surface,.82)}}>"
          bubble_after="borderWidth:isSelected||activeSearchId===item.id?2:standalone?0:1,borderColor:isSelected||activeSearchId===item.id?colors.accent:own?glassColor(colors.accent,.20):glassColor(colors.text,.12),backgroundColor:standalone?'transparent':own?glassColor(colors.elevated,.73):glassColor(colors.surface,.74)}}>"
          chat=replace_once(chat,bubble_before,bubble_after,'message bubble colors')
          
          # Precisely bounded composer section: don't touch chat header or controls in other screens.
          start_marker="<ConnectNativeGlassPanel colors={colors} style={{flexDirection:'row',alignItems:'center',padding:7,marginHorizontal:8,marginBottom:8,"
          end_marker='</ConnectNativeGlassPanel>'
          if chat.count(start_marker)==1:
              start=chat.index(start_marker)
              end=chat.index(end_marker,start)+len(end_marker)
              previous=chat[start:end]
              for sentinel in ('showAttachmentMenu','setVideoNoteOpen(true)','toggleRecord()','stickerPickerOpen','submit()'):
                  if sentinel not in previous:
                      raise SystemExit('Composer signature is incomplete: '+sentinel)
              replacement="""<ConnectNativeGlassPanel colors={colors} style={{flexDirection:'row',alignItems:'center',paddingHorizontal:6,paddingVertical:6,marginHorizontal:8,marginBottom:8,borderWidth:1,borderColor:glassColor(colors.text,.16),backgroundColor:glassColor(colors.surface,.83),borderRadius:25,gap:1,minHeight:58}}>
                <Btn name="happy-outline" colors={colors} label="Стикеры и эмодзи" disabled={peer.is_blocked||uploading||recorderState.isRecording}
                  onPress={()=>{Keyboard.dismiss();setStickerPickerOpen(open=>!open);}}/>
                <Btn name="add-outline" colors={colors} label="Прикрепить" onPress={showAttachmentMenu} disabled={peer.is_blocked||uploading||busy||recorderState.isRecording||!!edit}/>
                <TextInput multiline maxLength={10000} placeholder={uploading?'Отправка файла…':'Сообщение…'} placeholderTextColor={mutedColor}
                  value={draft} onChangeText={setDraft} editable={!peer.is_blocked} style={{backgroundColor:glassColor(colors.bg,.28),color:textColor,borderRadius:21,paddingHorizontal:11,paddingVertical:10,fontSize:15,maxHeight:110,minWidth:0,flex:1}}/>
                <Btn name="camera-outline" colors={colors} label="Записать видеокружок" onPress={()=>setVideoNoteOpen(true)} disabled={peer.is_blocked||uploading||busy||recorderState.isRecording||!!edit}/>
                {!recorderState.isRecording&&Boolean(draft.trim())?<Btn name="send" colors={colors} label="Отправить" disabled={peer.is_blocked||busy||uploading} onPress={()=>void submit()}/>
                  :<Btn name={recorderState.isRecording?'stop-circle':'mic-outline'} colors={colors}
                  label={recorderState.isRecording?'Остановить и отправить запись':'Записать голосовое'} disabled={peer.is_blocked||busy||uploading||!!edit} onPress={()=>void toggleRecord()}/>}
              </ConnectNativeGlassPanel>"""
              chat=chat[:start]+replacement+chat[end:]
          elif 'label="Прикрепить" onPress={showAttachmentMenu}' in chat and 'paddingHorizontal:6,paddingVertical:6,marginHorizontal:8' in chat:
              print('Composer patch already applied')
          else:
              raise SystemExit('Unexpected composer start marker; no changes saved')
          
          media_path.write_text(media,encoding='utf-8')
          chat_path.write_text(chat,encoding='utf-8')
          print('PWA chat polish patches installed (no APK)')
          PY_POLISH
      - name: Verify patch and run TypeScript
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          cd native
          npm ci --no-audit --no-fund
          npm run typecheck
          npm test
      - name: Commit updated Android source files
        shell: bash
        run: |
          set -euo pipefail
          git add native/src/ConnectNativeMedia.tsx native/src/ConnectNativeChat.tsx
          if git diff --cached --quiet; then
            echo 'Already installed; no changes to commit'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(android): align voice notes, video circles and composer with PWA'
          git push
