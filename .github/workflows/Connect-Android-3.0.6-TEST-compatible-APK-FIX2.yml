name: Connect Android 3.0.6 | Compatible TEST APK FIX2

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: connect-android-306-compatible-test-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-test-apk:
    if: github.repository == 'Chimera1988/connect-android' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
      EXPO_PUBLIC_SUPABASE_URL: https://tpwkmoxxzjfdsqsomhhr.supabase.co
      EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_tAg8rPwuBNcA2iPF7voc2Q_vsKUpyZa
      EXPO_PUBLIC_CONNECT_URL: https://connect-chat.duckdns.org

    steps:
      - name: Checkout the already verified Android 3.0.6 sources
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Guard version and audited source snapshot
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$(git rev-parse HEAD)" || {
            echo '::error::SOURCE_DRIFT: Android main changed since this workflow started'; exit 1;
          }
          test -s native/PARITY_SOURCE_LOCK.json
          test -s native/scripts/check-parity-source.mjs
          (
            cd native
            node scripts/check-parity-source.mjs
          )
          python3 - <<'PY'
          import json
          from pathlib import Path
          config = json.loads(Path('native/app.json').read_text(encoding='utf8'))['expo']
          assert config['version'] == '3.0.6'
          assert config['android']['versionCode'] == 24
          assert config['android']['package'] == 'com.connect.messenger'
          plugins = config['plugins']
          minimum = [p[1]['android']['minSdkVersion'] for p in plugins
                     if isinstance(p,list) and p[0]=='expo-build-properties']
          assert minimum == [29], minimum
          assert './plugins/withConnectRelease' in plugins
          print('Connect 3.0.6 (24), Android 10+, source lock verified')
          PY
          expected=$(python3 -c "import json;print(json.load(open('native/PARITY_SOURCE_LOCK.json'))['pwaSha'])")
          actual=$(git ls-remote https://github.com/Chimera1988/connect-messenger.git refs/heads/main | cut -f1)
          test "$actual" = "$expected" || {
            echo '::error::SOURCE_DRIFT: PWA main changed; review before building'; exit 1;
          }

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: native/package-lock.json

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Run web native and browser tests
        working-directory: native
        shell: bash
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          node scripts/verify-builtin-sounds.cjs
          node scripts/generate-call-policy.cjs --check
          npm run build:web
          npm run typecheck:web
          npm run typecheck
          npx --no-install playwright-core install --with-deps chromium
          CHROMIUM_PATH=$(node -p "require('playwright-core').chromium.executablePath()")
          export CHROMIUM_PATH
          test -x "$CHROMIUM_PATH"
          python3 -m unittest discover -s scripts -p test_release_signing.py
          npm test
          npm run test:browser
          node scripts/check-parity-source.mjs
          git diff --check

      - name: Expo Prebuild and install pinned Android tooling
        working-directory: native
        shell: bash
        run: |
          set -euo pipefail
          npx --no-install expo prebuild --platform android --no-install --clean
          mkdir -p verification/parity
          node scripts/check-parity-source.mjs --tools > verification/parity/android-tools.json
          readarray -t sdk < <(node -e "const t=require('./verification/parity/android-tools.json');if(!t.sdkPlatform)throw Error('SDK platform missing');console.log(t.sdkPlatform);console.log(t.buildTools);console.log(t.ndk)")
          test "${#sdk[@]}" -eq 3
          test "${sdk[0]}" = 'platforms;android-37.0' || { echo '::error::SOURCE_DRIFT: reviewed SDK platform differs'; exit 1; }
          sdkmanager --channel=3 "${sdk[0]}" "build-tools;${sdk[1]}" "ndk;${sdk[2]}" 'cmake;3.22.1' 'platform-tools'

      - name: Compile test and lint before APK
        working-directory: native/android
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :app:compileReleaseKotlin :app:compileReleaseJavaWithJavac :app:testReleaseUnitTest :app:lintRelease --no-daemon --max-workers=2

      - name: Build APK using the pre-existing Expo signing fallback
        working-directory: native/android
        shell: bash
        run: |
          set -euo pipefail
          # This is intentionally NOT a production signing flow.
          # withConnectRelease falls back to the Expo template key when no release key is supplied.
          test -z "${CONNECT_RELEASE_KEYSTORE_FILE:-}"
          ./gradlew :app:assembleRelease --no-daemon --max-workers=2
          test -s app/build/outputs/apk/release/app-release.apk

      - name: Verify APK identity and exact signer before publishing
        shell: bash
        env:
          EXPECTED_PREVIOUS_SIGNER: fac61745dc0903786fb9ede62a962b399f7348f0bb6f899b8332667591033b9c
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os, re, shutil, subprocess, zipfile
          from pathlib import Path

          source = Path('native/android/app/build/outputs/apk/release/app-release.apk')
          assert source.is_file() and source.stat().st_size > 1_000_000, 'No valid APK was built'
          sdk = Path(os.environ['ANDROID_HOME']) / 'build-tools' / '37.0.0'
          badging = subprocess.check_output([str(sdk/'aapt'),'dump','badging',str(source)],text=True)
          assert "package: name='com.connect.messenger'" in badging, 'Wrong package'
          assert "versionCode='24'" in badging and "versionName='3.0.6'" in badging, 'Wrong version'
          assert "sdkVersion:'29'" in badging, 'Android 10 minimum changed'
          assert 'application-debuggable' not in badging, 'APK incorrectly marked debuggable'
          sig = subprocess.check_output([str(sdk/'apksigner'),'verify','--verbose','--print-certs',str(source)],text=True)
          m = re.search(r'(?:Signer #1|V2 Signer|V3 Signer):? certificate SHA-256 digest:\s*([0-9a-fA-F]+)',sig)
          assert m, 'APK signature not found'
          signer = m.group(1).lower()
          expected = os.environ['EXPECTED_PREVIOUS_SIGNER'].lower()
          assert signer == expected, ('INCOMPATIBLE SIGNATURE: new APK does not match the previously built '
                                     '3.0.5 debug-signed APK. Do NOT uninstall existing Connect.')
          with zipfile.ZipFile(source) as archive:
              assert archive.testzip() is None, 'Corrupted APK'
              names = archive.namelist()
              assert 'assets/index.android.bundle' in names, 'Missing embedded React Native code'
              assert len([n for n in names if n.startswith('assets/connect-web/stickers/') and n.endswith('.webp')]) == 96, 'Missing bundled WebP stickers'
              assert set(n.split('/')[1] for n in names if n.startswith('lib/') and n.endswith('.so')) == {'arm64-v8a','armeabi-v7a'}, 'Missing Android ABI'
          target = Path('release/Connect-Android-3.0.6-TEST')
          target.mkdir(parents=True,exist_ok=True)
          apk = target/'Connect-Android-3.0.6-TEST.apk'
          shutil.copyfile(source,apk)
          report = {
            'applicationId':'com.connect.messenger', 'version':'3.0.6', 'versionCode':24,
            'minSdk':29, 'apkSha256':hashlib.sha256(apk.read_bytes()).hexdigest(),
            'signerSha256':signer,'matchesPreviousBuildArtifact3_0_5':True,
            'signing':'Expo template Android DEBUG KEY (test candidate only)',
            'deviceInstalledCertificateVerified':False,
            'deviceAcceptance':'NOT TESTED: device, FCM, notification cancellation, vibration, calls'
          }
          (target/'APK-TEST-VERIFICATION.json').write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n')
          (target/'SHA256.txt').write_text(report['apkSha256']+'  '+apk.name+'\n')
          (target/'READ-ME-FIRST.txt').write_text(
            'Connect Android 3.0.6 — TEST APK ONLY. Not a production release.\n'
            'APK signer verified against the previous 3.0.5 GitHub build artifact.\n'
            'This does not prove the certificate installed on your phone is identical.\n'
            'Try installing as an UPDATE WITHOUT UNINSTALLING 3.0.5.\n'
            'If Android refuses because the signatures differ, STOP. Do not uninstall or clear app data.\n'
            'Never upload or publish this debug-signed APK as an official release.\n',encoding='utf8')
          print('TEST APK verified:',json.dumps(report,ensure_ascii=False))
          PY
          (
            cd native
            node scripts/check-parity-source.mjs
          )

      - name: Upload tested APK and verification reports
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: Connect-Android-3.0.6-TEST-update
          path: release/Connect-Android-3.0.6-TEST/*
          if-no-files-found: error
          retention-days: 30

      - name: Upload test logs when present
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Connect-Android-3.0.6-TEST-logs-${{ github.run_id }}
          path: |
            native/verification/parity/
            native/android/app/build/reports/
            native/android/app/build/test-results/
          if-no-files-found: warn
