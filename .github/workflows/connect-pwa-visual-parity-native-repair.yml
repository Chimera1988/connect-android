      - name: Track PWA visual provenance and remaining device verification
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p native/final-parity-review
          cat > native/final-parity-review/PWA_NATIVE_VISUAL.md <<'EOF'
          # Connect PWA → native Android visual source port

          PWA reference: `Chimera1988/connect-messenger` at `df71ca06e615ca5f981ae9276bd3642587f76e1a`.
          Native Android original app ID and all business logic have been preserved.

          Native layout was changed at source level, not by color overlays:
          - Replaced invented waves with the exact PWA SVG path geometry for all six animated scenes
          - Mirrored seven PWA dynamic accent palettes and theme backdrops
          - Rebuilt login layout and copy using the current PWA login form
          - Adjusted chat list, headers, bubbles, composer, and bottom navigation geometry
          - Matched three main PWA navigation tabs; native-only journal remains accessible from Contacts
          - Replaced placeholder scene thumbnails with original PWA scene geometry and labels
          - Improved settings layout and scroll reachability
          - Brought native calls list onto the common Liquid Glass palette
          - Reworked Android adaptive-icon safe area using the original approved PWA icon

          **NOT YET VERIFIED:** Pixel-identical rendering on physical devices, density/font differences,
          blur/filter fidelity, device keyboard, and all secondary screens. React Native cannot
          directly execute PWA CSS: native SVG reproduces paths but not browser Gaussian filters.
          Neither APK nor AAB is created in this workflow. User must explicitly request a fresh
          installable APK and compare with real PWA screenshots before calling the port 1:1.
          EOF
      - name: Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: native/package-lock.json
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK tools
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - name: Full native TypeScript validation; do not create APK
        working-directory: native
        shell: bash
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm run typecheck
      - name: Expo native prebuild and Kotlin Java validation; no APK
        working-directory: native
        shell: bash
        run: |
          set -euo pipefail
          npx expo prebuild --platform android --no-install --clean
          test -s android/app/src/main/java/com/connect/messenger/ConnectSoundModule.kt
          if ! sdkmanager --channel=3 --install 'platforms;android-37.0' 'build-tools;37.0.0' 'platform-tools'; then
            sdkmanager --channel=3 --install 'platforms;android-37' 'build-tools;37.0.0' 'platform-tools'
          fi
          chmod +x android/gradlew
          (cd android && ./gradlew :app:processDebugMainManifest :app:compileDebugKotlin :app:compileDebugJavaWithJavac --no-daemon --max-workers=2) 2>&1 | tee "$GITHUB_WORKSPACE/connect-pwa-visual-compile.log"
          if find android -name '*.apk' -o -name '*.aab' | grep -q .; then echo 'Forbidden APK output' >&2; exit 1; fi
      - name: Commit only passing visual source changes
        shell: bash
        run: |
          set -euo pipefail
          git status --short
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- native/src/App.tsx native/src/ConnectNativeAppearance.ts native/src/ConnectNativeGlass.tsx native/src/ConnectNativeSettings.tsx native/src/ConnectNativeChat.tsx native/src/ConnectNativeCalls.tsx native/src/theme.ts native/assets/connect-adaptive-foreground.png native/final-parity-review/PWA_NATIVE_VISUAL.md
          if ! git diff --cached --quiet; then
            git commit -m 'feat(android): native visual composition ported from actual Connect PWA'
            git push origin main
          else
            echo 'Visual native source already matches the approved patch'
          fi
      - name: Upload compilation diagnostics only on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Connect-PWA-Native-Visual-Compile-Log
          path: connect-pwa-visual-compile.log
          if-no-files-found: ignore
          retention-days: 14
      - name: Result
        if: success()
        shell: bash
        run: |
          echo '### Connect: native visual port from PWA (NO APK)' >> "$GITHUB_STEP_SUMMARY"
          echo '- Authentic PWA SVG paths, 7 theme previews and glass layout now in native source.' >> "$GITHUB_STEP_SUMMARY"
          echo '- No APK/AAB generated or uploaded. Chat/FCM/WebRTC logic untouched.' >> "$GITHUB_STEP_SUMMARY"
          echo '- Still requires actual Android screenshot comparison before claiming pixel parity.' >> "$GITHUB_STEP_SUMMARY"
