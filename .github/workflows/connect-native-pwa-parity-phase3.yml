name: Connect Native - PWA parity phase 3A (chat controls and receipts)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/connect-native-pwa-parity-phase3.yml

permissions:
  contents: write

concurrency:
  group: connect-native-parity-phase3a
  cancel-in-progress: false

jobs:
  chat-parity-source-only:
    name: Integrate chat parity and check TypeScript (NO APK)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout current native source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Verify main and apply checksum-verified source patch
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B main origin/main
          test -s native/src/ConnectNativeChat.tsx
          test -s native/src/ConnectNativeSettings.tsx
          test -s native/package-lock.json
          python3 - <<'PY_CONNECT_CHAT_PHASE3'
          import base64,gzip,hashlib,subprocess,sys
          from pathlib import Path
          assets=[
            ('apply_phase3.py', 'bb58e569360a4e0cc4fa39ae65ffa32a6c6940c07c6dc3f917b00a8132348e2e', ''),
            ('PWA_PARITY_PHASE3.md', '2a443f4fe6a79afdfc80160dcd539e2a81617f933df0097410c86feba3c5e0c4', ''),
          ]
          result={}
          for name,digest,encoded in assets:
              raw=gzip.decompress(base64.b64decode(encoded))
              if hashlib.sha256(raw).hexdigest()!=digest:
                  raise SystemExit('Source checksum mismatch: '+name)
              result[name]=raw
          path=Path('/tmp/connect-chat-phase3.py')
          path.write_bytes(result['apply_phase3.py'])
          subprocess.run([sys.executable,str(path)],check=True)
          document=Path('native/PWA_PARITY_PHASE3.md')
          document.write_bytes(result['PWA_PARITY_PHASE3.md'])
          print('Chat parity patched; verify TypeScript before commit')
          PY_CONNECT_CHAT_PHASE3

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: native/package-lock.json

      - name: Install and verify TypeScript (NO Gradle or APK)
        shell: bash
        working-directory: native
        env:
          CI: '1'
          EXPO_NO_TELEMETRY: '1'
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm run typecheck

      - name: Commit only verified source and audit notes
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git add -- native/src/ConnectNativeChat.tsx native/PWA_PARITY_PHASE3.md
          if git diff --cached --quiet; then
            echo 'Phase 3 already applied. No source commit necessary.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(native): PWA chat read receipts, typing and local delete controls'
          git push origin HEAD:main

      - name: Result
        if: success()
        run: |
          {
            echo '### Connect Native PWA parity 3A'
            echo '- Chat actions, PWA typing and delivery/read markers added.'
            echo '- TypeScript passed. Source committed to main.'
            echo '- **No APK, no Gradle, no Expo prebuild, no release artifact.**'
            echo '- Runtime validation will be done after full parity is implemented.'
          } >> "$GITHUB_STEP_SUMMARY"
