name: Connect Android - native chat media journal upgrade
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/install-connect-native-features.yml'
permissions:
  contents: write
concurrency:
  group: connect-native-feature-installer
  cancel-in-progress: false
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Android project
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install native Connect modules without touching WebView APK
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64, zlib, hashlib
          def unpack(s): return zlib.decompress(base64.b64decode(s))
          assets = [
            ('native/src/App.tsx', '2d4e5a35d86202e79e5150972fc78ba10ce31184bb48ea2d02c5a11f713a06ba', ''),
            ('native/src/ConnectNativeChat.tsx', None, ''),
            ('native/src/ConnectNativeMedia.tsx', None, ''),
            ('native/src/ConnectNativeCalls.tsx', None, ''),
            ('native/src/nativeMediaUtils.ts', None, ''),
            ('native/app.json', 'c95a620c413bd97f785e3ac7a349d504cd9b6f5cc274ddeeabe9cf65260f34a3', ''),
            ('native/README.md', '0afacd40a68858fb443126de6370676dbc9f4353cc036043fd56c5d2b040594c', ''),
          ]
          for rel, expected, packed in assets:
              path=Path(rel); content=unpack(packed)
              if path.exists():
                  current=path.read_bytes()
                  if current==content:
                      print("Already up-to-date:", rel); continue
                  if expected is None or hashlib.sha256(current).hexdigest()!=expected:
                      raise RuntimeError(f"Refusing to overwrite manually modified file: {rel}")
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_bytes(content)
              print("Installed:",rel)
          PY
      - name: Resolve Expo SDK 58 native packages
        working-directory: native
        shell: bash
        env:
          CI: '1'
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          npx expo install expo-audio expo-video expo-file-system expo-image-picker expo-document-picker expo-crypto expo-clipboard
          npm install --save-exact js-base64@3.7.8 --no-audit --no-fund
      - name: Typecheck native app before commit
        working-directory: native
        run: npm run typecheck
      - name: Commit source only; old APK remains intact
        shell: bash
        run: |
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add native/src/App.tsx native/src/ConnectNativeChat.tsx native/src/ConnectNativeMedia.tsx native/src/ConnectNativeCalls.tsx native/src/nativeMediaUtils.ts native/app.json native/README.md native/package.json native/package-lock.json
          if git diff --cached --quiet; then
            echo 'Native features already installed.'
            exit 0
          fi
          git commit -m 'feat(native): add profile media, message actions, recordings and call journal'
          git push origin HEAD:main
