name: Connect Android 3.0 — unified guarded update
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/connect-android-300-update.yml']
permissions:
  contents: write
concurrency:
  group: connect-android-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    if: github.repository == 'Chimera1988/connect-android'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
      EXPO_PUBLIC_SUPABASE_URL: 'https://tpwkmoxxzjfdsqsomhhr.supabase.co'
      EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: 'sb_publishable_tAg8rPwuBNcA2iPF7voc2Q_vsKUpyZa'
      EXPO_PUBLIC_CONNECT_URL: 'https://connect-chat.duckdns.org'
      CONNECT_PREVIOUS_CERT_SHA256: ${{ vars.CONNECT_PREVIOUS_CERT_SHA256 }}
    steps:
      - uses: actions/checkout@v4
      - name: Apply the verified Android-only source package
        run: |
          python3 - <<'CONNECT_300_SOURCE'
          import base64,gzip,hashlib,json,os,pathlib
          root=pathlib.Path.cwd().resolve()
          ref=os.environ.get('GITHUB_WORKFLOW_REF','')
          relative='.github/workflows/'+ref.split('/.github/workflows/',1)[1].rsplit('@',1)[0] if '/.github/workflows/' in ref else os.environ['CONNECT_INSTALLER_PATH']
          source=(root/relative).read_text()
          begin='# CONNECT_300_'+'PACKAGE_BEGIN\n';end='# CONNECT_300_'+'PACKAGE_END'
          assert source.count(begin)==1 and source.count(end)==1,'Invalid embedded source package'
          encoded=''.join(line[2:] for line in source.split(begin,1)[1].split(end,1)[0].splitlines() if line.startswith('# '))
          packed=base64.b64decode(encoded,validate=True)
          assert hashlib.sha256(packed).hexdigest()=='23f945478270c544e8ee0cf6eeab145beabf474298e6d5739ccc0d7b67bad682','Source package checksum mismatch'
          payload=json.loads(gzip.decompress(packed))
          def target(name):
           assert name.startswith('native/') or name in ('.github/workflows/connect-release.yml','.github/workflows/connect-android-final-build.yml'),'Out-of-scope source path'
           path=root/name
           assert not any(p.is_symlink() for p in [path,*path.parents] if p.is_relative_to(root)),'Symlink source path'
           assert path.resolve().is_relative_to(root),'Unsafe source path'
           assert not path.exists() or path.is_file(),'Expected source file'
           return path
          def sha(path):return hashlib.sha256(path.read_bytes()).hexdigest() if path.is_file() else None
          # Validate ALL prerequisites before the first mutation. Newer incompatible code is never overwritten.
          for name,expected in payload['unchanged'].items():
           assert sha(target(name))==expected,'Incompatible prerequisite: '+name
          staged={}
          for name,encoded in payload['files'].items():
           data=encoded.encode('utf-8') if isinstance(encoded,str) else base64.b64decode(encoded['binary'],validate=True);current=sha(target(name));after=hashlib.sha256(data).hexdigest()
           assert current==after or current in payload['before'].get(name,[None]),'Source drift: '+name
           if current!=after:staged[name]=data
          for name,expected in payload['delete'].items():
           assert sha(target(name)) in (None,expected),'Deletion source drift: '+name
          for name,data in staged.items():
           path=target(name);path.parent.mkdir(parents=True,exist_ok=True);path.write_bytes(data)
          for name in payload['delete']:target(name).unlink(missing_ok=True)
          print('Connect 3.0 source applied: '+str(len(staged))+' file writes; fully idempotent when zero. PWA/server untouched.')
          CONNECT_300_SOURCE
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
      - name: Install Android SDK
        run: sdkmanager --channel=3 'platforms;android-37.0' 'build-tools;37.0.0' 'platform-tools'
      - name: Verify the checked-out 3.0 source, never reinstall an older embedded payload
        working-directory: native
        run: |
          set -euo pipefail
          node -e "const a=require('./app.json').expo;if(a.android.package!=='com.connect.messenger'||a.version!=='3.0.0'||a.android.versionCode<18)throw Error('Incompatible source version')"
          npm ci --no-audit --no-fund
          node scripts/generate-call-policy.cjs --check
          npm run typecheck
          npm run typecheck:web
          npm test
          CHROMIUM_PATH="$(command -v google-chrome || command -v chromium)" npm run test:browser
          npm run build:web
      - name: Restore original signing key if supplied
        env:
          CONNECT_RELEASE_KEYSTORE_BASE64: ${{ secrets.CONNECT_RELEASE_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [[ -n "$CONNECT_RELEASE_KEYSTORE_BASE64" ]]; then
            umask 077
            printf '%s' "$CONNECT_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/connect-release.jks"
            echo "CONNECT_RELEASE_KEYSTORE_FILE=$RUNNER_TEMP/connect-release.jks" >> "$GITHUB_ENV"
          else
            echo '::warning::Original production key unavailable. Debug signing fallback will be explicitly recorded. Match the previous certificate before installing.'
          fi
      - name: Generate the existing Android app and run all native checks
        working-directory: native
        env:
          CONNECT_RELEASE_STORE_PASSWORD: ${{ secrets.CONNECT_RELEASE_STORE_PASSWORD }}
          CONNECT_RELEASE_KEY_ALIAS: ${{ secrets.CONNECT_RELEASE_KEY_ALIAS }}
          CONNECT_RELEASE_KEY_PASSWORD: ${{ secrets.CONNECT_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          npx expo prebuild --platform android --no-install
          cd android
          chmod +x gradlew
          ./gradlew :app:testReleaseUnitTest :app:lintVitalRelease :app:assembleRelease -PreactNativeArchitectures=armeabi-v7a,arm64-v8a -Pkotlin.incremental=false --no-daemon --max-workers=2
      - name: Save verified Android source when GitHub permits
        run: |
          set -euo pipefail
          mkdir -p release/connect-300
          git add native .github/workflows/connect-android-final-build.yml
          git add -u .github/workflows
          git diff --cached --binary > release/connect-300/ANDROID-SOURCE.patch
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Port five PWA updates and repair native proximity in Connect Android 3.0'
            if ! git push origin "HEAD:$GITHUB_REF_NAME"; then
              echo '::warning::GitHub denied source push. The checked source patch and APK remain in the artifact; the repository was not updated.'
            fi
          fi
      - name: Verify and package one final APK with source provenance
        working-directory: native
        run: |
          set -euo pipefail
          mkdir -p ../release/connect-300
          cp android/app/build/outputs/apk/release/app-release.apk ../release/connect-300/Connect.apk
          python3 scripts/verify-apk.py ../release/connect-300/Connect.apk ../release/connect-300
          git rev-parse HEAD > ../release/connect-300/SOURCE-COMMIT.txt
          git diff --binary > ../release/connect-300/GENERATED-SOURCE.patch
          cp CONNECT_3_REPORT.md CONNECT_3_TRANSFER.md ../release/connect-300/
          cd ../release/connect-300
          zip -9 ../Connect-Android-3.0.zip ./*
      - uses: actions/upload-artifact@v4
        with:
          name: Connect-Android-3.0
          path: release/Connect-Android-3.0.zip
          if-no-files-found: error
          retention-days: 30
      - name: Remove temporary signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/connect-release.jks"

