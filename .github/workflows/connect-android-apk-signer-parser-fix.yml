name: Connect Android | Fix previous APK signer verification
run-name: Connect Android 3.0.8 - repair APK signer check

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: connect-android-signer-fix-main
  cancel-in-progress: false

jobs:
  repair:
    name: Correct signer parsing, verify original APK and update main
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
      - name: Confirm branch and repair only the certificate-reading bug
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'Chimera1988/connect-android'
          test "$GITHUB_REF" = 'refs/heads/main'
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          git diff --exit-code
          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          root = Path('native')
          policy = root / 'scripts/check_release_signing.py'
          previous = root / 'scripts/release/previous-apk.py'
          tests = root / 'scripts/test_release_signing.py'
          lockfile = root / 'PARITY_SOURCE_LOCK.json'
          lock = json.loads(lockfile.read_text())
          paths = ('scripts/check_release_signing.py', 'scripts/release/previous-apk.py', 'scripts/verify-apk.py', 'scripts/test_release_signing.py')
          # Do not patch an unexpected revision or silently accept pre-existing drift.
          for name in paths:
              actual = hashlib.sha256((root / name).read_bytes()).hexdigest()
              if lock['files'].get(name) != actual:
                  raise SystemExit('SOURCE_DRIFT before signing repair: ' + name)

          policy_text = policy.read_text()
          anchor = "DEBUG_CERT = 'fac61745dc0903786fb9ede62a962b399f7348f0bb6f899b8332667591033b9c'"
          if policy_text.count(anchor) != 1 or 'def read_apksigner_fingerprint(' in policy_text:
              raise SystemExit('Unexpected certificate policy source; refusing patch')
          helper = '''def read_apksigner_fingerprint(output):
              """Read a verified APK's public signing certificate in old/new apksigner formats."""
              count = re.search(r'^Number of signers:\\s*(\\d+)\\s*$', output, re.M)
              if count and int(count.group(1)) != 1:
                  raise ValueError('Expected exactly one APK signer')
              digests = set(value.lower() for value in re.findall(
                  r'^\\s*(?:(?:V[0-9](?:\\.[0-9])?\\s+)?Signer(?:\\s+#\\d+)?):?\\s+certificate SHA-256 digest:\\s*([0-9a-fA-F]{64})\\s*$',
                  output, re.M))
              if len(digests) != 1:
                  raise ValueError('Cannot establish one unambiguous previous APK certificate')
              return next(iter(digests))

          '''
          policy.write_text(policy_text.replace(anchor, helper + anchor, 1))

          before = '''digest=re.search(r'Signer #1 certificate SHA-256 digest: ([0-9a-fA-F]+)',cert)
          expected='a6507c8b798b77774144502fb1d9a6d09c53da98946b174c692175a96c230130'
          if not digest or digest[1].lower()!=expected:raise SystemExit('Previous APK production certificate mismatch; release stopped')'''
          after = '''# This script is executed as scripts/release/previous-apk.py from native/.
          # Its import path otherwise excludes the parent scripts directory.
          sys.path.insert(0,str(Path(__file__).resolve().parents[1]))
          from check_release_signing import read_apksigner_fingerprint
          expected='a6507c8b798b77774144502fb1d9a6d09c53da98946b174c692175a96c230130'
          try:
           actual=read_apksigner_fingerprint(cert)
          except ValueError as error:
           raise SystemExit('Cannot verify previous APK signer: '+str(error)) from error
          if actual!=expected:raise SystemExit('Previous APK production certificate mismatch; release stopped')'''
          previous_text = previous.read_text()
          if previous_text.count(before) != 1:
              raise SystemExit('Unexpected previous-APK script; refusing patch')
          previous.write_text(previous_text.replace(before, after, 1))

          # The final, signed 3.0.8 APK must use the same signer parser. Otherwise
          # it could fail after the 3.0.7 comparison, despite matching certificates.
          final_apk = root / 'scripts/verify-apk.py'
          final_text = final_apk.read_text()
          final_import = 'from check_release_signing import validate_certificate'
          old_fingerprint = "fingerprint = re.search(r'(?:Signer #1|V2 Signer|V3 Signer):? certificate SHA-256 digest: ([0-9a-fA-F]+)', signature)"
          if final_text.count(final_import) != 1 or final_text.count(old_fingerprint) != 1:
              raise SystemExit('Unexpected final APK verification script; refusing patch')
          final_text = final_text.replace(final_import, final_import + ', read_apksigner_fingerprint', 1)
          final_text = final_text.replace(old_fingerprint, 'fingerprint = read_apksigner_fingerprint(signature)', 1)
          if final_text.count('fingerprint[1]') != 4:
              raise SystemExit('Unexpected fingerprint usage; refusing patch')
          final_text = final_text.replace('fingerprint[1]', 'fingerprint')
          final_apk.write_text(final_text)

          tests_text = tests.read_text()
          import_anchor = 'from check_release_signing import validate_certificate'
          if tests_text.count(import_anchor) != 1 or 'test_apksigner_current_v2_format' in tests_text:
              raise SystemExit('Unexpected signing unit tests; refusing patch')
          tests_text = tests_text.replace(import_anchor, import_anchor + ', read_apksigner_fingerprint', 1)
          tests_text += '''
          class SigningOutputFormats(unittest.TestCase):
              def test_apksigner_current_v2_format(self):
                  output = 'Number of signers: 1\\nV2 Signer: certificate SHA-256 digest: ' + 'a'*64 + '\\n'
                  self.assertEqual(read_apksigner_fingerprint(output), 'a'*64)
              def test_apksigner_versioned_numbered_format(self):
                  output = 'V2 Signer #1 certificate SHA-256 digest: ' + 'a'*64 + '\\n'
                  self.assertEqual(read_apksigner_fingerprint(output), 'a'*64)
              def test_apksigner_legacy_format(self):
                  output = 'Signer #1 certificate SHA-256 digest: ' + 'b'*64 + '\\n'
                  self.assertEqual(read_apksigner_fingerprint(output), 'b'*64)
              def test_matching_v2_v3_is_allowed(self):
                  output = 'V2 Signer: certificate SHA-256 digest: ' + 'a'*64 + '\\nV3 Signer: certificate SHA-256 digest: ' + 'a'*64
                  self.assertEqual(read_apksigner_fingerprint(output), 'a'*64)
              def test_different_certificates_are_rejected(self):
                  output = 'V2 Signer: certificate SHA-256 digest: ' + 'a'*64 + '\\nV3 Signer: certificate SHA-256 digest: ' + 'b'*64
                  with self.assertRaises(ValueError):
                      read_apksigner_fingerprint(output)
              def test_missing_or_multiple_signers_are_rejected(self):
                  with self.assertRaises(ValueError):
                      read_apksigner_fingerprint('Number of signers: 0')
                  with self.assertRaises(ValueError):
                      read_apksigner_fingerprint('Number of signers: 2\\nV2 Signer: certificate SHA-256 digest: ' + 'a'*64)
          '''
          tests.write_text(tests_text)

          for name in paths:
              lock['files'][name] = hashlib.sha256((root / name).read_bytes()).hexdigest()
          lockfile.write_text(json.dumps(lock, indent=2, ensure_ascii=False) + '\n')
          print('Updated exact source hashes for', ', '.join(paths))
          PY
          python3 -m compileall -q native/scripts/check_release_signing.py native/scripts/release/previous-apk.py native/scripts/verify-apk.py native/scripts/test_release_signing.py
          (cd native && python3 -m unittest discover -s scripts -p 'test_release_signing.py' -v)
          node native/scripts/check-parity-source.mjs
          git diff --check
      - name: Verify the published Connect 3.0.7 APK with the fixed parser
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sdkmanager 'build-tools;37.0.0'
          mkdir -p "$RUNNER_TEMP/oldapk"
          gh release download connect-android-v3.0.7-b25 \
            --repo "$GITHUB_REPOSITORY" --pattern Connect.apk --dir "$RUNNER_TEMP/oldapk"
          printf '%s  %s\n' \
            '5d50755822cb2fd4c9fe781cd140b9dc164cf747cab9fce5ceec5caa37e3a5a8' \
            "$RUNNER_TEMP/oldapk/Connect.apk" | sha256sum --check
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify \
            --min-sdk-version 29 --verbose --print-certs "$RUNNER_TEMP/oldapk/Connect.apk" \
            > "$RUNNER_TEMP/oldapk/signature.txt"
          python3 - <<'PY'
          import sys
          from pathlib import Path
          import os
          sys.path.insert(0, 'native/scripts')
          from check_release_signing import read_apksigner_fingerprint
          text = Path(os.environ['RUNNER_TEMP'], 'oldapk/signature.txt').read_text()
          actual = read_apksigner_fingerprint(text)
          expected = 'a6507c8b798b77774144502fb1d9a6d09c53da98946b174c692175a96c230130'
          if actual != expected:
              raise SystemExit('STOP: actual published APK certificate does not match permanent release key')
          print('Verified real published APK signer:', actual)
          PY
      - name: Commit tested source-only correction to main
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$(git rev-parse HEAD)"
          git add -- native/scripts/check_release_signing.py native/scripts/release/previous-apk.py native/scripts/verify-apk.py native/scripts/test_release_signing.py native/PARITY_SOURCE_LOCK.json
          git diff --cached --check
          git diff --cached --quiet && { echo 'No new corrections'; exit 0; }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Fix v2/v3 APK signer parsing for in-place Connect updates'
          git push origin HEAD:refs/heads/main
