name: Connect Android | 3.0.7 OTA signed candidate 2026-11-17

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: connect-android-307-ota-signed-candidate
  cancel-in-progress: false

jobs:
  verify-and-package:
    name: Verify Connect OTA and build one permanently signed APK
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
      EXPO_PUBLIC_SUPABASE_URL: https://tpwkmoxxzjfdsqsomhhr.supabase.co
      EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_tAg8rPwuBNcA2iPF7voc2Q_vsKUpyZa
      EXPO_PUBLIC_CONNECT_URL: https://connect-chat.duckdns.org
      CONNECT_PREVIOUS_CERT_SHA256: a6507c8b798b77774144502fb1d9a6d09c53da98946b174c692175a96c230130
    steps:
      - name: Checkout exact current Android main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Enforce existing Connect app, OTA bootstrap, and release boundaries
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'Chimera1988/connect-android'
          test "$GITHUB_REF" = 'refs/heads/main'
          test -s native/app.json
          test -s native/PARITY_SOURCE_LOCK.json
          test -s native/package-lock.json
          test -s native/tests/connect-ota-config-20261117.test.cjs
          test -s native/scripts/verify-apk.py
          test -s native/scripts/check-parity-source.mjs
          python3 - <<'PY'
          import json
          from pathlib import Path
          app=json.loads(Path('native/app.json').read_text())['expo']
          pkg=json.loads(Path('native/package.json').read_text())
          assert app['android']['package']=='com.connect.messenger'
          assert app['version']=='3.0.6' and app['android']['versionCode']==24, 'Already released or source drift: do not run again'
          assert app['runtimeVersion']=='connect-android-ota-v1-sdk58'
          assert app['updates']['enabled'] is True
          assert app['updates']['url']=='https://u.expo.dev/430c7f08-3921-48d5-96d1-f7c3d686d3bf'
          assert app['updates']['requestHeaders']['expo-channel-name']=='production'
          assert app['extra']['eas']['projectId']=='430c7f08-3921-48d5-96d1-f7c3d686d3bf'
          assert pkg['dependencies']['expo-updates']=='58.0.22'
          print('EXPO_OTA_BOOTSTRAP_VERIFIED; existing 3.0.6 release is untouched')
          PY

      - name: Install Node.js 24, Java 21, and Android SDK tools
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: native/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4

      - name: Install reviewed sources, confirm original 373-file lock
        shell: bash
        working-directory: native
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          node scripts/check-parity-source.mjs

      - name: Update only release identity and its locked verification scripts
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          root=Path('native')
          def replace_once(file,old,new):
              path=root/file
              text=path.read_text(encoding='utf-8')
              n=text.count(old)
              if n!=1: raise SystemExit('SOURCE_DRIFT '+file+': expected one version anchor, got '+str(n))
              path.write_text(text.replace(old,new,1),encoding='utf-8')
          app_path=root/'app.json'
          app=json.loads(app_path.read_text(encoding='utf-8'))
          e=app['expo']
          assert e['version']=='3.0.6' and e['android']['versionCode']==24
          e['version']='3.0.7'
          e['android']['versionCode']=25
          app_path.write_text(json.dumps(app,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          pkg_path=root/'package.json'
          pkg=json.loads(pkg_path.read_text(encoding='utf-8'))
          assert pkg['version']=='3.0.6'
          pkg['version']='3.0.7'
          pkg_path.write_text(json.dumps(pkg,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          replace_once('scripts/check-parity-source.mjs',"app.version!=='3.0.6'||app.android.versionCode!==24", "app.version!=='3.0.7'||app.android.versionCode!==25")
          replace_once('tests/connect-ota-config-20261117.test.cjs',"assert.equal(app.version,'3.0.6');", "assert.equal(app.version,'3.0.7');")
          replace_once('tests/connect-ota-config-20261117.test.cjs',"assert.equal(app.android.versionCode,24);", "assert.equal(app.android.versionCode,25);")
          # Full-suite tests must agree with the new, verified release identity.
          replace_once('tests/release-config.test.cjs',"assert.equal(expo.android.versionCode, 24);", "assert.equal(expo.android.versionCode, 25);")
          # Preserve the source-lock test's purpose while updating its release fixture.
          replace_once('tests/source-lock.test.cjs',"version:'3.0.6',android:{package:'com.connect.messenger',versionCode:24}", "version:'3.0.7',android:{package:'com.connect.messenger',versionCode:25}")
          replace_once('scripts/verify-apk.py',"versionCode='24'", "versionCode='25'")
          replace_once('scripts/verify-apk.py',"versionName='3.0.6'", "versionName='3.0.7'")
          replace_once('scripts/verify-apk.py',"'version': '3.0.6', 'versionCode': 24", "'version': '3.0.7', 'versionCode': 25")
          print('Prepared 3.0.7 (25); original 3.0.6 (24) remains available as prior signed release')
          PY
          cd native
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          python3 - <<'PY'
          import json,hashlib
          from pathlib import Path
          root=Path('.')
          path=root/'PARITY_SOURCE_LOCK.json'
          lock=json.loads(path.read_text(encoding='utf-8'))
          required=['app.json','package.json','package-lock.json','scripts/check-parity-source.mjs','scripts/verify-apk.py','tests/connect-ota-config-20261117.test.cjs','tests/release-config.test.cjs','tests/source-lock.test.cjs']
          for name in required:
              if name not in lock['files'] and name!='tests/connect-ota-config-20261117.test.cjs':
                  raise SystemExit('SOURCE_LOCK_MISSING '+name)
              if name in lock['files']:
                  lock['files'][name]=hashlib.sha256((root/name).read_bytes()).hexdigest()
          path.write_text(json.dumps(lock,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print('Preserved',len(lock['files']),'reviewed source file hashes')
          PY
          node scripts/check-parity-source.mjs
          git diff --check

      - name: Verify any packaged PEM is public X.509, never private signing credentials
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json, ast, re, subprocess, tempfile, io, zipfile

          path=Path('native/scripts/verify-apk.py')
          src=path.read_text()
          old="    assert not any(n.lower().endswith(('.jks','.keystore','.p12','.pem')) for n in z.namelist()), 'Signing material must not be shipped'"
          if src.count(old)!=1:
              raise SystemExit('SOURCE_DRIFT: exact legacy APK credential verifier changed')
          function='def audit_packaged_signing_material(archive):\n    """Reject any private credentials; permit only parseable public X.509/PEM keys."""\n    blocked_ext = (\'.jks\', \'.keystore\', \'.p12\', \'.pfx\', \'.key\')\n    pem_pattern = re.compile(rb\'-----BEGIN (CERTIFICATE|PUBLIC KEY|RSA PUBLIC KEY)-----\\s*\' \n                             rb\'[A-Za-z0-9+/=\\s]+?-----END \\1-----\')\n    for info in archive.infolist():\n        entry = info.filename\n        name = entry.lower()\n        if name.endswith(blocked_ext):\n            raise AssertionError(\'APK contains forbidden credential file: \' + entry)\n        if not name.endswith(\'.pem\'):\n            continue\n        content = archive.read(info)\n        if len(content) > 1048576 or b\'PRIVATE KEY\' in content.upper():\n            raise AssertionError(\'APK contains private or oversized PEM: \' + entry)\n        blocks = list(pem_pattern.finditer(content))\n        if not blocks or pem_pattern.sub(b\'\', content).strip():\n            raise AssertionError(\'APK contains unrecognized PEM material: \' + entry)\n        for match in blocks:\n            typ = match.group(1)\n            if typ == b\'CERTIFICATE\':\n                command = [\'openssl\', \'x509\', \'-inform\', \'PEM\', \'-noout\']\n            else:\n                command = [\'openssl\', \'pkey\', \'-pubin\', \'-inform\', \'PEM\', \'-noout\']\n            result = subprocess.run(command, input=match.group(0),\n                                    stdout=subprocess.DEVNULL,\n                                    stderr=subprocess.DEVNULL, check=False)\n            if result.returncode != 0:\n                raise AssertionError(\'APK contains malformed public PEM: \' + entry)\n        print(\'APK_PUBLIC_PEM_ONLY:\', entry, \'(\', len(blocks), \'validated public certificate/key blocks)\')'
          marker="apk = Path(sys.argv[1]).resolve()"
          if src.count(marker)!=1:
              raise SystemExit('SOURCE_DRIFT: verifier entrypoint changed')
          src=src.replace(marker,function+'\n\n'+marker,1)
          src=src.replace(old,'    audit_packaged_signing_material(z)',1)
          ast.parse(src)
          path.write_text(src)
          manifest=Path('native/PARITY_SOURCE_LOCK.json')
          data=json.loads(manifest.read_text())
          assert 'scripts/verify-apk.py' in data['files']
          data['files']['scripts/verify-apk.py']=hashlib.sha256(path.read_bytes()).hexdigest()
          manifest.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n')

          # Test the installed function independently using synthetic APK archives.
          node=next(x for x in ast.parse(src).body if isinstance(x,ast.FunctionDef) and x.name=='audit_packaged_signing_material')
          scope={'re':re,'subprocess':subprocess}
          exec(compile(ast.Module(body=[node],type_ignores=[]),str(path),'exec'),scope)
          audit=scope['audit_packaged_signing_material']
          def check(member,payload,should_pass):
              buff=io.BytesIO()
              with zipfile.ZipFile(buff,'w') as z:
                  z.writestr(member,payload)
              buff.seek(0)
              failed=False
              with zipfile.ZipFile(buff) as z:
                  try: audit(z)
                  except AssertionError: failed=True
              assert failed != should_pass, ('unexpected APK credential audit result',member,should_pass)
          check('assets/my-private.jks',b'fake',False)
          check('assets/my-private.p12',b'fake',False)
          check('assets/my-private.pem',b'-----BEGIN PRIVATE KEY-----\nprivate\n-----END PRIVATE KEY-----',False)
          check('assets/garbage.pem',b'fake',False)
          check('assets/icons.png',b'ok',True)
          with tempfile.TemporaryDirectory() as d:
              from pathlib import Path as P
              cert=P(d)/'public.pem'
              key=P(d)/'private.key'
              subprocess.run(['openssl','req','-x509','-newkey','rsa:2048','-nodes',
                              '-keyout',str(key),'-out',str(cert),'-subj','/CN=Connect Test',
                              '-days','1'],stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL,check=True)
              check('assets/public-cert.pem',cert.read_bytes(),True)
              check('assets/cert-in-disguise.pem',cert.read_bytes()+b'\nprivate key pasted',False)
          print('Credential audit regression: 7 cases passed. Private material always rejected.')
          PY
          (cd native && node scripts/check-parity-source.mjs)
          git diff --check

      - name: Install exact 3.0.7 package lock and check identity regressions
        shell: bash
        working-directory: native
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          node scripts/check-parity-source.mjs
          node --test tests/connect-ota-config-20261117.test.cjs tests/release-config.test.cjs tests/source-lock.test.cjs
          node scripts/verify-builtin-sounds.cjs
          node scripts/generate-call-policy.cjs --check

      - name: Require preexisting permanent Connect certificate, never debug fallback
        shell: bash
        env:
          CONNECT_RELEASE_KEYSTORE_BASE64: ${{ secrets.CONNECT_RELEASE_KEYSTORE_BASE64 }}
          CONNECT_RELEASE_STORE_PASSWORD: ${{ secrets.CONNECT_RELEASE_STORE_PASSWORD }}
          CONNECT_RELEASE_KEY_ALIAS: ${{ secrets.CONNECT_RELEASE_KEY_ALIAS }}
          CONNECT_RELEASE_KEY_PASSWORD: ${{ secrets.CONNECT_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for v in CONNECT_RELEASE_KEYSTORE_BASE64 CONNECT_RELEASE_STORE_PASSWORD CONNECT_RELEASE_KEY_ALIAS CONNECT_RELEASE_KEY_PASSWORD; do
            if [[ -z "${!v}" ]]; then echo "::error::Missing existing permanent release secret $v"; exit 1; fi
          done
          test "$CONNECT_RELEASE_KEY_ALIAS" = 'connect-release'
          umask 077
          printf '%s' "$CONNECT_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/connect-existing-release.jks"
          test -s "$RUNNER_TEMP/connect-existing-release.jks"
          export CONNECT_RELEASE_KEYSTORE_FILE="$RUNNER_TEMP/connect-existing-release.jks"
          cd native
          python3 scripts/check_release_signing.py

      - name: Test embedded Connect WebView, native types, and all offline regressions
        shell: bash
        working-directory: native
        run: |
          set -euo pipefail
          mkdir -p verification/ota
          npm run build:web
          test -s src/generated/pwa.ts
          npm run typecheck:web
          npm run typecheck
          npx --no-install playwright-core install --with-deps chromium
          export CHROMIUM_PATH="$(node -p "require('playwright-core').chromium.executablePath()")"
          test -x "$CHROMIUM_PATH"
          python3 -m unittest discover -s scripts -p test_release_signing.py
          npm test 2>&1 | tee verification/ota/node-tests.txt
          npm run test:browser 2>&1 | tee verification/ota/browser-tests.txt
          node scripts/check-parity-source.mjs

      - name: Verify Expo runtime export and existing WebView payload
        shell: bash
        working-directory: native
        run: |
          set -euo pipefail
          npx --no-install expo export --platform android --output-dir "$RUNNER_TEMP/connect-ota-export"
          python3 - <<'PY'
          import os,json
          from pathlib import Path
          folder=Path(os.environ['RUNNER_TEMP'])/'connect-ota-export'
          assert (folder/'metadata.json').is_file(), 'Expo metadata missing'
          files=list(folder.rglob('*.hbc'))+list(folder.rglob('*.js'))
          assert any(p.stat().st_size>100000 for p in files), 'Hermes/JS Android entry bundle missing'
          app=json.loads(Path('app.json').read_text())['expo']
          assert app['runtimeVersion']=='connect-android-ota-v1-sdk58'
          assert app['updates']['requestHeaders']['expo-channel-name']=='production'
          html=Path('src/generated/pwa.ts')
          assert html.exists() and html.stat().st_size>100000
          print('Verified Android Hermes/JS OTA export and embedded Connect HTML')
          PY

      - name: Prebuild native Android and require stable OTA manifest and bundled stickers
        shell: bash
        working-directory: native
        run: |
          set -euo pipefail
          npx --no-install expo prebuild --platform android --no-install --clean
          node scripts/check-parity-source.mjs --tools > verification/ota/android-tools.json
          grep -q 'expo.modules.updates.EXPO_UPDATE_URL' android/app/src/main/AndroidManifest.xml
          grep -q 'expo.modules.updates.EXPO_RUNTIME_VERSION' android/app/src/main/AndroidManifest.xml
          grep -q 'expo-channel-name' android/app/src/main/AndroidManifest.xml
          test -f android/app/src/main/assets/connect-web/stickers/speed/hello.webp
          python3 - <<'PY'
          from pathlib import Path
          import json
          app=json.loads(Path('app.json').read_text())['expo']
          assert app['android']['package']=='com.connect.messenger' and app['android']['versionCode']==25
          assert app['runtimeVersion']=='connect-android-ota-v1-sdk58'
          assert app['updates']['url']=='https://u.expo.dev/430c7f08-3921-48d5-96d1-f7c3d686d3bf'
          print('Native Expo Updates production channel + original APK assets confirmed')
          PY
          readarray -t sdk < <(node -e "const v=require('./verification/ota/android-tools.json');console.log(v.sdkPlatform);console.log(v.buildTools);console.log(v.ndk)")
          sdkmanager --channel=3 "${sdk[0]}" "build-tools;${sdk[1]}" "ndk;${sdk[2]}" 'cmake;3.22.1' 'platform-tools'

      - name: Native release compilation, JVM tests, and Android lint
        working-directory: native/android
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :app:compileReleaseKotlin :app:compileReleaseJavaWithJavac :app:testReleaseUnitTest :app:lintRelease --no-daemon --max-workers=2

      - name: Build exactly one permanent-release-signed APK
        shell: bash
        working-directory: native
        env:
          CONNECT_RELEASE_KEYSTORE_FILE: ${{ runner.temp }}/connect-existing-release.jks
          CONNECT_RELEASE_STORE_PASSWORD: ${{ secrets.CONNECT_RELEASE_STORE_PASSWORD }}
          CONNECT_RELEASE_KEY_ALIAS: ${{ secrets.CONNECT_RELEASE_KEY_ALIAS }}
          CONNECT_RELEASE_KEY_PASSWORD: ${{ secrets.CONNECT_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          node scripts/check-parity-source.mjs
          python3 scripts/check_release_signing.py
          cd android
          ./gradlew :app:assembleRelease --no-daemon --max-workers=2
          test -s app/build/outputs/apk/release/app-release.apk

      - name: Verify actual APK identity, signature, sounds, calls, and all 96 bundled WebP
        shell: bash
        working-directory: native
        env:
          CONNECT_RELEASE_KEYSTORE_FILE: ${{ runner.temp }}/connect-existing-release.jks
        run: |
          set -euo pipefail
          mkdir -p ../release/Connect-3.0.7-OTA
          cp android/app/build/outputs/apk/release/app-release.apk ../release/Connect-3.0.7-OTA/Connect.apk
          python3 scripts/verify-apk.py ../release/Connect-3.0.7-OTA/Connect.apk ../release/Connect-3.0.7-OTA
          cp PARITY_SOURCE_LOCK.json ../release/Connect-3.0.7-OTA/
          git rev-parse HEAD > ../release/Connect-3.0.7-OTA/BUILD-SOURCE-BASE.txt
          echo 'NOT YET DEVICE-VERIFIED: install only over APK with identical signing certificate; do not publish OTA before testing.' > ../release/Connect-3.0.7-OTA/READ-ME-FIRST.txt

      - name: Upload tested APK candidate (manual install, not OTA publication)
        uses: actions/upload-artifact@v4
        with:
          name: Connect-Android-3.0.7-OTA-permanent-signed-candidate
          path: release/Connect-3.0.7-OTA/*
          if-no-files-found: error
          retention-days: 30

      - name: Commit only verified release identity and tests into Android main
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$(git rev-parse HEAD)" || {
            echo '::error::Android main changed during build; refusing to push stale release identity'; exit 1;
          }
          git add -- native/app.json native/package.json native/package-lock.json native/scripts/check-parity-source.mjs native/scripts/verify-apk.py native/tests/connect-ota-config-20261117.test.cjs native/tests/release-config.test.cjs native/tests/source-lock.test.cjs native/PARITY_SOURCE_LOCK.json
          git diff --cached --check
          test -n "$(git diff --cached --name-only)"
          git -c user.name='Connect CI' -c user.email='actions@users.noreply.github.com' commit -m 'Android 3.0.7: verified OTA-capable permanently signed release candidate'
          git push origin HEAD:main
          echo 'SUCCESS: candidate built and committed. Expo OTA publishing intentionally disabled.'

      - name: Upload test and Gradle diagnostics, including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Connect-Android-3.0.7-OTA-build-reports-${{ github.run_id }}
          path: |
            native/verification/ota/
            native/android/app/build/reports/
            native/android/app/build/test-results/
          if-no-files-found: ignore
          retention-days: 14

      - name: Delete temporary private signing key
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/connect-existing-release.jks"
