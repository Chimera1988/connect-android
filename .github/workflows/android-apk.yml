# Legacy APK workflow disabled until full functional parity with Connect PWA.
# Neither push events nor manual dispatch compile or publish APK files.
name: Connect Android — финальный выпуск (пока заблокирован)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-status:
    runs-on: ubuntu-latest
    steps:
      - name: Статус выпуска — без сборки APK
        shell: bash
        run: |
          echo '### Connect Android' >> "$GITHUB_STEP_SUMMARY"
          echo 'APK не собирается до завершения 10 этапов и 100% PWA-аудита.' >> "$GITHUB_STEP_SUMMARY"
          echo 'No Gradle, Expo prebuild, APK compilation or APK upload is executed.'
