# Connect Native — final-release gate.
# APK creation is intentionally disabled until complete PWA parity has been
# implemented, reviewed, and confirmed for every required screen and feature.
# This file replaces the old automatic QA/Test APK workflow in-place.
name: Connect Native — подготовка финального релиза

# Intentionally NO push trigger: changing native/* must never build an APK.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-readiness:
    name: Проверка статуса — без сборки APK
    runs-on: ubuntu-latest
    steps:
      - name: Выпуск остановлен до полного переноса PWA
        shell: bash
        run: |
          set -euo pipefail
          {
            echo '### Connect Native — финальный релиз'
            echo ''
            echo 'Автоматическая сборка APK отключена до полного переноса функциональности и внешнего вида Connect PWA.'
            echo 'Это только информационная проверка статуса, а не сборка приложения.'
            echo 'Никакие Gradle-команды и публикация APK не выполняются.'
            echo ''
            echo 'Следующий выпуск — только после полного аудита соответствия PWA.'
          } >> "$GITHUB_STEP_SUMMARY"
          echo 'Connect Native: выпуск APK приостановлен до подтверждения полного соответствия PWA.'
