# Upload this ONE file to .github/workflows/ in Chimera1988/connect-android.
# It does not compile, produce, upload, install, or publish APKs.
# Even a green result means only code/audit validation, NOT permission to release.
name: Connect Native - PWA parity phase 10 (199-point release audit, NO APK)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/connect-native-pwa-parity-phase10.yml

permissions:
  contents: write

concurrency:
  group: connect-native-pwa-parity-phase10
  cancel-in-progress: false

jobs:
  source-audit:
    name: Audit 199 PWA requirements; TypeScript only; release remains blocked
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout current Android project
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Verify the NO-APK release gate and source prerequisites
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B main origin/main
          python3 - <<'PY_GATE'
          import re
          from pathlib import Path
          legacy=Path('.github/workflows/android-apk.yml')
          if not legacy.is_file():raise SystemExit('STOP: no legacy APK release gate')
          body=legacy.read_text(encoding='utf-8')
          if re.search(r'^  push\s*:',body,re.M) or re.search(r'\b(?:assembleRelease|assembleDebug|gradlew)\b',body,re.I):
              raise SystemExit('STOP: legacy APK build is still enabled')
          needed=['native/src/App.tsx','native/src/ConnectNativeChat.tsx','native/src/ConnectNativeVoice.tsx',
             'native/src/ConnectNativePush.ts','native/src/ConnectNativeMusic.tsx',
             'native/src/ConnectNativeReadSync.ts','native/src/ConnectNativeSonicRunner.tsx',
             'native/src/ConnectNativeInvites.tsx','native/src/ConnectNativeCalls.tsx',
             'native/package-lock.json','native/app.json']
          for name in needed:
              if not Path(name).is_file():raise SystemExit('STOP: prerequisite source missing: '+name)
          print('APK release is blocked and stages 1–9 exist; ready for source audit.')
          PY_GATE

