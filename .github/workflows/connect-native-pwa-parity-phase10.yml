          from pathlib import Path
          import hashlib,base64,gzip,json
          for path,(digest,blob) in PAYLOADS.items():
              raw=gzip.decompress(base64.b64decode(blob))
              if hashlib.sha256(raw).hexdigest()!=digest:raise SystemExit('STOP: corrupted phase 10 payload '+path)
              output=Path(path)
              output.parent.mkdir(parents=True,exist_ok=True)
              if output.exists() and output.read_bytes()==raw:continue
              output.write_bytes(raw)
          config=Path('native/app.json')
          obj=json.loads(config.read_text(encoding='utf-8'))
          if obj['expo'].get('name') not in ('Connect Native','Connect'):raise SystemExit('STOP: unexpected Android app display name')
          if obj['expo']['android'].get('package')!='com.connect.messenger':raise SystemExit('STOP: Android package identifier changed')
          if obj['expo']['name']!='Connect':
              obj['expo']['name']='Connect'
              config.write_text(json.dumps(obj,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print('Phase 10 audit installed; user-facing app name: Connect. No APK build.')
          PY_PHASE10
          git diff --check
          test -s native/phase10_tools/phase10_audit.py
          test -s native/phase10_tools/baseline_199.json

      - name: Unit-test audit logic, including the failure-safe release gate
        shell: bash
        run: |
          set -euo pipefail
          python3 native/phase10_tools/phase10_audit.py --self-test

      - name: Generate truthful 199-point source-evidence report (no device claims)
        shell: bash
        run: |
          set -euo pipefail
          CONNECT_AUDIT_OUTPUT=native/phase10-audit python3 native/phase10_tools/phase10_audit.py
          test -s native/phase10-audit/phase10_parity_199.json
          python3 - <<'PY_VERIFY'
          import json
          from pathlib import Path
          report=json.loads(Path('native/phase10-audit/phase10_parity_199.json').read_text())
          assert len(report['cases'])==199
          assert report['runtime_acceptance_confirmed']==0
          assert report['release_status'].startswith('NOT READY')
          assert sum(x['source_probe']=='Есть текстовый признак' for x in report['cases'])+report['source_review_needed']==199
          print('199-point report validated: successful source scan does not open the APK release gate.')
          PY_VERIFY

      - name: Node.js 24 for Expo 58
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: native/package-lock.json

      - name: TypeScript validation (NO Expo prebuild or Gradle)
        shell: bash
        working-directory: native
        env:
          CI: '1'
          EXPO_NO_TELEMETRY: '1'
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm run typecheck

      - name: Upload audit evidence and 199-item checklist (not an APK)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: connect-native-phase10-parity-report
          path: |
            native/phase10-audit/*.md
            native/phase10-audit/*.csv
            native/phase10-audit/*.json
          if-no-files-found: warn
          retention-days: 60

      - name: Persist source-only audit and Connect branding after passing TypeScript
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git add -- native/app.json native/phase10_tools native/phase10-audit
          if git diff --cached --quiet; then
            echo 'No source or audit update needed.'
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'audit(native): 199-point PWA evidence matrix and Connect release branding (NO APK)'
            git push origin HEAD:main
          fi

      - name: Explain result and retain release block
        if: success()
        shell: bash
        run: |
          cat native/phase10-audit/summary.md >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo '**APK IS NOT BUILT.** Full device testing and visual PWA parity remain mandatory.' >> "$GITHUB_STEP_SUMMARY"
