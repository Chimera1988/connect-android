      - name: Validate code using Expo SDK 58 TypeScript (NO APK)
        working-directory: native
        shell: bash
        env:
          CI: '1'
          EXPO_NO_TELEMETRY: '1'
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm run typecheck

      - name: Recompute exact 199-point static audit
        shell: bash
        run: |
          set -euo pipefail
          python3 native/phase10_tools/phase10_audit.py
          python3 - <<'PY_AUDIT_CHECK'
          import json
          from pathlib import Path
          d=json.loads(Path('native/phase10-audit/phase10_parity_199.json').read_text())
          assert len(d['cases'])==199
          assert d['runtime_acceptance_confirmed']==0
          assert d['release_status'].startswith('NOT READY')
          text=Path('native/src/ConnectNativeChat.tsx').read_text()
          assert 'getImageAsync' in text and 'Фото из буфера' in text
          assert 'recording_until:new Date(Date.now()+120000)' not in text
          assert 'recording_until:new Date(Date.now()+8000)' in text
          print('199 static evidence cases reviewed; runtime acceptance stays at 0.')
          PY_AUDIT_CHECK

