# Connect Android: one consolidated source-parity fix/review run, NO APK.
# This does not claim 100% runtime compatibility.
name: Connect Android - final PWA parity source corrections and 199 review (NO APK)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/connect-android-final-parity.yml

permissions:
  contents: write

concurrency:
  group: connect-android-final-parity
  cancel-in-progress: false

jobs:
  final-source-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout latest Connect Android source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Guard against APK generation and verify existing audit
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B main origin/main
          python3 - <<'PY_GUARD'
          import re
          from pathlib import Path
          apk=Path('.github/workflows/android-apk.yml')
          if not apk.is_file():raise SystemExit('STOP: APK workflow not found')
          yml=apk.read_text()
          if re.search(r'^\s{2}push\s*:',yml,re.M) or re.search(r'\b(?:assemble(?:Debug|Release)|gradlew|eas build)\b',yml,re.I):
              raise SystemExit('STOP: APK build gate is open')
          required=['native/src/ConnectNativeChat.tsx','native/phase10_tools/phase10_audit.py','native/phase10_tools/baseline_199.json']
          for f in required:
              if not Path(f).is_file():raise SystemExit('Missing native source/audit: '+f)
          print('APK gate is closed. 199-point baseline exists.')
          PY_GUARD

