          exec(compile(gzip.decompress(base64.b64decode(payload)).decode('utf-8'),'make_review.py','exec'))
          PY_REPORT

      - name: Commit source corrections and review; NO release
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git add -- native/src/ConnectNativeChat.tsx native/phase10-audit/ native/final-parity-review/
          if git diff --cached --quiet; then
            echo 'Final review sources already up to date.'
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'fix(native): clipboard images, recording presence and final PWA parity review'
            git push origin HEAD:main
          fi

      - name: Upload 199-case review files for inspection
        uses: actions/upload-artifact@v4
        with:
          name: connect-android-final-source-review-199
          path: |
            native/final-parity-review/
            native/phase10-audit/
          retention-days: 30

      - name: Final summary - APK is still blocked
        if: success()
        shell: bash
        run: |
          {
            echo '### Connect Native — single consolidated source review'
            echo '- Fixed clipboard images via native attachment menu.'
            echo '- Fixed voice recording presence stale lease and typing priority.'
            echo '- Published 199-case source-vs-device acceptance matrix.'
            echo '- Remaining source discrepancies are explicitly listed; device acceptance remains 0/199.'
            echo '- No prebuild, Gradle, EAS build or APK was launched.'
          } >> "$GITHUB_STEP_SUMMARY"
