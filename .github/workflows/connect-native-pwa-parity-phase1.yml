name: Connect Native - PWA parity phase 1 (invitation codes)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/connect-native-pwa-parity-phase1.yml

permissions:
  contents: write

concurrency:
  group: connect-native-pwa-parity-1
  cancel-in-progress: false

jobs:
  integrate-and-check:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - name: Checkout latest Connect Native
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Verify current native-only source tree
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B main origin/main
          test -s native/src/App.tsx
          test -s native/google-services.json
          test -s native/src/ConnectNativeGlass.tsx
          test ! -e app
      - name: Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - name: Integrate the original PWA invitation registration and admin flows
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_CONNECT_PARITY'
          from pathlib import Path
          from hashlib import sha256
          import zlib,base64,subprocess,sys
          assets=[
            ('native/src/ConnectNativeInvites.tsx','c59e555d8f2a824e061eb0aad5474316792820ecb2ae1f7fcba8808f480638b7',''),
            ('/tmp/connect-native-parity-apply.py','f11f04e9da5bcac79bbd51d2901f6868679cb829cc7296f89573456894005e34',''),
           ]
          for filename,digest,encoded in assets:
              source=zlib.decompress(base64.b64decode(encoded))
              if sha256(source).hexdigest()!=digest:
                  raise SystemExit('Installer integrity check failed: '+filename)
              target=Path(filename)
              target.parent.mkdir(parents=True,exist_ok=True)
              if filename.startswith('/tmp/'):
                  target.write_bytes(source)
              elif target.exists() and target.read_bytes()!=source:
                  raise SystemExit('Existing source differs; refusing to overwrite: '+filename)
              elif not target.exists():
                  target.write_bytes(source)
          subprocess.run([sys.executable,'/tmp/connect-native-parity-apply.py'],check=True)
          print('Invitation-code PWA parity source installed')
          PY_CONNECT_PARITY
      - name: Validate React Native TypeScript
        working-directory: native
        env:
          CI: '1'
          EXPO_NO_TELEMETRY: '1'
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm run typecheck
      - name: Generate Android native code
        working-directory: native
        env:
          CI: '1'
          EXPO_NO_TELEMETRY: '1'
        run: npx expo prebuild --platform android --no-install --clean
      - name: Install Android SDK 37
        run: |
          set -euo pipefail
          sdkmanager --channel=3 --install 'platforms;android-37.0' 'build-tools;37.0.0' 'platform-tools'
          test -s "${ANDROID_SDK_ROOT}/platforms/android-37.0/android.jar"
      - name: Compile native Android (validation only)
        working-directory: native/android
        env:
          CI: '1'
          EXPO_NO_TELEMETRY: '1'
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon --stacktrace
          test -s app/build/outputs/apk/debug/app-debug.apk
      - name: Commit only the verified native source changes
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git add native/src/App.tsx native/src/ConnectNativeInvites.tsx
          if git diff --cached --quiet; then
            echo 'Native invitation flows already installed'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(native): PWA invitation registration and admin invitation management'
          git push origin HEAD:main
      - name: Summary
        if: success()
        run: |
          {
            echo '### Connect Native: invitation feature parity (PWA server APIs)'
            echo '- Sign-in screen: **У меня есть код приглашения**.'
            echo '- Registration: `/api/invite/redeem` (server validates code and creates account).'
            echo '- Admin-only invitation creation/list/revocation: `/api/admin/invite`.'
            echo '- TypeScript and Android compilation passed; real-device UX still needs verification.'
            echo '- No WebView and no changes to PWA, Firebase registration or push delivery.'
            echo '- Rebuild the native QA APK after source changes have been committed.'
          } >> "$GITHUB_STEP_SUMMARY"
