name: Connect Native - PWA parity phase 1 (invitation codes)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/connect-native-pwa-parity-phase1.yml

permissions:
  contents: write

concurrency:
  group: connect-native-pwa-parity-1
  cancel-in-progress: false

jobs:
  integrate-and-check:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout full native repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Check latest native-only source tree
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B main origin/main
          test -s native/src/App.tsx
          test -s native/google-services.json
          test -s native/src/ConnectNativeGlass.tsx
          test ! -e app
          test -s native/package-lock.json

      - name: Restore and apply the checksum-verified PWA invitation changes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_RESTORE_INVITES'
          import subprocess, sys, textwrap
          from pathlib import Path

          # The earlier workflow succeeded in integrating invitations and typechecking,
          # but its separate Android build failed on upstream Gradle/Kotlin HTTP 504s.
          # Reuse the exact checksum-protected payload from our own pinned Git commit.
          old_commit='b7182318f6eba5e285e1d169f32abd03ed7cc7eb'
          old_path='.github/workflows/connect-native-pwa-parity-phase1.yml'
          original=subprocess.check_output(['git','show',f'{old_commit}:{old_path}'],text=True)
          start="          python3 - <<'PY_CONNECT_PARITY'\n"
          end="          PY_CONNECT_PARITY\n"
          if original.count(start)!=1 or original.count(end)!=1:
              raise SystemExit('Pinned invitation installer has changed format; aborting safely.')
          installer=textwrap.dedent(original.split(start,1)[1].split(end,1)[0])
          if not all(word in installer for word in ['assets=[','sha256(source).hexdigest()','connect-native-parity-apply.py']):
              raise SystemExit('Pinned installer integrity checks missing')
          path=Path('/tmp/connect-native-invitation-installer.py')
          path.write_text(installer)
          subprocess.run([sys.executable,str(path)],check=True)
          if not Path('native/src/ConnectNativeInvites.tsx').is_file():
              raise SystemExit('Invitation screen source not created')
          if 'ConnectNativeInvites' not in Path('native/src/App.tsx').read_text():
              raise SystemExit('Invitation UI not integrated in App')
          print('Invitation registration and admin invitation UI restored from verified source')
          PY_RESTORE_INVITES

      - name: Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: native/package-lock.json

      - name: Verify actual React Native TypeScript
        shell: bash
        working-directory: native
        env:
          CI: '1'
          EXPO_NO_TELEMETRY: '1'
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm run typecheck

      - name: Verify Expo Android project generation without downloading Gradle
        shell: bash
        working-directory: native
        env:
          CI: '1'
          EXPO_NO_TELEMETRY: '1'
        run: |
          set -euo pipefail
          npx expo prebuild --platform android --no-install --clean
          test -s android/app/build.gradle
          test -s android/app/google-services.json
          test -s android/gradlew
          echo 'Expo Android project generated; no external Gradle/Kotlin distribution required here.'

      - name: Save only validated invitation source changes
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git add -- native/src/App.tsx native/src/ConnectNativeInvites.tsx
          if git diff --cached --quiet; then
            echo 'PWA invitations already in Connect Native; no commit necessary.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(native): PWA invitation registration and admin invitation codes'
          git push origin HEAD:main

      - name: Summary - source integration, NOT a device-ready APK
        if: success()
        run: |
          {
            echo '### Connect Native: invitation registration integrated'
            echo '- User registration by invitation code uses the existing PWA API.'
            echo '- Admin invitation management uses the existing PWA API.'
            echo '- React Native TypeScript and Expo Android prebuild validated.'
            echo '- **Gradle/Android compilation was not performed in this workflow** because external Gradle/Kotlin services returned HTTP 504 repeatedly.'
            echo '- Compile and inspect the next QA APK using **Connect Native - Native-only Standalone Test APK** when downloads are available.'
            echo '- No WebView, Supabase, PWA or Firebase changes.'
          } >> "$GITHUB_STEP_SUMMARY"
