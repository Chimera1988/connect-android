name: Connect Android 3.0.1 — checked source release
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: connect-android-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    if: github.repository == 'Chimera1988/connect-android'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
      EXPO_PUBLIC_SUPABASE_URL: 'https://tpwkmoxxzjfdsqsomhhr.supabase.co'
      EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: 'sb_publishable_tAg8rPwuBNcA2iPF7voc2Q_vsKUpyZa'
      EXPO_PUBLIC_CONNECT_URL: 'https://connect-chat.duckdns.org'
      CONNECT_PREVIOUS_CERT_SHA256: ${{ vars.CONNECT_PREVIOUS_CERT_SHA256 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
      - name: Install Android SDK
        run: sdkmanager --channel=3 'platforms;android-37.0' 'build-tools;37.0.0' 'platform-tools'
      - name: Verify the checked-out 3.0.1 source, never reinstall an older embedded payload
        working-directory: native
        run: |
          set -euo pipefail
          node -e "const a=require('./app.json').expo;if(a.android.package!=='com.connect.messenger'||a.version!=='3.0.1'||a.android.versionCode!==19)throw Error('Incompatible source version')"
          npm ci --no-audit --no-fund
          node scripts/verify-builtin-sounds.cjs
          if ! command -v ffmpeg >/dev/null; then sudo apt-get update && sudo apt-get install -y ffmpeg; fi
          ffmpeg -v error -i assets/notification_sounds/connect_ringtone.mp3 -f null -
          ffmpeg -v error -i assets/notification_sounds/connect_notification.mp3 -f null -
          node scripts/generate-call-policy.cjs --check
          npm run typecheck
          npm run typecheck:web
          npm test -- --test-isolation=none
          CHROMIUM_PATH="$(command -v google-chrome || command -v chromium)" npm run test:browser
          npm run build:web
      - name: Restore original signing key if supplied
        env:
          CONNECT_RELEASE_KEYSTORE_BASE64: ${{ secrets.CONNECT_RELEASE_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [[ -n "$CONNECT_RELEASE_KEYSTORE_BASE64" ]]; then
            umask 077
            printf '%s' "$CONNECT_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/connect-release.jks"
            echo "CONNECT_RELEASE_KEYSTORE_FILE=$RUNNER_TEMP/connect-release.jks" >> "$GITHUB_ENV"
          else
            echo '::warning::Original production key unavailable. Debug signing fallback will be explicitly recorded. Match the previous certificate before installing.'
          fi
      - name: Generate the existing Android app and run all native checks
        working-directory: native
        env:
          CONNECT_RELEASE_STORE_PASSWORD: ${{ secrets.CONNECT_RELEASE_STORE_PASSWORD }}
          CONNECT_RELEASE_KEY_ALIAS: ${{ secrets.CONNECT_RELEASE_KEY_ALIAS }}
          CONNECT_RELEASE_KEY_PASSWORD: ${{ secrets.CONNECT_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          npx expo prebuild --platform android --no-install
          cd android
          chmod +x gradlew
          ./gradlew :app:testReleaseUnitTest :app:lintVitalRelease :app:assembleRelease -PreactNativeArchitectures=armeabi-v7a,arm64-v8a -Pkotlin.incremental=false --no-daemon --max-workers=2
      - name: Verify and package one final APK with source provenance
        working-directory: native
        run: |
          set -euo pipefail
          mkdir -p ../release/connect-301
          cp android/app/build/outputs/apk/release/app-release.apk ../release/connect-301/Connect.apk
          python3 scripts/verify-apk.py ../release/connect-301/Connect.apk ../release/connect-301
          git rev-parse HEAD > ../release/connect-301/SOURCE-COMMIT.txt
          git diff --binary > ../release/connect-301/GENERATED-SOURCE.patch
          cp SOUNDS_301_REPORT.md ../release/connect-301/
          cd ../release/connect-301
          zip -9 ../Connect-Android-3.0.1.zip ./*
      - uses: actions/upload-artifact@v4
        with:
          name: Connect-Android-3.0.1
          path: release/Connect-Android-3.0.1.zip
          if-no-files-found: error
          retention-days: 30
      - name: Remove temporary signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/connect-release.jks"
