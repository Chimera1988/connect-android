name: Connect FIX6 — final Android APK
on:
  workflow_dispatch:
  push:
    branches: [main, codex/connect-fix6-calls]
    paths: ['.github/workflows/connect-release.yml', '.github/workflows/connect-android-final-build.yml']
permissions:
  contents: write
concurrency:
  group: connect-fix6-android-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    if: github.repository == 'Chimera1988/connect-android'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
      EXPO_PUBLIC_SUPABASE_URL: 'https://tpwkmoxxzjfdsqsomhhr.supabase.co'
      EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: 'sb_publishable_tAg8rPwuBNcA2iPF7voc2Q_vsKUpyZa'
      EXPO_PUBLIC_CONNECT_URL: 'https://connect-chat.duckdns.org'
      CONNECT_RELEASE_STORE_PASSWORD: ${{ secrets.CONNECT_RELEASE_STORE_PASSWORD }}
      CONNECT_RELEASE_KEY_ALIAS: ${{ secrets.CONNECT_RELEASE_KEY_ALIAS }}
      CONNECT_RELEASE_KEY_PASSWORD: ${{ secrets.CONNECT_RELEASE_KEY_PASSWORD }}
      CONNECT_PREVIOUS_CERT_SHA256: ${{ vars.CONNECT_PREVIOUS_CERT_SHA256 }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply guarded final source package
        run: |
          python3 - <<'CONNECT_PACKAGE'
          import base64,gzip,hashlib,json,os,pathlib,urllib.request,time
          root=pathlib.Path.cwd().resolve()
          workflow_ref=os.environ['GITHUB_WORKFLOW_REF']
          relative='.github/workflows/'+workflow_ref.split('/.github/workflows/',1)[1].rsplit('@',1)[0]
          source=(root/relative).read_text()
          block=source.split('# CONNECT_SOURCE_BUNDLE_BEGIN\n',1)[1].split('# CONNECT_SOURCE_BUNDLE_END',1)[0]
          encoded=''.join(line.removeprefix('# ')for line in block.splitlines())
          packed=base64.b64decode(encoded)
          assert hashlib.sha256(packed).hexdigest()=="5c21cde275e22da6dda0373f98b089593351b8aef48475ab293d051e22771f63", 'Embedded package checksum mismatch'
          payload=json.loads(gzip.decompress(packed))
          def target(name):
           path=root/name
           if any(p.is_symlink() for p in [path,*path.parents] if p.is_relative_to(root)):raise SystemExit('Symlink source path: '+name)
           path=path.resolve()
           if not path.is_relative_to(root):raise SystemExit('Unsafe package path')
           if path.exists() and not path.is_file():raise SystemExit('Expected source file: '+name)
           return path
          def sha(path):return hashlib.sha256(path.read_bytes()).hexdigest() if path.is_file() else None
          def decode(value):return base64.b64decode(value['binary'])if isinstance(value,dict)else value.encode('utf-8')
          # Validate the COMPLETE affected source state before writing anything.
          for name,digest in payload['unchanged'].items():
           if sha(target(name))!=digest:raise SystemExit('Incompatible prerequisite: '+name)
          for name,value in payload['files'].items():
           path=target(name);old=sha(path);new=hashlib.sha256(decode(value)).hexdigest()
           if old is not None and old!=new and old not in payload['before'].get(name,[]):raise SystemExit('Source drift: '+name)
          for name,allowed in payload['delete'].items():
           old=sha(target(name))
           if old is not None and old not in allowed:raise SystemExit('Deletion source drift: '+name)
          for item in payload['downloads']:
           old=sha(target(item['path']))
           if old is not None and old!=item['sha256']:raise SystemExit('Asset source drift: '+item['path'])
          # Stage and verify every external immutable asset before committing changes.
          staged={}
          for item in payload['downloads']:
           if sha(target(item['path']))==item['sha256']:continue
           for attempt in range(3):
            try:
             with urllib.request.urlopen(item['url'],timeout=30) as response:content=response.read()
             assert hashlib.sha256(content).hexdigest()==item['sha256'], 'Pinned asset checksum mismatch'
             staged[item['path']]=content;break
            except Exception:
             if attempt==2:raise
             time.sleep(attempt+1)
          for name,value in payload['files'].items():staged[name]=decode(value)
          for name,content in staged.items():
           path=target(name);path.parent.mkdir(parents=True,exist_ok=True);path.write_bytes(content)
          for name in payload['delete']:target(name).unlink(missing_ok=True)
          print('Verified source package: '+str(len(payload['files']))+' changes, '+str(len(payload['downloads']))+' pinned assets')
          CONNECT_PACKAGE
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
      - name: Install Android SDK
        run: sdkmanager --channel=3 'platforms;android-37.0' 'build-tools;37.0.0' 'platform-tools'
      - name: Verify native and shared source
        working-directory: native
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm run typecheck
          npm run typecheck:web
          npm test
          npm run build:web
      - name: Restore original signing key if supplied
        env:
          CONNECT_RELEASE_KEYSTORE_BASE64: ${{ secrets.CONNECT_RELEASE_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [[ -n "$CONNECT_RELEASE_KEYSTORE_BASE64" ]]; then
            umask 077
            printf '%s' "$CONNECT_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/connect-release.jks"
            echo "CONNECT_RELEASE_KEYSTORE_FILE=$RUNNER_TEMP/connect-release.jks" >> "$GITHUB_ENV"
          else
            echo '::warning::Original release key unavailable: Android Debug signing fallback. No production-signature compatibility claim.'
          fi
      - name: Generate Android from the existing app and plugins
        working-directory: native
        run: npx expo prebuild --platform android --no-install
      - name: Compile, run SQLite/call JVM tests, lint, build one release APK
        working-directory: native/android
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew :app:testReleaseUnitTest :app:lintVitalRelease :app:assembleRelease -PreactNativeArchitectures=armeabi-v7a,arm64-v8a --no-daemon --max-workers=2
      - name: Verify Connect.apk
        working-directory: native
        run: |
          set -euo pipefail
          mkdir -p ../release/fix6
          cp android/app/build/outputs/apk/release/app-release.apk ../release/fix6/Connect.apk
          python3 scripts/verify-apk.py ../release/fix6/Connect.apk ../release/fix6
          if [[ -f FIX6_RELEASE_REPORT.md ]]; then cp FIX6_RELEASE_REPORT.md ../release/fix6/; fi
          cd ../release/fix6
          zip -9 ../../Connect-Android-Final.zip Connect.apk APK-VERIFICATION.json SHA256.txt
      - name: Save checked source if GitHub permits
        run: |
          set -euo pipefail
          git add native
          git diff --cached --binary > release/fix6/SOURCE.patch
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Restore native call ownership and port FIX6 to Connect 2.2.3'
            if ! git push origin "HEAD:$GITHUB_REF_NAME"; then echo '::warning::Source push denied; checked patch is in artifact.'; fi
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: Connect-Android-Final
          path: release/fix6/
          if-no-files-found: error
          retention-days: 30
      - name: Remove temporary signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/connect-release.jks"

