name: Connect Android 3.0.1 — restore verified sounds and release
'on':
  push:
    branches: [main]
    paths: ['.github/workflows/connect-android-final-build.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: connect-android-301-sound-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    if: github.repository == 'Chimera1988/connect-android'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
      EXPO_PUBLIC_SUPABASE_URL: 'https://tpwkmoxxzjfdsqsomhhr.supabase.co'
      EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: 'sb_publishable_tAg8rPwuBNcA2iPF7voc2Q_vsKUpyZa'
      EXPO_PUBLIC_CONNECT_URL: 'https://connect-chat.duckdns.org'
      CONNECT_PREVIOUS_CERT_SHA256: ${{ vars.CONNECT_PREVIOUS_CERT_SHA256 }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply exact Codex 3.0.1 patch to Android source (idempotent)
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'CONNECT301_VERIFY_AND_PATCH'
          import base64, gzip, hashlib, json, re, subprocess
          from pathlib import Path
          base = '806507733e4f3d62331f74475b5b3090e6d0195a'
          sources = [
              (Path('.github/workflows/connect-android-final-build.yml'), '# CONNECT301_PATCH_PART1_BEGIN\n', '# CONNECT301_PATCH_PART1_END\n'),
              (Path('.github/workflows/connect-android-301-payload.yml'), '# CONNECT301_PATCH_PART2_BEGIN\n', '# CONNECT301_PATCH_PART2_END\n'),
          ]
          encoded_parts = []
          for file, begin, end in sources:
              source = file.read_text(encoding='utf-8')
              assert source.count(begin) == 1 and source.count(end) == 1, 'Missing/duplicated payload fragment in '+str(file)
              lines = source.split(begin, 1)[1].split(end, 1)[0].splitlines()
              assert lines and all(line.startswith('# ') for line in lines), 'Invalid payload fragment in '+str(file)
              encoded_parts.append(''.join(line[2:] for line in lines))
          packed = base64.b64decode(''.join(encoded_parts), validate=True)
          assert hashlib.sha256(packed).hexdigest() == '9113dd55a241fc83d3f4037bb0641c30c3a072cbd5c128da643184f0c8d310a6', 'Compressed patch checksum mismatch'
          patch = gzip.decompress(packed)
          assert hashlib.sha256(patch).hexdigest() == 'baca3b35e911e9d280aeb2e67b3ccf5b50522d610b22dc7b38fcd6d06e87ae1c', 'Source patch checksum mismatch'
          files = [a.decode() for a,b in re.findall(rb'^diff --git a/(\S+) b/(\S+)$',patch,re.M)]
          expected = {"native/SOUNDS_301_REPORT.md": "ecc0a8c0a87a9cbc4c928951fe45cfcf4f76e9b527d978bc18033096ccf1d616", "native/app.json": "2fba27235649090ea2eb376032c41e5c758d3d8be2299f46736fc101f6d231ca", "native/assets/notification_sounds/connect_notification.mp3": "8bf5b905ca973d7f38d84feaa4237d2246b10f5e186fb280f14781c05d70622e", "native/assets/notification_sounds/connect_ringtone.mp3": "974d3a6817676687c04fbce6568b238e31d8a30206fc0e5fe35cfbee9bf6025c", "native/package-lock.json": "61335b57ab012e831876538579fdb015c7416e1559fb4e37f059208bce5932ad", "native/package.json": "3715bca3727359dbb3c5017511dd8464d234bf19e2ac69fd68af2d8e1ce86015", "native/plugins/telecom-tests/ConnectSoundResourcesTest.kt": "ebfcfd88c05461849ed3f78c90dab0382ec3df439028f6fd632a7334033d2bf8", "native/plugins/telecom/ConnectCallAudio.kt": "ad4454ac3e639ae27a66e63bf201116c3ec9b2d0b4e736112ff6e4c095cfc256", "native/plugins/withConnectBuiltinSounds.js": "296fb802a5f67ec76db8982b0d938db514f6abd97335d24de610a832b27f6cec", "native/plugins/withConnectSounds.js": "5b8372442f7c9a867b111c007a46fe4ff051bb00538d40f5d22dfb09a693912b", "native/scripts/verify-apk.py": "518834337f17d171b32adc6191fa9115418f9e211ae00a55ba3517119a4dca16", "native/scripts/verify-builtin-sounds.cjs": "65c13bbb426757fb08947d0420bb7be284939a052b825544f0a599068e381696", "native/src/App.tsx": "f34937ffa065dff8ea19d6bdaa6b5d645e98b042672ee768268c41992ff8371c", "native/src/ConnectNativePush.ts": "9307953f906ab7f7ce2e1e6cfce8d7060c83351b58199a469caa7b83e9ada131", "native/src/ConnectNativeSettings.tsx": "7f0723d89443241a9573920fceaaa1db4a93f374c345737ee8aface2d17fc938", "native/src/ConnectNativeSoundSettings.tsx": "c2dcf0cdc9f17a3f1310beb488f962e8bd769fffcd494861d2c6553e49125d9a", "native/src/hybridMigration.ts": "12fe6b2c80300d9210f4ca679aef040afa0012e142dec38031290e65fdfa1be9", "native/src/hybridProtocol.ts": "4b4865d0b6afc827628c552fbfe8ab2466980490f124fc99c938da58a3276ab3", "native/tests/browser-cache.tsx": "3c8bf18fe1997bc08f4f3c95a27a7cfc8ef0aa07b9f9de8ebd760e58c00fc5e7", "native/tests/call-sounds.test.cjs": "c84a334b212b2acb03ec13cb2f81d80628020fc9075c3cfde5dd4d069e91a817", "native/tests/hybrid-protocol.test.cjs": "1d7ea7e740a1d02fc31d6510a61c1a11750974b7357579f345f4043767c43fab", "native/tests/push-read-sync.test.cjs": "8f156825461ac106ade3f47acc863a088cb2fe7ad635ae0d66e541402db6358f", "native/tests/release-config.test.cjs": "41355c62656d0f313e324315c6eef83e010ff32ccd5e9a5dba227afae2377a22", "native/web/components/ConnectNotificationSettings.tsx": "104c2cccf6e4003a672572abcf66d94802290754ab705287b1aac761ae2ff2e0", "native/web/lib/android-sound-policy.ts": "eaa40aa4e619f60df61ebb116bf79293558661178ba8be9e2b24d78f22e1703d"}
          assert len(files) == len(expected) and set(files) == set(expected), 'Unrecognized or out-of-scope patched paths'
          assert all(f.startswith('native/') for f in files), 'Patch would modify a workflow or PWA'
          def run(*args):
              subprocess.run(args,check=True)
          def sha(path):
              p = Path(path)
              return hashlib.sha256(p.read_bytes()).hexdigest() if p.is_file() else None
          cfg = json.loads(Path('native/app.json').read_text())['expo']
          version = (cfg.get('version'),cfg.get('android',{}).get('versionCode'),cfg.get('android',{}).get('package'))
          if version == ('3.0.0',18,'com.connect.messenger'):
              run('git','merge-base','--is-ancestor',base,'HEAD')
              run('git','diff','--quiet',base,'HEAD','--','native')
              tmp = Path('/tmp/connect-android-301.patch')
              tmp.write_bytes(patch)
              run('git','apply','--binary','--check',str(tmp))
              run('git','apply','--binary',str(tmp))
              print('Applied verified Android 3.0.1 (19) patch over unchanged 3.0.0 (18) source')
          elif version == ('3.0.1',19,'com.connect.messenger'):
              print('Android 3.0.1 is already installed; verifying all 25 files')
          else:
              raise SystemExit('Unexpected Android source version; refusing to overwrite working files: '+repr(version))
          failures = [path for path,digest in expected.items() if sha(path) != digest]
          if failures:
              raise SystemExit('Patched sources fail SHA-256 verification: '+repr(failures))
          print('Verified all',len(expected),'Android 3.0.1 source files, including original MP3s')
          CONNECT301_VERIFY_AND_PATCH
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
      - name: Install Android SDK
        run: sdkmanager --channel=3 'platforms;android-37.0' 'build-tools;37.0.0' 'platform-tools'
      - name: Verify, test and generate embedded PWA before native typecheck
        working-directory: native
        shell: bash
        run: |
          set -euo pipefail
          node -e "const a=require('./app.json').expo;if(a.android.package!=='com.connect.messenger'||a.version!=='3.0.1'||a.android.versionCode!==19)throw Error('Incompatible source version')"
          npm ci --no-audit --no-fund
          node scripts/verify-builtin-sounds.cjs
          if ! command -v ffmpeg >/dev/null; then sudo apt-get update && sudo apt-get install -y ffmpeg; fi
          ffmpeg -v error -i assets/notification_sounds/connect_ringtone.mp3 -f null -
          ffmpeg -v error -i assets/notification_sounds/connect_notification.mp3 -f null -
          node scripts/generate-call-policy.cjs --check
          npm run build:web
          npm run typecheck
          npm run typecheck:web
          npm test -- --test-isolation=none
          CHROMIUM_PATH="$(command -v google-chrome || command -v chromium)" npm run test:browser
      - name: Restore existing signing certificate, if configured
        env:
          CONNECT_RELEASE_KEYSTORE_BASE64: ${{ secrets.CONNECT_RELEASE_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "$CONNECT_RELEASE_KEYSTORE_BASE64" ]]; then
            umask 077
            printf '%s' "$CONNECT_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/connect-release.jks"
            echo "CONNECT_RELEASE_KEYSTORE_FILE=$RUNNER_TEMP/connect-release.jks" >> "$GITHUB_ENV"
          else
            echo '::warning::Production signing material unavailable; verify existing debug fallback certificate before installing the new APK.'
          fi
      - name: Build and check release APK
        working-directory: native
        shell: bash
        env:
          CONNECT_RELEASE_STORE_PASSWORD: ${{ secrets.CONNECT_RELEASE_STORE_PASSWORD }}
          CONNECT_RELEASE_KEY_ALIAS: ${{ secrets.CONNECT_RELEASE_KEY_ALIAS }}
          CONNECT_RELEASE_KEY_PASSWORD: ${{ secrets.CONNECT_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          npx expo prebuild --platform android --no-install
          cd android
          chmod +x gradlew
          ./gradlew :app:testReleaseUnitTest :app:lintVitalRelease :app:assembleRelease -PreactNativeArchitectures=armeabi-v7a,arm64-v8a -Pkotlin.incremental=false --no-daemon --max-workers=2
      - name: Commit only verified native sources back to main
        shell: bash
        run: |
          set -euo pipefail
          git add -A -- native
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Save verified Connect Android 3.0.1 sounds and source [skip ci]'
            git push origin "HEAD:${GITHUB_REF_NAME}"
          else
            echo 'Android 3.0.1 sources already committed; no changes needed.'
          fi
          test "$(node -p "require('./native/app.json').expo.version")" = '3.0.1'
      - name: Verify and package final APK
        shell: bash
        working-directory: native
        run: |
          set -euo pipefail
          mkdir -p ../release/connect-301
          cp android/app/build/outputs/apk/release/app-release.apk ../release/connect-301/Connect.apk
          python3 scripts/verify-apk.py ../release/connect-301/Connect.apk ../release/connect-301
          git rev-parse HEAD > ../release/connect-301/SOURCE-COMMIT.txt
          sha256sum ../release/connect-301/Connect.apk > ../release/connect-301/SHA256.txt
          cp SOUNDS_301_REPORT.md ../release/connect-301/
          cd ../release/connect-301
          zip -9 ../Connect-Android-3.0.1.zip ./*
      - uses: actions/upload-artifact@v4
        with:
          name: Connect-Android-3.0.1
          path: release/Connect-Android-3.0.1.zip
          if-no-files-found: error
          retention-days: 30
      - name: Remove temporary signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/connect-release.jks"


