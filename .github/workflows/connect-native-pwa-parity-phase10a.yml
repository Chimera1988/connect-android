# Phase 10A corrective patch, NOT an APK release.
name: Connect Native - Phase 10A (parity corrections, NO APK)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/connect-native-pwa-parity-phase10a.yml

permissions:
  contents: write

concurrency:
  group: connect-native-phase10a
  cancel-in-progress: false

jobs:
  parity-fixes:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout current Connect Native sources
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

