      - name: Validate TypeScript (NO Gradle or APK)
        working-directory: native
        shell: bash
        env:
          CI: '1'
          EXPO_NO_TELEMETRY: '1'
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm run typecheck

      - name: Commit verified source edits
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git add -- native/src/ConnectNativeChat.tsx native/src/ConnectNativeMedia.tsx native/src/ConnectNativeMusic.tsx native/src/App.tsx
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(native): search navigation, profile-media avatar, movable mini-player'
          git push origin HEAD:main

      - name: Summary and release barrier
        if: success()
        shell: bash
        run: |
          {
            echo '### Connect Native - phase 10A (NO APK)'
            echo '- Real parity fixes: chat search with highlighted hits/navigation; avatar from media; movable music mini-player.'
            echo '- Compilation confirms TypeScript only, not Android behavior.'
            echo '- Still outstanding: recovery deep links, JSON file export, media downloads and further QA.'
            echo '- Device validation 0/199; APK release gate stays closed.'
          } >> "$GITHUB_STEP_SUMMARY"
