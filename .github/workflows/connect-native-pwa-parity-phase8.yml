              dest=Path(path)
              dest.parent.mkdir(parents=True,exist_ok=True)
              dest.write_bytes(data)
          
          app_path=base/'App.tsx'
          app=app_path.read_text(encoding='utf-8')
          def patch_once(body,needle,insert,title):
              count=body.count(needle)
              if count!=1:
                  raise SystemExit(f'Cannot safely patch {title}: anchor count {count}, expected 1')
              return body.replace(needle,insert,1)
          
          if 'useConnectNativeMissedCalls' not in app:
              app=patch_once(app,
                  "import ConnectNativeCalls from './ConnectNativeCalls';",
                  "import ConnectNativeCalls from './ConnectNativeCalls';\nimport {useConnectNativeMissedCalls} from './ConnectNativeMissedCalls';",
                  'missed-calls import')
              app=patch_once(app,
                  "  const ownId=session?.user.id||'';",
                  "  const ownId=session?.user.id||'';\n  const missedCalls=useConnectNativeMissedCalls(ownId,tab==='calls'&&screen.kind==='tab');",
