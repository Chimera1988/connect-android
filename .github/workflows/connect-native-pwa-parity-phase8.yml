# Connect Native phase 8/10: audio calls and call journal. NO APK.
name: Connect Native - PWA parity phase 8 (audio calls and journal)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/connect-native-pwa-parity-phase8.yml

permissions:
  contents: write

concurrency:
  group: connect-native-pwa-parity-phase8
  cancel-in-progress: false

jobs:
  audio-calls-parity:
    name: Audio-only dialing, realtime journal, missed badge (NO APK)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout latest Connect Native
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Verify build gate then integrate phase 8
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B main origin/main
          python3 - <<'PY_GATE'
          from pathlib import Path
          path=Path('.github/workflows/android-apk.yml')
          if not path.is_file(): raise SystemExit('Missing retired legacy APK workflow')
          source=path.read_text(encoding='utf-8')
          if '  push:' in source or 'gradle --no-daemon' in source or 'assembleDebug' in source or 'assembleRelease' in source:
              raise SystemExit('STOP: automatic legacy APK build is still enabled')
          print('APK build remains disabled; proceeding with source-only phase 8')
          PY_GATE
          python3 - <<'PY_PHASE8'
          from pathlib import Path
          import base64, gzip, hashlib
          base=Path('native/src')
          if not base.joinpath('ConnectNativeCalls.tsx').is_file() or not base.joinpath('ConnectNativeVoice.tsx').is_file():
              raise SystemExit('Native calls foundation missing; check repository state')
          if not base.joinpath('ConnectNativeMusic.tsx').is_file():
