              app=patch_once(app,anchor,new,'missed-calls navigation badge')
          else:
              if "const missedCalls=useConnectNativeMissedCalls" not in app or "which==='calls'&&missedCalls.count" not in app:
                  raise SystemExit('Partial phase 8 integration found; refusing to overwrite App.tsx')
          app_path.write_text(app,encoding='utf-8')
          print('Phase 8 sources installed, audio only. No APK/Gradle executed.')
          PY_PHASE8
          git diff --check

      - name: Node.js for Expo 58
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: native/package-lock.json

      - name: TypeScript check only (no Gradle, no APK)
        working-directory: native
        shell: bash
        env:
          CI: '1'
          EXPO_NO_TELEMETRY: '1'
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm run typecheck

      - name: Commit phase 8 sources after TypeScript success
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git add -- native/src/ConnectNativeCalls.tsx native/src/ConnectNativeMissedCalls.ts native/src/App.tsx
          if git diff --cached --quiet; then
            echo 'Phase 8 already installed; nothing to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(native): PWA audio call picker, realtime journal and missed badge'
          git push origin HEAD:main

      - name: Phase 8 summary
        if: success()
        shell: bash
        run: |
          {
            echo '### Connect Native Phase 8 of 10 — AUDIO ONLY'
            echo '- New outgoing call picker searches unblocked contacts.'
            echo '- New conversation is created when calling a contact for the first time.'
            echo '- One-tap call-back in journal; WebRTC/Telecom remains native.'
            echo '- PWA-compatible missed/declined/busy/failed/duration status labels.'
            echo '- Realtime journal changes and fallback refresh; clear/select/remove local history.'
            echo '- Unseen missed call badge across tabs, persisted on device per account.'
            echo '- Expo TypeScript verified; NO APK, Gradle, or emulator build performed.'
          } >> "$GITHUB_STEP_SUMMARY"
