name: Connect Native - Android push notifications and validation
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/install-connect-native-push.yml'
permissions:
  contents: write
concurrency:
  group: install-connect-native-push
  cancel-in-progress: false
jobs:
  install-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout connect-android
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK without removed legacy tools package
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - name: Inject fixed modular FCM source without touching old APK
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64, zlib, json

          # Exact reviewed React Native Firebase modular FCM module.
          source = zlib.decompress(base64.b64decode('')).decode('utf-8')
          base = Path('native')
          module = base / 'src/ConnectNativePush.ts'
          if not (base/'src/App.tsx').exists() or not (base/'app.json').exists():
              raise RuntimeError('Native v2 foundation not found')
          if module.exists() and module.read_text(encoding='utf-8') != source:
              raise RuntimeError('ConnectNativePush.ts was manually modified; refusing to overwrite')
          module.write_text(source, encoding='utf-8')

          def once(s, old, new, label):
              if old in s:
                  if s.count(old)!=1:raise RuntimeError(label+': expected one match')
                  return s.replace(old,new,1)
              if new in s:
                  print('Already installed:',label)
                  return s
              raise RuntimeError(label+': current source not recognized; refusing unsafe patch')

          entry=base/'index.js'
          s=entry.read_text(encoding='utf-8')
          s=once(s,"import App from './src/App';","import App from './src/App';\nimport { installNativePushBackgroundHandlers } from './src/ConnectNativePush';\ninstallNativePushBackgroundHandlers();",'native FCM entrypoint')
          entry.write_text(s, encoding='utf-8')

          app=base/'src/App.tsx'
          s=app.read_text(encoding='utf-8')
          s=once(s,"import type { MediaKind } from './nativeMediaUtils';","import type { MediaKind } from './nativeMediaUtils';\nimport {subscribeNativePush,disableNativePush,dismissChatPush,setVisibleConversation,type NativePushDestination} from './ConnectNativePush';",'native notification imports')
          s=once(s,"  const [notice,setNotice]=useState('');","  const [notice,setNotice]=useState('');\n  const [pushDestination,setPushDestination]=useState<NativePushDestination|null>(null);",'push navigation state')
          s=once(s,"  const chats=useMemo(()=>conversations.map(c=>", "  useEffect(()=>{\n    if(!ownId)return;\n    return subscribeNativePush(ownId,setPushDestination,setNotice);\n  },[ownId]);\n  useEffect(()=>{\n    if(!pushDestination||!ownId)return;\n    if(pushDestination.kind==='call'){\n      setScreen({kind:'tab'});setTab('calls');\n      setNotice('Поступил звонок. Нативное соединение WebRTC ещё в разработке.');\n      setPushDestination(null);return;\n    }\n    const chat=conversations.find(c=>c.id===pushDestination.conversationId);\n    if(!chat)return;\n    const peerId=chat.user_a===ownId?chat.user_b:chat.user_a;\n    const peer=profiles.find(p=>p.id===peerId);\n    if(!peer)return;\n    setScreen({kind:'chat',conversation:chat,peer});setTab('chats');setPushDestination(null);\n    void dismissChatPush(chat.id);\n  },[pushDestination,ownId,conversations,profiles]);\n  useEffect(()=>{\n    if(screen.kind==='chat')void dismissChatPush(screen.conversation.id);\n  },[screen]);\n\n  const chats=useMemo(()=>conversations.map(c=>",'native notification navigation')
          s=once(s,"  async function logout(){await db.auth.signOut();setScreen({kind:'tab'});setTab('chats');}","  async function logout(){await disableNativePush();await db.auth.signOut();setScreen({kind:'tab'});setTab('chats');}",'FCM unregister on logout')
          app.write_text(s, encoding='utf-8')

          config_file=base/'app.json'
          cfg=json.loads(config_file.read_text(encoding='utf-8'))
          android=cfg['expo']['android']
          if android.get('package') not in ('com.connect.messenger.native','com.connect.messenger'):
              raise RuntimeError('Unexpected Android package name')
          android['package']='com.connect.messenger'
          android['versionCode']=max(8,int(android.get('versionCode',1)))
          android['googleServicesFile']='../app/google-services.json'
          permissions=android.setdefault('permissions',[])
          for permission in ('INTERNET','POST_NOTIFICATIONS'):
              if permission not in permissions:permissions.append(permission)
          plugins=cfg['expo'].setdefault('plugins',[])
          for plugin in ('@react-native-firebase/app','@react-native-firebase/messaging','@notifee/react-native'):
              if plugin not in plugins:plugins.append(plugin)
          config_file.write_text(json.dumps(cfg,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          pkg_file=base/'package.json'
          pkg=json.loads(pkg_file.read_text(encoding='utf-8'))
          deps=pkg.setdefault('dependencies',{})
          for k,v in {'@react-native-firebase/app':'27.1.0','@react-native-firebase/messaging':'27.1.0','@notifee/react-native':'9.1.8'}.items():
              if k in deps and deps[k]!=v:raise RuntimeError(f'Unexpected {k} dependency version: {deps[k]}')
              deps[k]=v
          pkg_file.write_text(json.dumps(pkg,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          readme=base/'README.md'
          s=readme.read_text(encoding='utf-8')
          addition="""
          ## Native FCM notifications (source integration)
          - Authenticated registration and removal of device tokens with Connect server.
          - Native Android channels for messages and calls; data-only FCM handling and tap navigation.
          - Uses existing Firebase app `com.connect.messenger` for future release only; do not install over WebView APK until fully tested and signed.
          - WebRTC, Telecom, native incoming-call UI and lock-screen call acceptance are not implemented by this workflow.
          """
          if '## Native FCM notifications' not in s:readme.write_text(s+addition,encoding='utf-8')
          print('Connect Native push source injected with modular Firebase API; old APK untouched.')
          PY
      - name: Resolve native dependencies and validate TypeScript
        working-directory: native
        shell: bash
        env:
          CI: '1'
          EXPO_NO_TELEMETRY: '1'
        run: |
          npm install --no-audit --no-fund
          npm run typecheck
      - name: Validate native Android generation
        working-directory: native
        shell: bash
        env:
          CI: '1'
          EXPO_NO_TELEMETRY: '1'
        run: |
          npx expo prebuild --platform android --no-install --clean
          # This is the native Expo app, never the old app/ WebView build.
          grep -q 'com.connect.messenger' android/app/build.gradle || (echo 'Unexpected Android app ID' >&2; exit 1)
          test -s android/app/google-services.json
      - name: Build native Android client for CI validation
        working-directory: native
        shell: bash
        env:
          CI: '1'
          EXPO_NO_TELEMETRY: '1'
        run: |
          sdkmanager 'platforms;android-37' 'build-tools;37.0.0' 'platform-tools'
          cd android
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon --stacktrace
      - name: Commit native source only if every validation succeeds
        shell: bash
        run: |
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add native/src/ConnectNativePush.ts native/src/App.tsx native/index.js native/app.json native/package.json native/package-lock.json native/README.md
          if git diff --cached --quiet; then
            echo 'Native FCM already installed.'
            exit 0
          fi
          git commit -m 'feat(native): integrate modular Firebase notifications and validate Android build'
          git push origin HEAD:main
