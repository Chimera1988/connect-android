name: Connect Native - Android push notifications and validation
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/install-connect-native-push.yml'

permissions:
  contents: write
concurrency:
  group: install-connect-native-push
  cancel-in-progress: false

jobs:
  install-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout connect-android
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK (without removed legacy tools package)
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - name: Install native FCM modules and keep WebView APK unchanged
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64, zlib, json

          # The GitHub workflow injects this compressed source (not a user-defined dynamic command).
          source = zlib.decompress(base64.b64decode('')).decode('utf-8')
          base = Path('native')
          module = base/'src/ConnectNativePush.ts'
          if not (base/'src/App.tsx').exists() or not (base/'app.json').exists():
              raise RuntimeError('Native v2 source not found; install previous native workflows first')
          if module.exists() and module.read_text(encoding='utf-8') != source:
              raise RuntimeError('Push module already modified manually; will not overwrite')
          module.write_text(source, encoding='utf-8')

          def once(source: str, old: str, new: str, label: str):
              if old in source:
                  if source.count(old) != 1:
                      raise RuntimeError(f'{label}: expected one match; found {source.count(old)}')
                  return source.replace(old, new, 1)
              if new in source:
                  print('Already installed:', label)
                  return source
              raise RuntimeError(f'{label}: source changed; refusing an unsafe edit')

          entry = base/'index.js'
          s = entry.read_text(encoding='utf-8')
          s = once(s, "import App from './src/App';", "import App from './src/App';\nimport { installNativePushBackgroundHandlers } from './src/ConnectNativePush';\ninstallNativePushBackgroundHandlers();", 'native push entrypoint')
          entry.write_text(s, encoding='utf-8')

          app = base/'src/App.tsx'
          s = app.read_text(encoding='utf-8')
          s = once(s, "import type { MediaKind } from './nativeMediaUtils';", "import type { MediaKind } from './nativeMediaUtils';\nimport {subscribeNativePush,disableNativePush,dismissChatPush,setVisibleConversation,type NativePushDestination} from './ConnectNativePush';", 'push imports')
          s = once(s,"  const [notice,setNotice]=useState('');", "  const [notice,setNotice]=useState('');\n  const [pushDestination,setPushDestination]=useState<NativePushDestination|null>(null);", 'push navigation state')
          s = once(s,"  const chats=useMemo(()=>conversations.map(c=>", "  useEffect(()=>{\n    if(!ownId)return;\n    return subscribeNativePush(ownId,setPushDestination,setNotice);\n  },[ownId]);\n  useEffect(()=>{\n    if(!pushDestination||!ownId)return;\n    if(pushDestination.kind==='call'){\n      setScreen({kind:'tab'});setTab('calls');\n      setNotice('Поступил звонок. Нативное соединение WebRTC ещё в разработке.');\n      setPushDestination(null);return;\n    }\n    const chat=conversations.find(c=>c.id===pushDestination.conversationId);\n    if(!chat)return;\n    const peerId=chat.user_a===ownId?chat.user_b:chat.user_a;\n    const peer=profiles.find(p=>p.id===peerId);\n    if(!peer)return;\n    setScreen({kind:'chat',conversation:chat,peer});setTab('chats');setPushDestination(null);\n    void dismissChatPush(chat.id);\n  },[pushDestination,ownId,conversations,profiles]);\n  useEffect(()=>{\n    if(screen.kind==='chat')void dismissChatPush(screen.conversation.id);\n  },[screen]);\n\n  const chats=useMemo(()=>conversations.map(c=>", 'native notification navigation')
          s = once(s,"  async function logout(){await db.auth.signOut();setScreen({kind:'tab'});setTab('chats');}", "  async function logout(){await disableNativePush();await db.auth.signOut();setScreen({kind:'tab'});setTab('chats');}", 'unregister push on sign-out')
          app.write_text(s, encoding='utf-8')

          config_file=base/'app.json'
          cfg=json.loads(config_file.read_text(encoding='utf-8'))
          expo=cfg['expo']
          android=expo['android']
          # Reuse the existing com.connect.messenger Firebase app registration. This is
          # source for the future final APK; never auto-install over the current working APK.
          old=android.get('package')
          if old not in ('com.connect.messenger.native','com.connect.messenger'):
              raise RuntimeError(f'Unexpected package name: {old}')
          android['package']='com.connect.messenger'
          android['versionCode']=max(8,int(android.get('versionCode',1)))
          android['googleServicesFile']='../app/google-services.json'
          permission=android.setdefault('permissions',[])
          for p in ('INTERNET','POST_NOTIFICATIONS'):
              if p not in permission:permission.append(p)
          plugins=expo.setdefault('plugins',[])
          for p in ('@react-native-firebase/app','@react-native-firebase/messaging','@notifee/react-native'):
              if p not in plugins:plugins.append(p)
          config_file.write_text(json.dumps(cfg,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          pkg_file=base/'package.json'
          pkg=json.loads(pkg_file.read_text(encoding='utf-8'))
          deps=pkg.setdefault('dependencies',{})
          for k,v in {
              '@react-native-firebase/app':'27.1.0',
              '@react-native-firebase/messaging':'27.1.0',
              '@notifee/react-native':'9.1.8',
          }.items():
              if k in deps and deps[k]!=v:raise RuntimeError(f'Unexpected {k} version: {deps[k]}')
              deps[k]=v
          pkg_file.write_text(json.dumps(pkg,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          readme=base/'README.md'
          s=readme.read_text(encoding='utf-8')
          addition='''
          ## Native FCM notifications (source integration)
          - A signed-in user registers their FCM token via the existing authenticated `/api/push/register` endpoint, and unregisters on logout.
          - Android channels for messages and calls, data-only FCM background and foreground handling, cancellation on read/call-ended events, and notification tap navigation.
          - The same Firebase Android application package `com.connect.messenger` is used as the existing configuration in `app/google-services.json`. This is a future replacement APK, not a side-by-side install. **Do not install it over the existing APK until it is tested and release-signed**.
          - This does **not** yet implement WebRTC audio, the native incoming call accept/decline screen, Android Telecom, full-screen lock-screen handling, or real-device call routing. A call notification opens the Calls section but cannot accept the call yet.
          - Channels follow Android system notification and silent-mode settings; user-selected custom ringtone settings are a separate integration.
          '''
          if '## Native FCM notifications' not in s:readme.write_text(s+addition,encoding='utf-8')
          print('Connect Native: FCM setup prepared without changing old app/')
          PY
      - name: Resolve native dependencies and check TypeScript
        working-directory: native
        shell: bash
        env:
          CI: '1'
          EXPO_NO_TELEMETRY: '1'
        run: |
          npm install --no-audit --no-fund
          npm run typecheck
      - name: Validate native Android generation
        working-directory: native
        shell: bash
        env:
          CI: '1'
          EXPO_NO_TELEMETRY: '1'
        run: |
          npx expo prebuild --platform android --no-install --clean
          grep -q 'com.connect.messenger' android/app/build.gradle || (echo 'Wrong Android app ID' >&2; exit 1)
          test -s android/app/google-services.json
      - name: Build new native Android client (CI validation only)
        working-directory: native
        shell: bash
        env:
          CI: '1'
          EXPO_NO_TELEMETRY: '1'
        run: |
          sdkmanager 'platforms;android-37' 'build-tools;37.0.0' 'platform-tools'
          cd android
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon --stacktrace
      - name: Commit native source only if all checks pass
        shell: bash
        run: |
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add native/src/ConnectNativePush.ts native/src/App.tsx native/index.js native/app.json native/package.json native/package-lock.json native/README.md
          if git diff --cached --quiet; then
            echo 'Native push code already installed.'
            exit 0
          fi
          git commit -m 'feat(native): Android FCM notifications and native build validation'
          git push origin HEAD:main
