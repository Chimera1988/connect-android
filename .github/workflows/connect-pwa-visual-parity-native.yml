# PWA native visual parity, no WebView and no APK build.
# PWA CSS and SVG geometry source: Chimera1988/connect-messenger @ df71ca06e615ca5f981ae9276bd3642587f76e1a
name: Connect Android - PWA native visual transfer (NO APK)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/connect-pwa-visual-parity-native.yml'
permissions:
  contents: write
concurrency:
  group: connect-native-pwa-visual-port-no-apk
  cancel-in-progress: false
jobs:
  native-visual:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
      GRADLE_OPTS: '-Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx3g'
    steps:
      - name: Checkout and synchronize Connect native main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Validate repository identity and prevent unrelated changes
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B main origin/main
          python3 - <<'PY'
          import json
          from pathlib import Path
          app=json.loads(Path('native/app.json').read_text())['expo']
          assert app['android']['package']=='com.connect.messenger'
          assert app['name']=='Connect'
          assert (Path('native/src/ConnectNativePush.ts')).exists()
          assert (Path('native/src/ConnectNativeCalls.tsx')).exists()
          assert (Path('native/src/ConnectNativeGlass.tsx')).exists()
          print('Production package and native calling/push files preserved')
          PY
