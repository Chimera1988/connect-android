          from pathlib import Path
          import hashlib,base64,gzip
          for path,(digest,blob) in PAYLOADS.items():
              data=gzip.decompress(base64.b64decode(blob))
              if hashlib.sha256(data).hexdigest()!=digest:
                  raise SystemExit('STOP: corrupted phase 9 payload: '+path)
              target=Path(path)
              target.parent.mkdir(parents=True,exist_ok=True)
              target.write_bytes(data)
          # This is a guarded text-only patcher, not a shell script, build or executable.
          script=Path('phase9_patch.py').read_text(encoding='utf-8')
          exec(compile(script,'phase9_patch.py','exec'),{'__name__':'__main__'})
          PY_PHASE9
          git diff --check
          test -s native/src/ConnectNativeSonicRunner.tsx
          test -s native/src/ConnectNativeReadSync.ts

      - name: Node.js 24 for Expo 58
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: native/package-lock.json

      - name: TypeScript validation only
        shell: bash
        working-directory: native
        env:
          CI: '1'
          EXPO_NO_TELEMETRY: '1'
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm run typecheck

      - name: Commit verified native sources only
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git add -- native/src/ConnectNativeSonicRunner.tsx native/src/ConnectNativeReadSync.ts native/src/ConnectNativeInbox.ts native/src/ConnectNativePush.ts native/src/ConnectNativeSoundSettings.tsx native/src/ConnectNativeSettings.tsx native/src/App.tsx
          if git diff --cached --quiet; then
            echo 'Phase 9 already integrated; no changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(native): notification preferences, cross-device reads and offline runner'
          git push origin HEAD:main

      - name: Phase 9 summary
        if: success()
        shell: bash
        run: |
          {
            echo '### Connect Native - Phase 9 of 10 (NO APK)'
            echo '- Android native game: Sonic-style runner, robots, rings, local best score; no WebView, permissions or network.'
            echo '- Push respects enabled, silent and vibrate settings; custom Android sound remains preferred.'
            echo '- Remote notification settings loaded on sign-in; new sound channels track immutable vibration/silent options.'
            echo '- Inbox uses scoped Realtime updates and fallback polling; read notifications reconcile against server across devices.'
            echo '- TypeScript validation completed. No Gradle, APK compilation or hardware runtime testing.'
            echo '- Next: phase 10 (complete PWA parity audit, residual fixes and final acceptance).'
          } >> "$GITHUB_STEP_SUMMARY"
