# Connect Native phase 9/10: message read sync, push preferences and offline mini-game.
# The only run trigger after upload is THIS YAML; no Gradle, APK or emulator.
name: Connect Native - PWA parity phase 9 (notifications, sync and mini-game)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/connect-native-pwa-parity-phase9.yml

permissions:
  contents: write

concurrency:
  group: connect-native-pwa-parity-phase9
  cancel-in-progress: false

jobs:
  integrate-phase9:
    name: Read state and push parity, Sonic runner; TypeScript only (NO APK)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout Connect Android
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Retired APK gate and prerequisites
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B main origin/main
          python3 - <<'PY_GATE'
          from pathlib import Path
          legacy=Path('.github/workflows/android-apk.yml')
          if not legacy.is_file(): raise SystemExit('STOP: missing release gate')
          text=legacy.read_text(encoding='utf-8')
          if '  push:' in text or 'assembleDebug' in text or 'assembleRelease' in text or 'gradle --no-daemon' in text:
              raise SystemExit('STOP: legacy automatic APK build still active')
          for needed in ['native/src/ConnectNativeVoice.tsx','native/src/ConnectNativeMissedCalls.ts','native/src/ConnectNativeMusic.tsx','native/src/ConnectNativePush.ts','native/src/ConnectNativeSettings.tsx','native/src/ConnectNativeSoundSettings.tsx','native/src/ConnectNativeInbox.ts']:
              if not Path(needed).is_file():raise SystemExit('STOP: missing prior phase source '+needed)
          print('Phase 8 prerequisites and NO-APK gate verified.')
          PY_GATE

      - name: Install guarded PWA phase 9 sources (no APK)
