      - name: Prepare Node and validate TypeScript
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: native/package-lock.json

      - name: TypeScript check (NO Android compilation)
        working-directory: native
        shell: bash
        env:
          CI: '1'
          EXPO_NO_TELEMETRY: '1'
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm run typecheck

      - name: Re-run conservative PWA evidence audit
        shell: bash
        run: |
          set -euo pipefail
          python3 native/phase10_tools/phase10_audit.py
          python3 - <<'PY_AUDIT'
          from pathlib import Path
          import json
          data=json.loads(Path('native/phase10-audit/phase10_parity_199.json').read_text())
          assert len(data['cases'])==199
          assert data['runtime_acceptance_confirmed']==0
          assert data['release_status'].startswith('NOT READY')
          print('199 source hints reviewed. Device acceptance still 0/199.')
          PY_AUDIT

      - name: Upload 199-point audit as artifact
        uses: actions/upload-artifact@v4
        with:
          name: connect-native-phase10c-source-audit
          path: native/phase10-audit/
          retention-days: 14

      - name: Commit only successfully validated sources and audit
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git add -- native/src/backend.ts native/src/App.tsx native/src/ConnectNativeChat.tsx native/src/ConnectNativePresence.ts native/src/ConnectNativeMedia.tsx native/phase10-audit/
          if git diff --cached --quiet; then
            echo 'Phase 10C already applied.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(native): PWA presence, attachment sharing and video note details'
          git push origin HEAD:main

      - name: Report phase results (NO RELEASE)
        if: success()
        shell: bash
        run: |
          {
            echo '### Connect Native — этап 10В (NO APK)'
            echo '- PWA-compatible online status: foreground heartbeat, 45-second lease, offline when backgrounded.'
            echo '- Status visible in contacts, profile and chat header.'
            echo '- Media attachments can be downloaded and passed to Android file sharing/Save chooser.'
            echo '- Chat images preserve intrinsic aspect ratio; video notes show loaded duration.'
            echo '- Source validation and 199-point *static* audit complete; 0/199 device cases accepted.'
            echo '- APK and release are still blocked until device and visual testing.'
          } >> "$GITHUB_STEP_SUMMARY"
