# Connect Native phase 10C: corrective parity, NOT a release.
# This workflow does not invoke Gradle, build an APK, or deploy anything.
name: Connect Native - Phase 10C (presence, media, video-note details; NO APK)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/connect-native-pwa-parity-phase10c.yml

permissions:
  contents: write

concurrency:
  group: connect-native-parity-phase10c
  cancel-in-progress: false

jobs:
  parity:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout current source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Validate NO-APK guard and required sources
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B main origin/main
          python3 - <<'PY_GUARD'
          from pathlib import Path
          import re
          p=Path('.github/workflows/android-apk.yml')
          if not p.is_file():raise SystemExit('STOP: legacy APK workflow status unknown')
          s=p.read_text()
          if re.search(r'^\s{2}push\s*:',s,re.M) or re.search(r'\b(?:assembleRelease|assembleDebug|gradlew|eas build)\b',s,re.I):
              raise SystemExit('STOP: legacy APK automatic build may still be enabled')
          for file in ['native/src/App.tsx','native/src/ConnectNativeChat.tsx',
               'native/src/ConnectNativeMedia.tsx','native/src/backend.ts',
               'native/src/ConnectNativeReadSync.ts','native/src/ConnectNativeVideoNote.tsx',
               'native/phase10_tools/phase10_audit.py','native/package-lock.json']:
              if not Path(file).is_file():raise SystemExit('STOP: prerequisite missing '+file)
          print('No APK build is enabled in the legacy workflow.')
          PY_GUARD

