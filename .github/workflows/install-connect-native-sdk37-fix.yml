name: Connect Native - install Android 17 preview SDK and compile

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/install-connect-native-sdk37-fix.yml'

permissions:
  contents: write

concurrency:
  group: connect-native-sdk37-installer
  cancel-in-progress: false

jobs:
  install-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - name: Checkout Connect Android
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android CLI tools
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Restore previously checked native changes and correct Expo configuration
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          import textwrap

          # The preceding installer already passed TS and Expo prebuild checks.
          # Reuse that exact source setup. Work is kept uncommitted until Gradle succeeds.
          path = Path('.github/workflows/install-connect-native-prebuild-fix.yml')
          if not path.is_file():
              raise SystemExit('Missing previous source installer: ' + str(path))
          src = path.read_text(encoding='utf-8')
          start = "          python3 - <<'PY'\n"
          stop = "\n          PY"
          if src.count(start) != 1 or src.count(stop) != 1:
              raise SystemExit('Previous installer changed; refusing unsafe source reconstruction')
          script = textwrap.dedent(src.split(start, 1)[1].split(stop, 1)[0])
          subprocess.run(['python3', '-c', script], check=True)
          print('Applied previously validated FCM and Expo changes; WebView app/ unchanged.')
          PY

      - name: Install dependencies and check strict TypeScript
        working-directory: native
        env:
          CI: '1'
          EXPO_NO_TELEMETRY: '1'
        run: |
          npm install --no-audit --no-fund
          npx expo install expo-build-properties
          npm run typecheck

      - name: Generate native Android project, not WebView APK
        working-directory: native
        env:
          CI: '1'
          EXPO_NO_TELEMETRY: '1'
        run: |
          npx expo config --type prebuild --json > /tmp/connect-native-expo-config.json
          npx expo prebuild --platform android --no-install --clean
          grep -q 'com.connect.messenger' android/app/build.gradle
          test -s android/app/google-services.json

      - name: Install correct Android 17 API 37 preview SDK package
        shell: bash
        run: |
          set -euo pipefail
          # Expo 58 compiles with API 37. Its Android 17 preview platform is
          # named android-37.0, NOT android-37. Request preview packages.
          sdkmanager --channel=3 --install 'platforms;android-37.0' 'build-tools;37.0.0' 'platform-tools'
          test -s "${ANDROID_SDK_ROOT}/platforms/android-37.0/android.jar" || {
            echo 'Android 17 preview SDK not installed at the expected path' >&2
            ls -la "${ANDROID_SDK_ROOT}/platforms" || true
            exit 1
          }
          echo 'Android 17 preview platform and build tools installed.'

      - name: Compile Connect Native Android APK for validation only
        working-directory: native/android
        env:
          CI: '1'
          EXPO_NO_TELEMETRY: '1'
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleDebug --no-daemon --stacktrace
          test -s app/build/outputs/apk/debug/app-debug.apk

      - name: Commit native source only after successful checks
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add native/src/ConnectNativePush.ts native/src/App.tsx native/index.js native/app.json native/package.json native/package-lock.json native/README.md
          if git diff --cached --quiet; then
            echo 'Native source is already up to date.'
            exit 0
          fi
          git commit -m 'fix(native): validate FCM setup with Android 17 preview SDK'
          git push origin HEAD:main
