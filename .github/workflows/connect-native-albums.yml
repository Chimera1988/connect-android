name: Connect Native - PWA-compatible photo and video albums
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/connect-native-albums.yml
permissions:
  contents: write
concurrency:
  group: connect-native-albums
  cancel-in-progress: false
jobs:
  integrate-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 85
    steps:
      - name: Checkout Connect Android
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - name: Add albums and PWA-compatible message format
        shell: bash
        run: |
          python3 - <<'PY_ALBUM'
          from pathlib import Path
          import base64,hashlib,zlib
          
          assets=[
            ('native/src/ConnectNativeAlbum.tsx','1c121ad2e08fe16874744eaed9c3649709282b7a127aaa85d2d9a4f93257ebd5',''),
            ('native/.connect_album_installer.py','64986dfc9ee3b092b672abf9f126504ee638f16ae20538751c18457ed8a7461e','')
          ]
          for name, expected_hash, encoded in assets:
              data=zlib.decompress(base64.b64decode(encoded))
              if hashlib.sha256(data).hexdigest()!=expected_hash:raise SystemExit('Installer checksum mismatch: '+name)
              dest=Path(name)
              if dest.exists() and dest.read_bytes()!=data:raise SystemExit('Refusing to replace unexpected file: '+name)
              dest.parent.mkdir(parents=True,exist_ok=True)
              dest.write_bytes(data)
          import runpy
          runpy.run_path('native/.connect_album_installer.py',run_name='__main__')
          Path('native/.connect_album_installer.py').unlink()
          PY_ALBUM
      - name: Install dependencies and check TypeScript
        working-directory: native
        env:
          CI: '1'
          EXPO_NO_TELEMETRY: '1'
        run: |
          npm install --no-audit --no-fund
          npm run typecheck
      - name: Generate native Android source
        working-directory: native
        env:
          CI: '1'
          EXPO_NO_TELEMETRY: '1'
        run: npx expo prebuild --platform android --no-install --clean
      - name: Install Android SDK 37
        run: |
          sdkmanager --channel=3 --install 'platforms;android-37.0' 'build-tools;37.0.0' 'platform-tools'
          test -s "${ANDROID_SDK_ROOT}/platforms/android-37.0/android.jar"
      - name: Compile native Android APK for CI validation only
        working-directory: native/android
        env:
          CI: '1'
          EXPO_NO_TELEMETRY: '1'
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon --stacktrace
          test -s app/build/outputs/apk/debug/app-debug.apk
      - name: Commit sources after successful checks
        shell: bash
        run: |
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add native/src/ConnectNativeAlbum.tsx native/src/ConnectNativeChat.tsx native/src/App.tsx
          if git diff --cached --quiet; then echo 'Albums already installed'; exit 0; fi
          git commit -m 'feat(native): mixed-media albums compatible with Connect PWA'
          git push origin HEAD:main
