name: Connect Android | Offline custom stickers and traffic FIX 2026-11-17
'on':
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: connect-android-stickers-20261117
  cancel-in-progress: false
jobs:
  offline-stickers:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
    - name: Checkout Android production main
      uses: actions/checkout@v4
      with:
        ref: main
        fetch-depth: 0
        persist-credentials: true
    - name: Guard exact repository and current Android hybrid baseline
      shell: bash
      run: 'set -euo pipefail

        test "$GITHUB_REPOSITORY" = ''Chimera1988/connect-android''

        test "$GITHUB_REF" = ''refs/heads/main''

        test -s native/web/app/page.tsx

        test -s native/web/lib/media-cache.ts

        test -s native/package-lock.json

        test -s native/plugins/withConnectWebAssets.js

        test -s native/PARITY_SOURCE_LOCK.json

        test ! -e native/tests/sticker-offline-cache-20261117.test.cjs

        python3 - <<''PY_GUARD''

        import json

        cfg=json.load(open(''native/app.json''))[''expo'']

        assert cfg[''android''][''package'']==''com.connect.messenger''

        assert cfg[''android''][''versionCode'']==24, ''Android source drift: inspect manually''

        print(''Production Android source confirmed; no APK generated by this workflow.'')

        PY_GUARD'
    - name: Create regression tests and prove bug (RED)
      shell: bash
      run: "set -euo pipefail\nmkdir -p native/tests\ncat > native/tests/sticker-offline-cache-20261117.test.cjs\
        \ <<'CONNECT_STICKER_OFFLINE_TEST'\nconst {test}=require('node:test'), assert=require('node:assert/strict'),fs=require('node:fs'),path=require('node:path');\n\
        const page=fs.readFileSync(path.join(__dirname,'../web/app/page.tsx'),'utf8');\nconst cache=fs.readFileSync(path.join(__dirname,'../web/lib/media-cache.ts'),'utf8');\n\
        test('Android private device storage pins sticker files across cache trimming',()=>{\n  assert.match(cache,/CONNECT_ANDROID_STICKERS_PINNED_20261117/);\n\
        \  assert.match(cache,/if \\(row\\.key\\.startsWith\\(owner \\+ ':connect-stickers\\/'\\)\\) continue;/);\n\
        \  assert.match(cache,/const NAME = 'connect-media-v1'/);\n  assert.match(cache,/indexedDB\\.open\\(NAME,\
        \ 3\\)/);\n});\ntest('viewer cache is keyed by stable storage path, never a signed token',()=>{\n  const\
        \ before=page.indexOf('const local=await resolveCachedMedia(identity,viewer);');\n  const after=page.indexOf(\"\
        const {data}=await supabase!.storage.from('connect-stickers').createSignedUrl\",before);\n  assert.ok(before>=0\
        \ && after>before);\n  assert.match(cache,/const key=user\\+':'\\+id/);\n});\ntest('catalog bytes are persisted\
        \ before the first signed image reaches the DOM',()=>{\n  const fragment=page.slice(page.indexOf('CONNECT_ANDROID_STICKER_OFFLINE_FIRST_20261117'),page.indexOf(\"\
        }catch{/* Retry on next login/visibility refresh\"));\n  assert.ok(fragment.indexOf('await prefetchStickerWebp(signed,viewer)')>=0);\n\
        \  assert.ok(fragment.indexOf('await prefetchStickerWebp(signed,viewer)')<fragment.indexOf('setCustomStickerUrls(prev=>'));\n\
        \  assert.match(fragment,/cached\\.startsWith\\('blob:'\\)\\?cached:signed/);\n});\ntest('received private\
        \ sticker not in a public catalog is also cached first',()=>{\n  assert.match(page,/await prefetchStickerWebp\\\
        (url,owner\\);[\\s\\S]{0,180}await resolveCachedMedia\\(identity,owner\\)/);\n});\ntest('foreground refresh\
        \ is bounded, but explicit pack changes can refresh',()=>{\n  assert.match(page,/stickerVisibilityRefreshedAt\\\
        .current>10\\*60\\*1000/);\n  assert.match(page,/const loadCustomStickers=useCallback/);\n  assert.match(page,/await\
        \ loadCustomStickers\\(\\)/);\n});\ntest('Android release SHA-256 manifest matches exactly the edited active\
        \ source files',()=>{\n  const {createHash}=require('node:crypto');\n  const lock=JSON.parse(fs.readFileSync(path.join(__dirname,'../PARITY_SOURCE_LOCK.json'),'utf8'));\n\
        \  for(const name of ['web/app/page.tsx','web/lib/media-cache.ts']){\n    const actual=createHash('sha256').update(fs.readFileSync(path.join(__dirname,'..',name))).digest('hex');\n\
        \    assert.equal(lock.files[name],actual,name);\n  }\n});\ntest('all 96 built-in WebP stickers remain bundled\
        \ with APK and served without network',()=>{\n  const root=path.join(__dirname,'../web/public/stickers');\n\
        \  let count=0;for(const name of ['speed','blocks','anime-boys','anime-girls']){\n    const files=fs.readdirSync(path.join(root,name)).filter(f=>f.endsWith('.webp'));\n\
        \    assert.equal(files.length,24);count+=files.length;\n  }assert.equal(count,96);\n  const plugin=fs.readFileSync(path.join(__dirname,'../plugins/withConnectWebAssets.js'),'utf8');\n\
        \  assert.match(plugin,/Legacy builtin sticker URLs keep their IDs/);\n});\nCONNECT_STICKER_OFFLINE_TEST\n\
        if (cd native && node --test tests/sticker-offline-cache-20261117.test.cjs > \"$RUNNER_TEMP/connect-sticker-red.log\"\
        \ 2>&1); then\n  echo 'Tests unexpectedly pass before patch: stop to avoid no-op release.' >&2; exit 1\n\
        fi\ngrep -q 'not ok' \"$RUNNER_TEMP/connect-sticker-red.log\"\necho 'RED: confirmed current Android WebView\
        \ does not pin or synchronously cache custom stickers.'\n"
    - name: Apply single targeted patch to active embedded Android UI
      shell: bash
      run: "set -euo pipefail\ncat > \"$RUNNER_TEMP/patch-connect-stickers.py\" <<'CONNECT_STICKER_PATCH'\nfrom\
        \ pathlib import Path\npage=Path('native/web/app/page.tsx'); cache=Path('native/web/lib/media-cache.ts')\n\
        src=page.read_text(encoding='utf-8'); media=cache.read_text(encoding='utf-8')\n\ndef once(source,old,new,what):\n\
        \ n=source.count(old)\n if n!=1: raise SystemExit(f'{what}: expected one exact source location, got {n}.\
        \ Stop without changing source.')\n return source.replace(old,new,1)\n\n# Never evict user-created sticker\
        \ WebP during an automatic Android cache trim.\n# Explicit user cache clearing and message deletion stay\
        \ authoritative.\nmedia=once(media,'''    for (const row of rows) {\n        const avatar = row.category\
        \ === 'system' && !row.key.includes(':core'), expired = Boolean((window as Window & {ConnectAndroid?:unknown;ConnectNative?:unknown}).ConnectAndroid||(window\
        \ as Window & {ConnectAndroid?:unknown;ConnectNative?:unknown}).ConnectNative) && Date.now() - row.used\
        \ > 30 * 86400000;''', '''    for (const row of rows) {\n        // CONNECT_ANDROID_STICKERS_PINNED_20261117:\
        \ app-private IndexedDB is durable device storage.\n        // Signed URLs expire, but a stored image must\
        \ not be evicted on a timer.\n        if (row.key.startsWith(owner + ':connect-stickers/')) continue;\n\
        \        const avatar = row.category === 'system' && !row.key.includes(':core'), expired = Boolean((window\
        \ as Window & {ConnectAndroid?:unknown;ConnectNative?:unknown}).ConnectAndroid||(window as Window & {ConnectAndroid?:unknown;ConnectNative?:unknown}).ConnectNative)\
        \ && Date.now() - row.used > 30 * 86400000;''','pin existing stickers')\n\n# Warm persistent bytes BEFORE\
        \ showing image URL; avoid two simultaneous GETs\n# (one native WebView img, one cache prefetch).\nsrc=once(src,'''\
        \          const signed=mediaUrl(data.signedUrl);\n          setCustomStickerUrls(prev=>prev[st.id]===signed?prev:{...prev,[st.id]:signed});\n\
        \          // Queue a small, account-scoped cache write. Never block the UI on it.\n          void prefetchStickerWebp(signed,viewer).catch(()=>{});''','''\
        \          const signed=mediaUrl(data.signedUrl);\n          // CONNECT_ANDROID_STICKER_OFFLINE_FIRST_20261117:\
        \ download at most once\n          // for this account/path, then display the local Blob instead of a network\
        \ URL.\n          await prefetchStickerWebp(signed,viewer);\n          if(epoch!==stickerCatalogEpoch.current)return;\n\
        \          const cached=await resolveCachedMedia(identity,viewer);\n          if(epoch!==stickerCatalogEpoch.current)return;\n\
        \          const source=cached.startsWith('blob:')?cached:signed;\n          setCustomStickerUrls(prev=>prev[st.id]===source?prev:{...prev,[st.id]:source});''','cache\
        \ first catalog')\n\n# Received private stickers may be excluded by pack enumeration; also cache first.\n\
        src=once(src,'''          const url=mediaUrl(signed.signedUrl);\n          void prefetchStickerWebp(url,owner).catch(()=>{});\n\
        \          return [st.id,url] as const;''','''          const url=mediaUrl(signed.signedUrl);\n        \
        \  await prefetchStickerWebp(url,owner);\n          if(!alive)return null;\n          const cached=await\
        \ resolveCachedMedia(identity,owner);\n          return [st.id,cached.startsWith('blob:')?cached:url] as\
        \ const;''','cache first received private sticker')\n\n# Returning to the foreground repeatedly must not\
        \ re-list and sign the entire\n# catalog; explicit add/edit/delete operations still refresh immediately.\n\
        src=once(src,'''  const stickerCatalogEpoch=useRef(0);''','''  const stickerCatalogEpoch=useRef(0);\n  const\
        \ stickerVisibilityRefreshedAt=useRef(0);''','foreground refresh clock')\nsrc=once(src,'''    const refresh=()=>{if(document.visibilityState==='visible'){void\
        \ loadDirectory();void loadCustomStickers()}};''','''    const refresh=()=>{if(document.visibilityState==='visible'){\n\
        \      void loadDirectory();\n      if(Date.now()-stickerVisibilityRefreshedAt.current>10*60*1000){\n  \
        \      stickerVisibilityRefreshedAt.current=Date.now();void loadCustomStickers();\n      }\n    }};''','throttle\
        \ foreground catalog reload')\n\n# Verify the existing release manifest actually matches the untouched baseline,\n\
        # then update exactly the two edited paths. The release checker must remain active.\nimport json,hashlib\n\
        lock_path=Path('native/PARITY_SOURCE_LOCK.json')\nmanifest=json.loads(lock_path.read_text(encoding='utf-8'))\n\
        for path,original in [('web/app/page.tsx',page.read_text(encoding='utf-8')),('web/lib/media-cache.ts',cache.read_text(encoding='utf-8'))]:\n\
        \ old_hash=hashlib.sha256(original.encode('utf-8')).hexdigest()\n if manifest['files'].get(path)!=old_hash:raise\
        \ SystemExit('SOURCE_DRIFT: baseline manifest differs for '+path)\nmanifest['files']['web/app/page.tsx']=hashlib.sha256(src.encode('utf-8')).hexdigest()\n\
        manifest['files']['web/lib/media-cache.ts']=hashlib.sha256(media.encode('utf-8')).hexdigest()\n# Validate\
        \ all source anchors, before writing any of the three files.\ncache.write_text(media,encoding='utf-8');page.write_text(src,encoding='utf-8')\n\
        lock_path.write_text(json.dumps(manifest,ensure_ascii=False,indent=2)+'\\n',encoding='utf-8')\nprint('Patched\
        \ actual embedded Android WebView and updated release source lock.')\nCONNECT_STICKER_PATCH\npython3 \"\
        $RUNNER_TEMP/patch-connect-stickers.py\"\ngit diff --check\n"
    - name: Verify offline sticker regressions (GREEN)
      shell: bash
      run: 'set -euo pipefail

        cd native

        node --test tests/sticker-offline-cache-20261117.test.cjs

        '
    - name: Install Node.js 22
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: npm
        cache-dependency-path: native/package-lock.json
    - name: Install exact locked Android dependencies
      shell: bash
      working-directory: native
      run: npm ci --no-audit --no-fund
    - name: Install Chromium for existing native/WebView browser tests
      shell: bash
      working-directory: native
      run: 'set -euo pipefail

        npx playwright-core install --with-deps chromium

        node -e "const fs=require(''fs''),c=require(''playwright-core'').chromium;if(!fs.existsSync(c.executablePath()))process.exit(1)"'
    - name: Verify native and embedded web, run full tests and embed UI
      shell: bash
      working-directory: native
      env:
        EXPO_PUBLIC_SUPABASE_URL: https://tpwkmoxxzjfdsqsomhhr.supabase.co
        NEXT_PUBLIC_SUPABASE_URL: https://tpwkmoxxzjfdsqsomhhr.supabase.co
        EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_tAg8rPwuBNcA2iPF7voc2Q_vsKUpyZa
        NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_tAg8rPwuBNcA2iPF7voc2Q_vsKUpyZa
      run: 'set -euo pipefail

        node scripts/check-parity-source.mjs

        npm run typecheck:web

        npm run typecheck

        npm test

        npm run build:web

        export CHROMIUM_PATH="$(node -p "require(''playwright-core'').chromium.executablePath()")"

        npm run test:browser

        '
    - name: Commit only tested offline sticker cache changes to main
      shell: bash
      run: 'set -euo pipefail

        test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$(git rev-parse HEAD)" || { echo ''Main changed
        during tests; refusing to overwrite.'' >&2;exit 1; }

        git add -- native/web/app/page.tsx native/web/lib/media-cache.ts native/PARITY_SOURCE_LOCK.json native/tests/sticker-offline-cache-20261117.test.cjs

        git diff --cached --check

        git diff --cached --quiet && { echo ''No source change: already applied''; exit 0; }

        git -c user.name=''Connect CI'' -c user.email=''actions@users.noreply.github.com'' commit -m ''Android:
        persist user stickers offline and avoid repeat Storage traffic''

        git push origin HEAD:main

        '
