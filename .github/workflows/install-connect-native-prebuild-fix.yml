name: Connect Native - repair Expo prebuild and validate Android

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/install-connect-native-prebuild-fix.yml'

permissions:
  contents: write

concurrency:
  group: connect-native-prebuild-fix
  cancel-in-progress: false

jobs:
  install-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout Connect Android
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK without legacy tools
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Apply earlier validated FCM TypeScript source and correct Expo plugins
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          import subprocess
          import textwrap

          # The previous workflow successfully passed its source patch and TypeScript
          # check. Reuse its exact installer, without rewriting uncommitted sources.
          previous = Path('.github/workflows/install-connect-native-push-typefix.yml')
          if not previous.is_file():
              raise SystemExit(f'Cannot find source installer {previous}')
          workflow = previous.read_text(encoding='utf-8')
          start = "          python3 - <<'PYFIX'\n"
          end = "\n          PYFIX"
          if workflow.count(start) != 1 or workflow.count(end) != 1:
              raise SystemExit('Previous FCM installer structure changed; cannot patch safely')
          original_script = textwrap.dedent(workflow.split(start, 1)[1].split(end, 1)[0])
          subprocess.run(['python3', '-c', original_script], check=True)

          # Notifee 9.1.8 in this project does not expose an app.plugin.js.
          # Registering it in expo.plugins makes Expo load its RN runtime as a
          # config plugin, which throws "Unexpected token typeof" at prebuild.
          # React Native autolinking still includes the native Notifee package.
          config_path = Path('native/app.json')
          data = json.loads(config_path.read_text(encoding='utf-8'))
          plugins = data['expo'].get('plugins', [])
          plugins = [p for p in plugins if (p if isinstance(p, str) else p[0]) != '@notifee/react-native']
          # Expo build properties adds the Notifee Maven repository Android needs.
          build_props = [
              'expo-build-properties',
              {'android': {'extraMavenRepos': ['$rootDir/../node_modules/@notifee/react-native/android/libs']}},
          ]
          if not any((p if isinstance(p, str) else p[0]) == 'expo-build-properties' for p in plugins):
              plugins.append(build_props)
          data['expo']['plugins'] = plugins
          config_path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print('Notifee removed from Expo config plugins; native package remains installed.')
          PY

      - name: Resolve dependencies and run strict TypeScript check
        working-directory: native
        env:
          CI: '1'
          EXPO_NO_TELEMETRY: '1'
        run: |
          npm install --no-audit --no-fund
          npx expo install expo-build-properties
          npm run typecheck

      - name: Validate Expo configuration and generate Android
        working-directory: native
        env:
          CI: '1'
          EXPO_NO_TELEMETRY: '1'
        run: |
          npx expo config --type prebuild --json > /tmp/connect-native-expo-config.json
          npx expo prebuild --platform android --no-install --clean
          grep -q 'com.connect.messenger' android/app/build.gradle || (echo 'Wrong Android application ID' >&2; exit 1)
          test -s android/app/google-services.json

      - name: Compile new native Android APK for CI validation only
        working-directory: native
        env:
          CI: '1'
          EXPO_NO_TELEMETRY: '1'
        run: |
          sdkmanager 'platforms;android-37' 'build-tools;37.0.0' 'platform-tools'
          cd android
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Commit validated native source; old WebView APK stays unchanged
        shell: bash
        run: |
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add native/src/ConnectNativePush.ts native/src/App.tsx native/index.js native/app.json native/package.json native/package-lock.json native/README.md
          if git diff --cached --quiet; then
            echo 'Native source already up to date.'
            exit 0
          fi
          git commit -m 'fix(native): validate Expo prebuild with Notifee autolinking'
          git push origin HEAD:main
