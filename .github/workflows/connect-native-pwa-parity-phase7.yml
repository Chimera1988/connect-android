# Phase 7 of 10: standalone Connect Native media/music parity.
# Important: FIRST replace .github/workflows/android-apk.yml with the provided
# disabled workflow, otherwise that obsolete push trigger may build a legacy APK.
name: Connect Native - PWA parity phase 7 (profile media and music)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/connect-native-pwa-parity-phase7.yml

permissions:
  contents: write

concurrency:
  group: connect-native-pwa-parity-phase7
  cancel-in-progress: false

jobs:
  media-music-parity:
    name: Music queue, mini player, presence and media gallery (NO APK)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout latest Connect Native
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Apply guarded phase 7 changes (pure TSX and config only)
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B main origin/main
          test -s native/src/App.tsx
          test -s native/src/ConnectNativeMedia.tsx
          test -s native/app.json
          # Refuse to continue if the legacy APK push workflow was not retired.
          python3 - <<'PY_GATE'
          from pathlib import Path
          src=Path('.github/workflows/android-apk.yml').read_text()
          if '  push:' in src or 'assembleDebug' in src or 'assembleRelease' in src:
              raise SystemExit('STOP: legacy APK workflow still builds on push. Replace android-apk.yml FIRST.')
          print('Legacy APK push workflow disabled: safe to proceed.')
          PY_GATE
          python3 - <<'PY_PHASE7'
          import os,base64,gzip,hashlib
          music=gzip.decompress(base64.b64decode(''))
          installer=gzip.decompress(base64.b64decode(''))
          assert hashlib.sha256(music).hexdigest() == 'cabbc7bf4980eb74cd16a83035c5b9bf56ba0f19d1529d60627debee2d629a3a', 'music integrity error'
          assert hashlib.sha256(installer).hexdigest() == '8c8b72c847f525b2f62336fa6a4de51956d1053f89850ed5b63c39d03531e8f4', 'installer integrity error'
          os.environ['PHASE7_MUSIC_B64']=base64.b64encode(music).decode('ascii')
          os.environ['PHASE7_MUSIC_SHA256']='cabbc7bf4980eb74cd16a83035c5b9bf56ba0f19d1529d60627debee2d629a3a'
          exec(compile(installer,'phase7_patch.py','exec'),{'__name__':'__main__'})
          PY_PHASE7
          git diff --check

      - name: Setup Node.js 24 (no Android SDK or Gradle)
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: native/package-lock.json

      - name: Validate TypeScript before saving changes
        shell: bash
        working-directory: native
        env:
          CI: '1'
          EXPO_NO_TELEMETRY: '1'
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm run typecheck

      - name: Commit validated React Native files only
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git add -- native/src/App.tsx native/src/ConnectNativeMedia.tsx native/src/ConnectNativeMusic.tsx native/app.json
          if git diff --cached --quiet; then
            echo 'Phase 7 source changes already applied.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(native): PWA profile media and persistent music player parity'
          git push origin HEAD:main

      - name: Phase 7 summary (no APK produced)
        if: success()
        shell: bash
        run: |
          {
            echo '### Connect Native: media + music parity phase 7'
            echo '- Single music queue shared between screens, seek, shuffle, repeat, previous/next.'
            echo '- Persistent mini-player and last position, opt-in now-playing presence.'
            echo '- Photo grid, full screen viewer; audio upload selection up to 12 files.'
            echo '- Background music plugin configuration and lock-screen controls.'
            echo '- TypeScript validation only. No APK or device/emulator runtime checks.'
          } >> "$GITHUB_STEP_SUMMARY"
