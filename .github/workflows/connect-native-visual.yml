name: Connect Native - PWA Liquid Glass Visual Foundation

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/connect-native-visual.yml

permissions:
  contents: write

concurrency:
  group: connect-native-visual-foundation
  cancel-in-progress: false

jobs:
  integrate-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 95
    steps:
      - name: Checkout Connect Android
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Sync with the latest Connect Native sources
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B main origin/main
          test -s native/src/App.tsx
          test -s native/src/ConnectNativeChat.tsx
          test -s native/src/ConnectNativeCalls.tsx
          test -s native/src/ConnectNativeSoundSettings.tsx
          test -s app/src/main/res/drawable/connect_icon.png
      - name: Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - name: Integrate PWA-inspired native Liquid Glass presentation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_CONNECT_VISUAL'
          from pathlib import Path
          import base64,hashlib,zlib,runpy,shutil
          payloads=[
              ('native/src/ConnectNativeGlass.tsx','65f51cecdbc0ef2debbfd4be9c4ed6f11584c61828e079a45fe410704f6b1c26',''),
              ('/tmp/connect-native-visual-apply.py','460b42d34da39d2ebeb2ea2284c5083ed7bd5904a315eaa832a476645e6468c3',''),
          ]
          app=Path('native/src/App.tsx')
          already="import ConnectNativeGlass,{glassColor} from './ConnectNativeGlass';" in app.read_text()
          if already:
              assert Path('native/src/ConnectNativeGlass.tsx').exists(), 'Visual module missing although App imports it'
              print('PWA visual foundation already integrated, no duplicate patch')
          else:
              assert not Path('native/src/ConnectNativeGlass.tsx').exists(), 'Unexpected existing module; refusing overwrite'
              for target,expected,b64 in payloads:
                  content=zlib.decompress(base64.b64decode(b64))
                  assert hashlib.sha256(content).hexdigest()==expected, f'Corrupted installer payload: {target}'
                  path=Path(target)
                  path.parent.mkdir(parents=True,exist_ok=True)
                  path.write_bytes(content)
              runpy.run_path('/tmp/connect-native-visual-apply.py',run_name='__main__')
          Path('native/assets').mkdir(parents=True,exist_ok=True)
          icon=Path('native/assets/connect-icon.png')
          source=Path('app/src/main/res/drawable/connect_icon.png')
          if icon.exists() and icon.read_bytes()!=source.read_bytes():
              raise SystemExit('Existing native icon is different; refusing to overwrite custom artwork')
          shutil.copyfile(source,icon)
          print('Native Connect icon matches existing PWA/legacy original')
          PY_CONNECT_VISUAL
      - name: Type-check Connect Native
        working-directory: native
        env:
          CI: '1'
          EXPO_NO_TELEMETRY: '1'
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm run typecheck
      - name: Generate native Android project
        working-directory: native
        env:
          CI: '1'
          EXPO_NO_TELEMETRY: '1'
        run: npx expo prebuild --platform android --no-install --clean
      - name: Install Android SDK 37
        run: |
          sdkmanager --channel=3 --install 'platforms;android-37.0' 'build-tools;37.0.0' 'platform-tools'
          test -s "${ANDROID_SDK_ROOT}/platforms/android-37.0/android.jar"
      - name: Compile native Android (validation only; no production release)
        working-directory: native/android
        env:
          CI: '1'
          EXPO_NO_TELEMETRY: '1'
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon --stacktrace
          test -s app/build/outputs/apk/debug/app-debug.apk
      - name: Commit only verified native visual sources
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add native/src/ConnectNativeGlass.tsx native/src/App.tsx native/src/ConnectNativeChat.tsx native/src/ConnectNativeCalls.tsx native/assets/connect-icon.png
          if git diff --cached --quiet; then
            echo 'Liquid Glass visual foundation already integrated'
            exit 0
          fi
          git commit -m 'feat(native): PWA-inspired glass backdrop, dock and chat surfaces'
          git push origin HEAD:main
      - name: GitHub summary
        if: success()
        shell: bash
        run: |
          {
            echo '### Connect Native Liquid Glass foundation integrated'
            echo '- Native SVG color waves (no WebView)'
            echo '- Glass floating dock, chats and conversation surfaces'
            echo '- Uses original Connect icon and existing saved theme'
            echo '- TypeScript and Android build validated'
            echo '- Source changed only in `native/`; legacy `app/` untouched'
            echo '- To see UI on a phone, **re-run `connect-native-test-apk.yml` manually** after integration.'
            echo '- First visual iteration; not a pixel-perfect PWA port or a real-device test.'
          } >> "$GITHUB_STEP_SUMMARY"
