# One-time installer for Connect Android PWA parity source changes.
# It writes verified Android source changes directly to main; the release workflow YAML is exported as an artifact for manual upload. No APK or Expo OTA is published.
# Source: connect-android-parity-all.zip; patch SHA256: ab79896d39b5429abbe62e167318192183fd29bd4c40e3d4bea7a378ed53549a
name: Connect Android | Install Codex parity directly to main

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: connect-android-parity-source-installer
  cancel-in-progress: false

jobs:
  install:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout main and full history
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - name: Guard exact reviewed base and avoid overwriting newer changes
        shell: bash
        env:
          BASE_SHA: 169681ee308b01799f2cf9df15a99e76f9dad56a
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'Chimera1988/connect-android'
          test "$GITHUB_REF" = 'refs/heads/main'
          git cat-file -e "$BASE_SHA^{commit}"
          test "$(git merge-base "$BASE_SHA" HEAD)" = "$BASE_SHA" || { echo 'Base diverged; no changes made'; exit 1; }
          python3 - <<'PY_GUARD'
          import os,subprocess
          baseline=os.environ['BASE_SHA']
          changes=subprocess.check_output(['git','diff','--name-only',baseline,'HEAD'],text=True).splitlines()
          allowed={'.github/workflows/connect-android-parity-installer.yml',
                   '.github/workflows/connect-android-parity-install-main.yml'}
          required='.github/workflows/connect-android-parity-install-main.yml'
          if required not in changes or set(changes) - allowed:
              raise SystemExit(f'SOURCE_DRIFT: unexpected changes since reviewed base: {changes}. Re-audit before install.')
          print('BASE_CHECK_OK: only approved one-time installer workflows differ from audited main')
          PY_GUARD
      - name: Restore exact Codex patch and apply to checked sources
        shell: bash
        run: |
          set -euo pipefail
          cat <<'CONNECT_PATCH_B64' | base64 --decode | gzip -dc > "$RUNNER_TEMP/connect-parity.patch"
