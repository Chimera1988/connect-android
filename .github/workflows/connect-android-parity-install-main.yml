          import hashlib,json,os,subprocess
          from pathlib import Path
          patch=Path(os.environ['RUNNER_TEMP'])/'connect-parity.patch'
          rows=subprocess.check_output(['git','apply','--numstat',str(patch)],text=True).splitlines()
          paths=sorted(set(row.split('\t',2)[2] for row in rows))
          assert len(paths)>=1, 'No source paths found in patch'
          manifest={p:(hashlib.sha256(Path(p).read_bytes()).hexdigest() if Path(p).is_file() else None) for p in paths}
