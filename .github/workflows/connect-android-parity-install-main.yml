          print('PATCH_SOURCE_FILES',len(paths))
          PY_MANIFEST
          test -s native/PWA_ANDROID_FINAL_PARITY_REPORT.md
          test -s native/scripts/release/validate.mjs
          test -s .github/workflows/connect-android-parity-release.yml
          python3 - <<'PY_SIZE'
          from pathlib import Path
          p=Path('.github/workflows/connect-android-parity-release.yml')
          assert p.stat().st_size < 450000, 'Release workflow exceeds guarded size'
          print('RELEASE_WORKFLOW_BYTES',p.stat().st_size)
          PY_SIZE
      - name: Set up the reviewed Node.js environment
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: native/package-lock.json
      - name: Source lock, typechecks, unit regressions and UI build
        working-directory: native
        shell: bash
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          # Chromium headless shell must match the locally locked playwright-core version.
          # The media optimizer regression launches a real browser during npm test.
          npx --no-install playwright-core install --with-deps chromium
          node -e "const fs=require('node:fs');const p=require('playwright-core').chromium.executablePath();if(!fs.existsSync(p)){throw new Error('PLAYWRIGHT_CHROMIUM_MISSING '+p)}"
          node scripts/check-parity-source.mjs
          # App.tsx imports src/generated/pwa.ts, created by build:web.
          # Build first: this generated file is intentionally git-ignored.
          npm run build:web
          npm run typecheck:web
          npm run typecheck
          npm test
          node scripts/check-parity-source.mjs
          git diff --check
      # The default GitHub Actions token cannot create/edit another workflow file.
      # Keep the release workflow as a tested standalone artifact for a manual GitHub UI upload.
      - name: Export verified release workflow for manual upload
        uses: actions/upload-artifact@v4
        with:
          name: connect-android-parity-release-yaml
          path: .github/workflows/connect-android-parity-release.yml
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
      - name: Commit tested Android sources directly to main (no pull request)
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'Chimera1988/connect-android'
          test "$GITHUB_REF" = 'refs/heads/main'
          expected_head="$(git rev-parse HEAD)"
          remote_head="$(git ls-remote origin refs/heads/main | cut -f1)"
          test -n "$remote_head"
          if [ "$remote_head" != "$expected_head" ]; then
            echo '::error::Main advanced during tests. No commit will be pushed; re-audit the changes.'
            exit 1
          fi
          # GitHub App token has no permission to create/update .github/workflows/*.
          # Commit only the 62 reviewed native/ files; distribute the 15 KB release workflow separately.
          git add -A -- native
          git diff --cached --check
          test -s native/PWA_ANDROID_FINAL_PARITY_REPORT.md
          test -s .github/workflows/connect-android-parity-release.yml
          if git diff --cached --quiet; then
            echo '::error::Expected Android changes were not staged; no changes pushed.'
            exit 1
          fi
          python3 - <<'PY_STAGED'
          import hashlib,json,os,subprocess
          from pathlib import Path
          manifest_path=Path(os.environ['RUNNER_TEMP'])/'connect-parity-manifest.json'
          expected=json.loads(manifest_path.read_text())
          release_yaml='.github/workflows/connect-android-parity-release.yml'
          assert release_yaml in expected, 'Missing expected release workflow from audited patch'
          changed=set(subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines())
          expected_staged=set(expected)-{release_yaml}
          if changed!=expected_staged:
              raise SystemExit(f'UNEXPECTED_STAGED_FILES: missing={sorted(expected_staged-changed)}, extra={sorted(changed-expected_staged)}')
          if any(name.startswith('.github/workflows/') for name in changed):
              raise SystemExit('WORKFLOW_PERMISSION_GUARD: refusing to stage GitHub workflow files')
          for name,sha in expected.items():
              p=Path(name)
              actual=hashlib.sha256(p.read_bytes()).hexdigest() if p.is_file() else None
              if actual!=sha:
                  raise SystemExit(f'SOURCE_CHANGED_DURING_TESTS: {name}')
          print('VERIFIED_EXACT_PATCH_FILES:',len(expected))
          print('STAGED_ANDROID_SOURCE_FILES:',len(changed))
          print('RELEASE_WORKFLOW_EXPORTED_SEPARATELY:',release_yaml)
          PY_STAGED
          git -c user.name='Connect Codex Installer' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m 'Android: install verified PWA parity sources (release YAML separate)'
          # Normal non-force push; rejects remote updates and protected-branch restrictions.
          git push origin HEAD:refs/heads/main
          echo '## Connect Android source install' >> "$GITHUB_STEP_SUMMARY"
          echo "Tested source changes committed directly to main: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
          echo 'No APK was built, installed or published, and no Expo OTA was pushed.' >> "$GITHUB_STEP_SUMMARY"
          echo 'NEXT: Download the connect-android-parity-release-yaml artifact from this run. Upload the contained connect-android-parity-release.yml manually to .github/workflows/ on main through the GitHub UI. This separate upload is required because GITHUB_TOKEN cannot create workflow files.' >> "$GITHUB_STEP_SUMMARY"
          echo 'After that, run Connect Android parity release in check mode, then apk mode for native changes.' >> "$GITHUB_STEP_SUMMARY"
