# Connect Android: reproducible APK build + one-time cleanup of obsolete workflows.
# Cleanup requires repository secret CONNECT_WORKFLOW_CLEANUP_TOKEN:
# Fine-grained PAT limited to this repository, Contents (read/write) and Workflows (read/write).
# No old workflow is deleted unless the APK was built, verified and uploaded successfully.
name: Connect Android — Build APK and clean old workflows

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'native/**'
      - '.github/workflows/connect-android-build.yml'

permissions:
  contents: read

concurrency:
  group: connect-android-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'Chimera1988/connect-android' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
      EXPO_PUBLIC_SUPABASE_URL: 'https://tpwkmoxxzjfdsqsomhhr.supabase.co'
      EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: 'sb_publishable_tAg8rPwuBNcA2iPF7voc2Q_vsKUpyZa'
      EXPO_PUBLIC_CONNECT_URL: 'https://connect-chat.duckdns.org'
      CONNECT_PREVIOUS_CERT_SHA256: ${{ vars.CONNECT_PREVIOUS_CERT_SHA256 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: native/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
      - name: Install Android SDK
        run: sdkmanager --channel=3 'platforms;android-37.0' 'build-tools;37.0.0' 'platform-tools'
      - name: Verify existing sources and test
        working-directory: native
        shell: bash
        run: |
          set -euo pipefail
          # Build what is actually committed in main. No embedded patch or remote PWA sync.
          node - <<'NODE'
          const app = require('./app.json').expo;
          if (app.android.package !== 'com.connect.messenger' || app.android.versionCode < 19)
            throw Error('Unexpected Android package or versionCode');
          console.log('Building Connect', app.version, '(', app.android.versionCode, ')');
          NODE
          npm ci --no-audit --no-fund
          node scripts/verify-builtin-sounds.cjs
          node scripts/generate-call-policy.cjs --check
          npm run build:web
          npm run typecheck
          npm run typecheck:web
          npm test -- --test-isolation=none
          CHROMIUM_PATH="$(command -v google-chrome || command -v chromium)" npm run test:browser
      - name: Restore original signing key if configured
        shell: bash
        env:
          CONNECT_RELEASE_KEYSTORE_BASE64: ${{ secrets.CONNECT_RELEASE_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [[ -n "$CONNECT_RELEASE_KEYSTORE_BASE64" ]]; then
            umask 077
            printf '%s' "$CONNECT_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/connect-release.jks"
            echo "CONNECT_RELEASE_KEYSTORE_FILE=$RUNNER_TEMP/connect-release.jks" >> "$GITHUB_ENV"
          else
            echo '::warning::Release signing key absent; verify certificate compatibility before installing.'
          fi
      - name: Compile Android release and run native checks
        working-directory: native
        shell: bash
        env:
          CONNECT_RELEASE_STORE_PASSWORD: ${{ secrets.CONNECT_RELEASE_STORE_PASSWORD }}
          CONNECT_RELEASE_KEY_ALIAS: ${{ secrets.CONNECT_RELEASE_KEY_ALIAS }}
          CONNECT_RELEASE_KEY_PASSWORD: ${{ secrets.CONNECT_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          npx expo prebuild --platform android --no-install
          cd android
          chmod +x gradlew
          ./gradlew :app:testReleaseUnitTest :app:lintVitalRelease :app:assembleRelease -PreactNativeArchitectures=armeabi-v7a,arm64-v8a -Pkotlin.incremental=false --no-daemon --max-workers=2
      - name: Verify and package APK
        working-directory: native
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ../release/connect
          cp android/app/build/outputs/apk/release/app-release.apk ../release/connect/Connect.apk
          python3 scripts/verify-apk.py ../release/connect/Connect.apk ../release/connect
          python3 - <<'PYVERIFY'
          import json
          from pathlib import Path
          report=json.loads(Path('../release/connect/APK-VERIFICATION.json').read_text())
          if report.get('matchesPreviousArtifactCertificate') is not True:
              raise SystemExit('Release certificate does not match the verified previous Connect Android build')
          PYVERIFY
          git rev-parse HEAD > ../release/connect/SOURCE-COMMIT.txt
          cp SOUNDS_301_REPORT.md ../release/connect/
          (cd ../release/connect && zip -9 ../Connect-Android.zip ./*)
      - name: Upload verified APK
        uses: actions/upload-artifact@v4
        with:
          name: Connect-Android-APK
          path: release/Connect-Android.zip
          if-no-files-found: error
          retention-days: 30
      - name: Remove temporary signing material
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/connect-release.jks"

  cleanup:
    name: Remove obsolete workflows after successful APK build
    needs: build
    if: github.repository == 'Chimera1988/connect-android' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.CONNECT_WORKFLOW_CLEANUP_TOKEN || github.token }}
      - name: Delete all older YAML workflows, keep only this builder
        shell: bash
        env:
          CLEANUP_TOKEN: ${{ secrets.CONNECT_WORKFLOW_CLEANUP_TOKEN }}
        run: |
          set -euo pipefail
          git pull --ff-only origin main
          python3 - <<'PY'
          from pathlib import Path
          import os, subprocess
          keep = Path('.github/workflows/connect-android-build.yml')
          assert keep.is_file(), 'The new build workflow is missing; refusing deletion'
          tracked = subprocess.check_output(['git', 'ls-files', '-z', '.github/workflows']).decode().split('\0')
          old = [p for p in tracked if p and Path(p) != keep and Path(p).suffix in ('.yml', '.yaml')]
          for p in old:
              assert Path(p).parent == keep.parent, 'Refusing out-of-directory deletion'
          print('Obsolete workflow files:', len(old))
          for p in old: print('  delete:', p)
          if old:
              if not os.environ.get('CLEANUP_TOKEN'):
                  raise SystemExit('Missing secret CONNECT_WORKFLOW_CLEANUP_TOKEN (Contents write + Workflows write); existing workflows remain untouched')
              subprocess.run(['git', 'rm', '--', *old], check=True)
          PY
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Remove obsolete Android Actions workflows; keep one build [skip ci]'
            git push origin HEAD:main
          else
            echo 'No old workflows remain.'
          fi
          test "$(find .github/workflows -maxdepth 1 -type f \( -name '*.yml' -o -name '*.yaml' \) | wc -l)" -eq 1
          echo 'Workflow cleanup committed successfully.' >> "$GITHUB_STEP_SUMMARY"
